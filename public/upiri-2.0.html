<style>
*{box-sizing:border-box}
body{margin:0;background:#EDF2F8;font-family:'Inter',system-ui,-apple-system,sans-serif;color:#1D1B4B;-webkit-font-smoothing:antialiased}
a{color:#2C2A6B;text-decoration:none}a:hover{color:#F5821F}
button{font-family:inherit}
input,select{font-family:inherit;color:#1D1B4B}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.12);opacity:1}}
@keyframes breatheSlow{0%,100%{transform:scale(1);opacity:.28}50%{transform:scale(1.25);opacity:.55}}
@keyframes lungBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes drift{0%{transform:translateY(30px);opacity:0}20%{opacity:.65}100%{transform:translateY(-180px);opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes drawPath{from{stroke-dashoffset:3400}to{stroke-dashoffset:0}}
@keyframes confettiFall{0%{transform:translateY(-16px) rotate(0deg);opacity:1}100%{transform:translateY(92vh) rotate(660deg);opacity:0}}
@keyframes tarFall{0%{transform:translateY(0);opacity:.8}100%{transform:translateY(20px);opacity:0}}
@keyframes tarDrift{from{transform:translate(0,0)}to{transform:translate(2px,4px)}}
@keyframes bounceY{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
@keyframes glowPulse{0%,100%{opacity:.45}50%{opacity:.9}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
@media print{body.print-cert *{visibility:hidden}body.print-cert .certificate,body.print-cert .certificate *{visibility:visible}body.print-cert .certificate{position:fixed;left:24px;top:24px;right:24px}}

/* ---------------------------------------------------------------------------
   Small-screen layout. The design is authored with inline styles for a desktop
   canvas, so these rules override the inline declarations for phone widths.
   Selectors match on the inline style text (and on data-r hooks where a block
   needs restructuring rather than resizing).
   --------------------------------------------------------------------------- */
@media (max-width:820px){
  /* multi-column grids collapse to one column … */
  x-dc [style*="grid-template-columns"]{grid-template-columns:1fr !important}
  /* … except the compact chip/tile grids, which stay side by side */
  x-dc [style*="repeat(6"]{grid-template-columns:repeat(3,1fr) !important}
  x-dc [style*="repeat(4"]{grid-template-columns:repeat(2,1fr) !important}
  /* long words and wide children must not stretch their track */
  x-dc [style*="grid-template-columns"]>*{min-width:0}
  /* pill rows (tabs, option chips, input+action pairs) wrap instead of overflowing */
  x-dc [style*="display:flex;gap:10px"],x-dc [style*="display:flex;gap:12px"]{flex-wrap:wrap}
  x-dc section,x-dc [style*="max-width:1150px"]{max-width:100% !important}
  x-dc [style*="padding:120px 24px 90px"]{padding:132px 16px 64px !important}
  x-dc [style*="padding:150px 24px 60px"]{padding:150px 16px 48px !important}
  x-dc [style*="padding:80px 24px 20px"]{padding:132px 16px 16px !important}
  x-dc [style*="padding:40px 24px 90px"],x-dc [style*="padding:56px 24px 40px"],
  x-dc [style*="padding:56px 24px 30px"]{padding-left:16px !important;padding-right:16px !important}
  x-dc [style*="padding:0 24px 34px"]{padding-left:16px !important;padding-right:16px !important}

  /* floating navbar: logo + space + Book on top, section links scroll below */
  x-dc [data-r="nav"]{padding:0 10px !important}
  x-dc [data-r="nav-pill"]{flex-wrap:wrap;row-gap:6px;border-radius:24px !important;padding:8px 10px !important}
  x-dc [data-r="nav-sep"]{display:none !important}
  x-dc [data-r="nav-links"]{order:3;width:100%;flex:1 0 100% !important;overflow-x:auto;scrollbar-width:none}
  x-dc [data-r="nav-links"]::-webkit-scrollbar{display:none}
  x-dc [data-r="nav-links"]>button{flex:0 0 auto}
  x-dc [data-r="nav-pill"]>button svg{width:26px;height:26px}
  x-dc [data-r="nav-pill"]>button span{font-size:16px !important}
  x-dc [data-r="nav-space"]{margin-left:auto;max-width:112px;padding:6px 10px !important;font-size:11.5px !important;
    text-overflow:ellipsis;background-position:right 8px center !important}
  x-dc [data-r="nav-book"]{margin-left:6px !important;padding:7px 12px !important;font-size:12px !important}

  /* nodule journey: the 920px illustrated path becomes a plain vertical stack */
  x-dc [data-r="journey"]{height:auto !important}
  x-dc [data-r="journey"]>svg{display:none !important}
  x-dc [data-r="journey-cards"]{position:static !important;transform:none !important;
    width:100% !important;height:auto !important;display:flex;flex-direction:column;align-items:center;gap:12px}
  x-dc [data-r="journey-cards"]>div{position:static !important;left:auto !important;top:auto !important;width:100% !important}
  x-dc [data-r="journey-cards"]>div[style*="border-radius:50%"]{width:52px !important;height:52px !important;flex:0 0 auto}

  /* oversized decorative rings inside the hero / result stages */
  x-dc [style*="min-height:460px"]{min-height:340px !important}
  x-dc [style*="width:460px;height:460px"]{width:300px !important;height:300px !important}
  x-dc [style*="width:400px;height:400px"]{width:264px !important;height:264px !important}
  x-dc [style*="width:300px;height:300px"]{width:210px !important;height:210px !important}
  /* hero stat chips hang off the lung stage by design; pull them inside the screen */
  x-dc [style*="top:36px;right:-8px"]{top:8px !important;right:0 !important}
  x-dc [style*="bottom:52px;left:-14px"]{bottom:8px !important;left:0 !important}
  x-dc [style*="top:120px;left:-30px"]{top:96px !important;left:0 !important}
}
@media (max-width:520px){
  x-dc [style*="repeat(4"]{grid-template-columns:repeat(2,1fr) !important}
  x-dc [style*="font-size:clamp"]{overflow-wrap:break-word}
}
</style>

        <div style="font-size:12px;line-height:1.65;color:#6C6A9E"><strong style="color:#2C2A6B">Scientific basis.</strong> Spirometry mode uses the lung-age equations of Morris JF &amp; Temple W, <em>"Spirometric 'lung age' estimation for motivating smoking cessation"</em>, Preventive Medicine 1985;14(5):655–662. Reference populations differ from Indian norms, so treat the result as an indicative motivator, not a diagnosis. The quick quiz is a lifestyle-awareness score informed by established risk-factor models (PLCO, Liverpool Lung Project); it does not measure lung function. Lab spirometry at the Advanced Lung Function Laboratory gives exact values.</div>

  <!-- ============ NODULE JOURNEY ============ -->

          <div style="font-family:'Noto Sans Telugu',sans-serif;font-size:13px;color:#8A88B8">నాడ్యూల్ కనబడింది — తర్వాత ఏంటి?</div>
        </div>

      <div style="display:grid;grid-template-columns:1.2fr 0.8fr;gap:18px;margin-bottom:56px">
        <div style="padding:28px 30px;border-radius:26px;background:linear-gradient(150deg,#2C2A6B,#37348F);box-shadow:0 24px 60px -24px rgba(29,27,75,0.5);animation:fadeUp .5s ease both">
          <div style="display:flex;align-items:center;gap:10px;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:20px;color:#fff">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFB067" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>

          </div>
          <p style="font-size:14.5px;line-height:1.6;color:#C9D2E6;margin:12px 0 18px">Any nodule found anywhere — our hospital, another hospital, any lab — gets a guaranteed Nodule Clinic appointment within 48–72 hours. Bring the report; we handle the rest.</p>
          <a href="{{ wa.journeyFast }}" target="_blank" rel="noreferrer" style="display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:999px;font-size:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,#F5821F,#FFA452);box-shadow:0 12px 30px -10px rgba(245,130,31,0.7);transition:transform .18s ease" style-hover="transform:translateY(-2px);color:#fff">

            Fast-track my report

        <div style="padding:28px 30px;border-radius:26px;background:rgba(227,242,233,0.85);border:1px solid rgba(47,143,91,0.25);backdrop-filter:blur(12px);animation:fadeUp .5s ease .15s both">

            First, breathe:
          </div>

        </div>

      <!-- WINDING JOURNEY PATH -->

          <div style="position:absolute;left:632px;top:112px;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#F5821F,#FFA452);color:#fff;box-shadow:0 14px 30px -8px rgba(245,130,31,0.65);animation:popIn .5s ease .4s both;z-index:2">

            <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><span style="font-size:12px;font-weight:700;padding:5px 13px;border-radius:999px;background:#FDEBD9;color:#B35A08">Day 0</span><span style="font-size:11.5px;font-weight:700;color:#B9C3D6">Step 1 of 6</span></div>
            <div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:19px;color:#2C2A6B">The X-ray</div>
            <p style="font-size:13.5px;line-height:1.6;color:#4A4880;margin:7px 0 0">A routine 2-minute chest X-ray — walk-in, at the hospital, a camp, or a partner lab. Your radiologist reads it, and Qure.ai's qXR reads it again. Two readings on every film.</p>

      <!-- STEP 0: SYMPTOMS -->
      <sc-if value="{{ tS0 }}" hint-placeholder-val="{{ true }}">
        <div style="animation:popIn .4s cubic-bezier(.16,1,.3,1) both">

                <span style="font-size:13.5px;font-weight:700;line-height:1.3;color:#2C2A6B">{{ t.l }}</span>
                <span style="font-family:'Noto Sans Telugu',sans-serif;font-size:11px;color:#8A88B8">{{ t.te }}</span>
              </button>
            </sc-for>
          </div>
          <sc-for list="{{ tFollowRows }}" as="f" hint-placeholder-count="0">
            <div style="margin-top:20px;padding:18px 22px;border-radius:20px;background:rgba(255,255,255,0.7);border:1px solid rgba(44,42,107,0.1);animation:fadeUp .3s ease both">

              <div style="display:flex;gap:10px;flex-wrap:wrap">
                <sc-for list="{{ f.opts }}" as="o" hint-placeholder-count="2"><button onClick="{{ o.pick }}" style="{{ o.st }}">{{ o.label }}</button></sc-for>
              </div>
            </div>
          </sc-for>
          <div style="margin-top:32px;display:flex;justify-content:flex-end;align-items:center;gap:14px">
            <sc-if value="{{ tNoneSel }}" hint-placeholder-val="{{ false }}"><span style="font-size:12.5px;color:#8A88B8">Select at least one symptom to continue.</span></sc-if>

          <div style="margin-top:32px;display:flex;justify-content:flex-end">
            <button onClick="{{ tNext }}" style="{{ tCont1St }}">See my guidance<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></button>
          </div>
        </div>

            <span style="font-size:12px;font-weight:700;padding:6px 14px;border-radius:999px;background:rgba(107,213,155,0.14);border:1px solid rgba(107,213,155,0.4);color:#B7E4CB">Marathoners &amp; cyclists</span>
          </div>
          <h2 style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(28px,3.8vw,44px);letter-spacing:-0.02em;line-height:1.08;color:#fff;margin:0;max-width:560px;text-wrap:balance">Ready for thin air — before you climb.</h2>
          <p style="font-size:15px;line-height:1.65;color:#DCE9F8;max-width:560px;margin:14px 0 0">At 3,500 m, every breath carries roughly a third less oxygen than at sea level. Healthy lungs adapt. Hidden heart or lung limitations — the kind you never notice in the city — tend to surface above ~2,500 m, on the trail, far from help. A physician-signed fitness assessment protects the trip you've been planning for years.</p>

      <!-- RISKS -->
      <h3 style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:22px;color:#2C2A6B;margin:40px 0 6px">Know the three altitude illnesses</h3>
      <p style="font-size:14px;color:#4A4880;margin:0 0 18px">All three are preventable and treatable when recognised early. The goal of learning them is confidence, not fear.</p>

          <div style="display:flex;align-items:center;justify-content:space-between">
            <div style="width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:#E7E7F4;color:#2C2A6B"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"></path><path d="M9.6 4.6A2 2 0 1 1 11 8H2"></path><path d="M12.6 19.4A2 2 0 1 0 14 16H2"></path></svg></div>
            <span style="font-size:12px;font-weight:700;padding:5px 13px;border-radius:999px;background:#FDEBD9;color:#B35A08">AMS</span>
          </div>
          <div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:17px;color:#2C2A6B">Acute Mountain Sickness <span style="font-family:'Noto Sans Telugu',sans-serif;font-size:11.5px;font-weight:600;color:#8A88B8">ఎత్తు అనారోగ్యం</span></div>
          <p style="margin:0;font-size:13.5px;line-height:1.55;color:#4A4880">The most common altitude illness — the body protesting a fast ascent above ~2,500 m.</p>
          <div style="font-size:11px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:#8A88B8;margin-top:4px">Warning signs</div>
          <div style="font-size:13.5px;line-height:1.7;color:#4A4880">Headache · Nausea, poor appetite · Poor sleep, fatigue · Dizziness</div>
          <div style="font-size:12px;color:#8A88B8"><strong>Higher risk:</strong> Fast ascent, no rest days, previous AMS.</div>
          <div style="font-size:12.5px;line-height:1.55;color:#3A3870;background:#EAF2FB;border-radius:14px;padding:12px 14px;margin-top:auto">Usually settles with rest and no further ascent. It's a signal to pause — not panic.</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:10px;padding:26px;border-radius:26px;border:1px solid rgba(255,255,255,0.9);background:rgba(255,255,255,0.75);backdrop-filter:blur(16px);box-shadow:0 24px 56px -26px rgba(29,27,75,0.3)">

            <div style="width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:#E7E7F4;color:#2C2A6B"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"></path></svg></div>
            <span style="font-size:12px;font-weight:700;padding:5px 13px;border-radius:999px;background:#FBE7E5;color:#CE4438">HAPE</span>
          </div>
          <div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:17px;color:#2C2A6B">High-Altitude Pulmonary Edema <span style="font-family:'Noto Sans Telugu',sans-serif;font-size:11.5px;font-weight:600;color:#8A88B8">ఊపిరితిత్తుల్లో నీరు</span></div>
          <p style="margin:0;font-size:13.5px;line-height:1.55;color:#4A4880">Fluid collecting in the lungs at altitude — uncommon, but the most dangerous lung emergency up there.</p>
          <div style="font-size:11px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:#8A88B8;margin-top:4px">Warning signs</div>
          <div style="font-size:13.5px;line-height:1.7;color:#4A4880">Breathless even at rest · Cough (sometimes frothy/pink) · Chest tightness · Exhaustion out of proportion</div>
          <div style="font-size:12px;color:#8A88B8"><strong>Higher risk:</strong> Rapid ascent, existing lung conditions, previous HAPE, heavy exertion on arrival day.</div>
          <div style="font-size:12.5px;line-height:1.55;color:#3A3870;background:#FBE7E5;border-radius:14px;padding:12px 14px;margin-top:auto">A medical emergency: descend and seek help immediately. Recognising it early saves lives.</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:10px;padding:26px;border-radius:26px;border:1px solid rgba(255,255,255,0.9);background:rgba(255,255,255,0.75);backdrop-filter:blur(16px);box-shadow:0 24px 56px -26px rgba(29,27,75,0.3)">
          <div style="display:flex;align-items:center;justify-content:space-between">
            <div style="width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:#E7E7F4;color:#2C2A6B"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"></path><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"></path></svg></div>
            <span style="font-size:12px;font-weight:700;padding:5px 13px;border-radius:999px;background:#FBE7E5;color:#CE4438">HACE</span>
          </div>
          <div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:17px;color:#2C2A6B">High-Altitude Cerebral Edema <span style="font-family:'Noto Sans Telugu',sans-serif;font-size:11.5px;font-weight:600;color:#8A88B8">మెదడు వాపు</span></div>

            <div style="display:flex;gap:10px;background:#EAF2FB;border-radius:16px;padding:14px 16px"><strong style="color:#2C2A6B;flex-shrink:0">Spirometry</strong>Full lung-function testing — how much air your lungs move, and how fast.</div>
            <div style="display:flex;gap:10px;background:#EAF2FB;border-radius:16px;padding:14px 16px"><strong style="color:#2C2A6B;flex-shrink:0">CPET / CPET-lite</strong>Cardio-pulmonary exercise testing: how your heart and lungs perform under load — with VO₂max for athletes.</div>

          <div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:19px;color:#2C2A6B;margin-bottom:16px">Who should get assessed?</div>
          <div style="display:flex;flex-direction:column;gap:11px;font-size:14px;line-height:1.55;color:#4A4880;flex:1">
            <div style="display:flex;gap:10px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2F8F5B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:3px"><path d="M20 6 9 17l-5-5"></path></svg>Pilgrims 45+ heading to Chardham, Amarnath or Kailash — especially first-timers</div>

            <div style="display:flex;gap:10px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2F8F5B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:3px"><path d="M20 6 9 17l-5-5"></path></svg>First-time high-altitude trekkers (Ladakh, Spiti, Everest Base Camp)</div>

      <p style="font-size:12px;color:#8A88B8;margin-top:18px;line-height:1.6">An assessment reduces surprises; it doesn't replace safe ascent practice. Acclimatise gradually, hydrate, and never ignore symptoms on the mountain. This page is education, not a diagnosis.</p>

      gzVal: gzHas ? String(cs.today) : '—', gzUnit: isPef ? 'L/min' : '% SpO₂', gzMinL: String(gzMin), gzMaxL: String(gzMax),
      metricTitle: isPef ? 'Peak flow' : 'SpO₂', metricPlaceholder: isPef ? 'e.g., 410' : 'e.g., 96',
