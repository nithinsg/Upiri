<style>
*{box-sizing:border-box}
body{margin:0;background:#EDF2F8;font-family:'Inter',system-ui,-apple-system,sans-serif;color:#1D1B4B;-webkit-font-smoothing:antialiased}
a{color:#2C2A6B;text-decoration:none}a:hover{color:#F5821F}
button{font-family:inherit}
input,select{font-family:inherit;color:#1D1B4B}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.12);opacity:1}}
@keyframes breatheSlow{0%,100%{transform:scale(1);opacity:.28}50%{transform:scale(1.25);opacity:.55}}
@keyframes lungBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes drift{0%{transform:translateY(30px);opacity:0}20%{opacity:.65}100%{transform:translateY(-180px);opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes drawPath{from{stroke-dashoffset:3400}to{stroke-dashoffset:0}}
@keyframes confettiFall{0%{transform:translateY(-16px) rotate(0deg);opacity:1}100%{transform:translateY(92vh) rotate(660deg);opacity:0}}
@keyframes tarFall{0%{transform:translateY(0);opacity:.8}100%{transform:translateY(20px);opacity:0}}
@keyframes tarDrift{from{transform:translate(0,0)}to{transform:translate(2px,4px)}}
@keyframes bounceY{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
@keyframes glowPulse{0%,100%{opacity:.45}50%{opacity:.9}}

/* ---------------------------------------------------------------------------
   Motion. Restrained by design: entrances are short, loops are slow and wide,
   and everything below is disabled outright under prefers-reduced-motion.
   --------------------------------------------------------------------------- */
@keyframes markSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes airflow{to{stroke-dashoffset:-38}}
@keyframes revealUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes pulseRing{0%{transform:scale(.9);opacity:.55}70%{transform:scale(1.25);opacity:0}100%{opacity:0}}

@media (prefers-reduced-motion: no-preference){
  /* The Yashoda mark turns continuously at one constant speed: linear, infinite,
     no easing and no hover variation, so it reads as a steady presence rather
     than an effect. A transform-only animation stays on the compositor. */
  x-dc [data-r="brand-mark"]{animation:markSpin 20s linear infinite;transform-origin:50% 50%;will-change:transform}

  /* sections arrive as they scroll into view, where the browser supports it */
  @supports (animation-timeline: view()){
    x-dc main section{animation:revealUp .7s cubic-bezier(.16,1,.3,1) both;animation-timeline:view();animation-range:entry 0% entry 45%}
  }

  /* cards in a grid stagger slightly so a group reads as one movement */
  x-dc [style*="grid-template-columns"]>article,
  x-dc [style*="grid-template-columns"]>button,
  x-dc [style*="grid-template-columns"]>section{animation:popIn .5s cubic-bezier(.16,1,.3,1) both}
  x-dc [style*="grid-template-columns"]>*:nth-child(2){animation-delay:.06s}
  x-dc [style*="grid-template-columns"]>*:nth-child(3){animation-delay:.12s}
  x-dc [style*="grid-template-columns"]>*:nth-child(4){animation-delay:.18s}
  x-dc [style*="grid-template-columns"]>*:nth-child(5){animation-delay:.24s}
  x-dc [style*="grid-template-columns"]>*:nth-child(6){animation-delay:.3s}
  x-dc [style*="grid-template-columns"]>*:nth-child(n+7){animation-delay:.36s}

  /* air moving down the airways of the hero lungs */
  x-dc [data-r="airway"]{stroke-dasharray:7 12;animation:airflow 2.6s linear infinite}

  /* the live indicator on the nodule pathway */
  x-dc [data-r="pulse"]{animation:pulseRing 2.8s ease-out infinite}
}
@media (prefers-reduced-motion: reduce){
  x-dc [data-r="brand-mark"]{animation:none}
}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
@media print{body.print-cert *{visibility:hidden}body.print-cert .certificate,body.print-cert .certificate *{visibility:visible}body.print-cert .certificate{position:fixed;left:24px;top:24px;right:24px}}

/* Keyboard focus. Nearly every control here is styled inline with its own
   border, so the browser default ring is easy to lose against the glass
   surfaces. One explicit high-contrast ring is drawn for keyboard users only
   (:focus-visible, never on a mouse click), outside the control so a rounded
   corner cannot clip it. */
x-dc button:focus-visible,x-dc a:focus-visible,x-dc select:focus-visible,
x-dc input:focus-visible,x-dc textarea:focus-visible,x-dc [tabindex]:focus-visible{
  outline:3px solid #F5821F;outline-offset:3px;border-radius:10px}
x-dc [data-r="nav-pill"] button:focus-visible,x-dc [data-r="nav-pill"] a:focus-visible{outline-offset:2px}
/* Press feedback. Hover does not exist on a touch screen, so every control also
   dims very slightly while it is held — a filter rather than a transform, so it
   cannot fight the hover transforms the design already uses. */
x-dc button:active,x-dc a:active{filter:brightness(0.95)}

/* Reading language: the page stack is Latin-first, so when a local language is
   chosen the matching Noto face leads it. Headings carry their own inline family,
   so they get the script face appended as a fallback rather than replaced. */
html[lang="te"] x-dc{font-family:'Noto Sans Telugu','Inter',system-ui,sans-serif}
html[lang="kn"] x-dc{font-family:'Noto Sans Kannada','Inter',system-ui,sans-serif}
html[lang="bn"] x-dc{font-family:'Noto Sans Bengali','Inter',system-ui,sans-serif}
html[lang="te"] x-dc [style*="Bricolage"]{font-family:'Bricolage Grotesque','Noto Sans Telugu',sans-serif !important}
html[lang="kn"] x-dc [style*="Bricolage"]{font-family:'Bricolage Grotesque','Noto Sans Kannada',sans-serif !important}
html[lang="bn"] x-dc [style*="Bricolage"]{font-family:'Bricolage Grotesque','Noto Sans Bengali',sans-serif !important}

/* The navbar link row absorbs any squeeze by scrolling, so the space selector
   and the Book CTA are never pushed off the right edge at any width. */
x-dc [data-r="nav-links"]{min-width:0;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
x-dc [data-r="nav-links"]::-webkit-scrollbar{display:none}
x-dc [data-r="nav-links"]>button{flex:0 0 auto}

/* ---------------------------------------------------------------------------
   Small-screen layout. The design is authored with inline styles for a desktop
   canvas, so these rules override the inline declarations for phone widths.
   Selectors match on the inline style text (and on data-r hooks where a block
   needs restructuring rather than resizing).
   --------------------------------------------------------------------------- */
@media (max-width:820px){
  /* On a phone the decorative lung stage and the drifting dust sit between the
     patient and the questions, so they go: the hero says who we are and what to
     do, and "What brings you here today?" follows immediately. Both are
     aria-hidden decoration, so a reader loses nothing. */
  x-dc [data-r="hero-stage"],x-dc [data-r="hero-dust"]{display:none !important}
  x-dc [data-r="hero"]{min-height:0 !important}
  /* the capability chips keep their content but stop costing four rows of height,
     so "What brings you here today?" sits just under the first screen */
  x-dc [data-r="hero-chips"]{flex-wrap:nowrap !important;overflow-x:auto;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;padding-bottom:22px !important}
  x-dc [data-r="hero-chips"]::-webkit-scrollbar{display:none}
  x-dc [data-r="hero-chips"]>span{flex:0 0 auto}
  x-dc [data-r="hero-chips"]>span:last-child{display:none}   /* the scroll hint */

  /* multi-column grids collapse to one column … */
  x-dc [style*="grid-template-columns"]{grid-template-columns:1fr !important}
  /* … except the compact chip/tile grids, which stay side by side */
  x-dc [style*="repeat(6"]{grid-template-columns:repeat(3,1fr) !important}
  x-dc [style*="repeat(4"]{grid-template-columns:repeat(2,1fr) !important}
  /* long words and wide children must not stretch their track */
  x-dc [style*="grid-template-columns"]>*{min-width:0}
  /* pill rows (tabs, option chips, input+action pairs) wrap instead of overflowing */
  x-dc [style*="display:flex;gap:10px"],x-dc [style*="display:flex;gap:12px"]{flex-wrap:wrap}
  x-dc section,x-dc [style*="max-width:1150px"]{max-width:100% !important}
  x-dc [style*="padding:120px 24px 90px"]{padding:132px 16px 64px !important}
  x-dc [style*="padding:128px 24px 40px"]{padding:108px 16px 30px !important}
  x-dc [style*="padding:80px 24px 20px"]{padding:132px 16px 16px !important}
  x-dc [style*="padding:40px 24px 90px"],x-dc [style*="padding:56px 24px 40px"],
  x-dc [style*="padding:56px 24px 30px"]{padding-left:16px !important;padding-right:16px !important}
  x-dc [style*="padding:0 24px 24px"]{padding-left:16px !important;padding-right:16px !important}

  /* floating navbar: logo + space + Book on top, section links scroll below */
  x-dc [data-r="nav"]{padding:0 10px !important}
  x-dc [data-r="nav-pill"]{flex-wrap:wrap;row-gap:6px;border-radius:24px !important;padding:8px 10px !important}
  x-dc [data-r="nav-sep"]{display:none !important}
  x-dc [data-r="nav-links"]{order:3;width:100%;flex:1 0 100% !important;overflow-x:auto;scrollbar-width:none}
}
@media (max-width:1460px){
  /* the Yashoda lockup costs width; drop its unit line, then the lockup itself */
  x-dc [data-r="nav-brand"]>span>span:last-child{display:none}
  x-dc [data-r="nav-links"]>button{padding:8px 9px !important;font-size:13px !important}
}
@media (max-width:900px){
  /* Phone toolbar: menu button left · ŪPIRI centred · Yashoda mark + Book right.
     The brand is centred against the pill itself rather than against whatever
     happens to sit either side of it, so it stays put as the sides change. */
  x-dc [data-r="nav-links"]{display:none !important}
  x-dc [data-r="nav-space"]{display:none !important}
  x-dc [data-r="nav-lang-wrap"]{display:none !important}   /* language lives in the sheet */
  x-dc [data-r="nav-pill"]{position:relative;flex-wrap:nowrap !important;justify-content:space-between;
    padding:8px 10px !important}
  x-dc [data-r="nav-burger"]{display:flex !important;order:1;flex:0 0 auto}
  /* Centred against the pill itself — left:50% + translate(-50%) is measured on
     the pill, so the lockup does not drift when the menu button or the CTA
     changes width (language, icon-only CTA, open or closed menu). */
  x-dc [data-r="nav-home"]{order:2;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    padding:0 !important;gap:8px !important}
  x-dc [data-r="nav-pill"]>[data-r="nav-home"] svg{width:42px !important;height:42px !important}
  x-dc [data-r="nav-pill"] [data-r="nav-word"]{font-size:25px !important}
  /* The Yashoda mark rides beside the menu button rather than opposite it. The
     lockup was already dead-centre in the viewport, but with a heavy cluster on
     the right and only the menu button on the left the whitespace either side
     was 104px vs 70px, which reads as "pushed right". Balancing the two sides
     makes true centring look centred. */
  x-dc [data-r="nav-brand"]{display:flex !important;order:2;margin-left:6px !important;
    margin-right:auto !important;padding-left:0 !important;border-left:none !important}
  x-dc [data-r="nav-brand"]>span{display:none !important}
  x-dc [data-r="nav-pill"] [data-r="brand-mark"]{height:28px !important}
  x-dc [data-r="nav-book"]{order:4}
}
@media (min-width:901px) and (max-width:1150px){
  x-dc [data-r="nav-brand"]{display:none !important}
}
@media (max-width:1180px){
  x-dc [data-r="nav-links"]{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  x-dc [data-r="nav-links"]::-webkit-scrollbar{display:none}
  x-dc [data-r="nav-links"]>button{flex:0 0 auto;padding:8px 10px !important;font-size:13px !important}
  x-dc [data-r="nav-links"]::-webkit-scrollbar{display:none}
  x-dc [data-r="nav-links"]>button{flex:0 0 auto}
  x-dc [data-r="nav-pill"]>button svg{width:26px;height:26px}
  x-dc [data-r="nav-pill"]>button span{font-size:16px !important}
  x-dc [data-r="nav-space"]{margin-left:auto;max-width:112px;padding:6px 10px !important;font-size:11.5px !important;
    text-overflow:ellipsis;background-position:right 8px center !important}
  x-dc [data-r="nav-book"]{margin-left:6px !important;padding:7px 12px !important;font-size:12px !important}

  /* nodule journey: the 920px illustrated path becomes a plain vertical stack */
  x-dc [data-r="journey"]{height:auto !important}
  x-dc [data-r="journey"]>svg{display:none !important}
  x-dc [data-r="journey-cards"]{position:static !important;transform:none !important;
    width:100% !important;height:auto !important;display:flex;flex-direction:column;align-items:center;gap:12px}
  x-dc [data-r="journey-cards"]>div{position:static !important;left:auto !important;top:auto !important;width:100% !important}
  x-dc [data-r="journey-cards"]>div[style*="border-radius:50%"]{width:52px !important;height:52px !important;flex:0 0 auto}

  /* oversized decorative rings inside the hero / result stages */
  x-dc [style*="min-height:412px"]{min-height:330px !important}
  x-dc [style*="width:460px;height:460px"]{width:300px !important;height:300px !important}
  x-dc [style*="width:400px;height:400px"]{width:264px !important;height:264px !important}
  x-dc [style*="width:300px;height:300px"]{width:210px !important;height:210px !important}
  /* hero stat chips hang off the lung stage by design; pull them inside the screen */
  x-dc [style*="top:36px;right:-8px"]{top:8px !important;right:0 !important}
  x-dc [style*="bottom:52px;left:-14px"]{bottom:8px !important;left:0 !important}
  x-dc [style*="top:120px;left:-30px"]{top:96px !important;left:0 !important}
}
@media (max-width:520px){
  x-dc [style*="repeat(4"]{grid-template-columns:repeat(2,1fr) !important}
  /* the headline is the loudest thing on a phone; a smaller setting keeps it to
     three lines and brings the questions up with it */
  x-dc [data-r="hero"] h1{font-size:31px !important;line-height:1.12 !important}
  x-dc [data-r="hero"] p{font-size:16px !important}
  x-dc [style*="font-size:clamp"]{overflow-wrap:break-word}
  /* the centred brand has the narrowest toolbars to live in: stack the lockup so
     it can never run into the menu button or the Book CTA */
  x-dc [data-r="nav-pill"] [data-r="nav-word"]{display:flex;flex-direction:column;align-items:center;
    line-height:1.02;font-size:23px !important}
  x-dc [data-r="nav-pill"] [data-r="nav-word"]>span{font-size:14px !important}
  x-dc [data-r="nav-pill"]>[data-r="nav-home"] svg{width:38px !important;height:38px !important}
  x-dc [data-r="nav-book"]{padding:8px 12px !important}
}
@media (max-width:380px){
  /* Narrowest phones: trim the CTA rather than the brand, but keep its label —
     an icon-only button on the right would unbalance the two sides again. */
  x-dc [data-r="nav-book"]{padding:8px 10px !important;font-size:11.5px !important;gap:5px !important}
  x-dc [data-r="nav-pill"] [data-r="nav-word"]{font-size:21px !important}
  x-dc [data-r="nav-pill"]>[data-r="nav-home"] svg{width:34px !important;height:34px !important}
}
</style>
</helmet>
<template data-dc-template>
<div style="min-height:100vh;background:radial-gradient(1000px 640px at 88% -8%, rgba(245,130,31,0.10), transparent 60%), radial-gradient(1100px 760px at -12% 34%, rgba(94,130,232,0.13), transparent 62%), radial-gradient(900px 640px at 60% 112%, rgba(44,42,107,0.09), transparent 60%), #EDF2F8">

  <!-- FLOATING GLASS NAVBAR -->
  <nav aria-label="Main" data-r="nav" style="position:fixed;top:16px;left:0;right:0;z-index:50;display:flex;justify-content:center;padding:0 24px">
    <div data-r="nav-pill" style="display:flex;align-items:center;gap:4px;background:rgba(255,255,255,0.74);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,0.9);border-radius:999px;padding:8px 10px 8px 16px;box-shadow:0 18px 50px -18px rgba(29,27,75,0.38);max-width:1150px;width:100%">
      <button data-r="nav-home" onClick="{{ goHome }}" aria-label="ŪPIRI home" style="display:flex;align-items:center;gap:10px;background:transparent;border:none;cursor:pointer;padding:2px 6px 2px 0">
        <svg width="32" height="32" viewBox="0 0 100 100" aria-hidden="true" style="color:#2C2A6B"><g stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M46 5v18c0 6-3 9-7 12"></path><path d="M54 5v18c0 6 3 9 7 12"></path><path d="M44 40c-2-9-9-13-17-8C16 39 8 57 9 73c1 12 8 19 18 17 10-2 16-11 17-24v-26z"></path><path d="M56 40c2-9 9-13 17-8 11 7 19 25 18 41-1 12-8 19-18 17-10-2-16-11-17-24v-26z"></path><path d="M39 35c-1 6-3 11-7 15" stroke-width="3.2"></path><path d="M36 43l-8 4" stroke-width="3.2"></path><path d="M32 50c-1 5-3 9-6 12" stroke-width="3.2"></path><path d="M61 35c1 6 3 11 7 15" stroke-width="3.2"></path><path d="M64 43l8 4" stroke-width="3.2"></path><path d="M68 50c1 5 3 9 6 12" stroke-width="3.2"></path></g><g fill="#F5821F"><path d="M35 32c-2-5-1-9 3-12 2 5 1 9-3 12z"></path><path d="M27 49c-5 2-9 1-12-3 5-2 9-1 12 3z"></path><path d="M25 64c-5 2-9 1-12-3 5-2 9-1 12 3z"></path><path d="M65 32c2-5 1-9-3-12-2 5-1 9 3 12z"></path><path d="M73 49c5 2 9 1 12-3-5-2-9-1-12 3z"></path><path d="M75 64c5 2 9 1 12-3-5-2-9-1-12 3z"></path></g></svg>
        <span data-r="nav-word" style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:19px;letter-spacing:-0.02em;white-space:nowrap;color:#1D1B4B">ŪPIRI <span style="font-family:'Noto Sans Telugu',sans-serif;font-size:13px;font-weight:600;color:#F5821F">ఊపిరి</span></span>
      </button>
      <span data-r="nav-brand" style="display:flex;align-items:center;gap:7px;padding-left:9px;margin-left:2px;border-left:1px solid rgba(44,42,107,0.16)">
        <sc-if value="{{ brandHasLogo }}" hint-placeholder-val="{{ true }}">
          <img data-r="brand-mark" src="{{ brandLogo }}" alt="" width="27" height="23" style="height:23px;width:auto;display:block">
        </sc-if>
        <span style="display:flex;flex-direction:column;line-height:1.05">
          <span style="font-size:11.5px;font-weight:800;letter-spacing:0.01em;color:#2C2A6B;white-space:nowrap">{{ brandName }}</span>
          <span style="font-size:9px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#6966A4">{{ brandUnit }}</span>
        </span>
      </span>
      <div data-r="nav-sep" style="width:1px;height:24px;background:rgba(44,42,107,0.14);margin:0 8px"></div>
      <div data-r="nav-links" style="display:flex;align-items:center;gap:2px;flex:1">
        <button onClick="{{ goKnowledge }}" aria-current="{{ curKnowledge }}" style="{{ navCareSt }}" style-hover="background:rgba(44,42,107,0.08)">Explore Care</button>
        <button onClick="{{ goFind }}" aria-current="{{ curFind }}" style="{{ navFind }}" style-hover="background:rgba(44,42,107,0.08)">Doctors</button>
        <button onClick="{{ goProcs }}" aria-current="{{ curProcs }}" style="{{ navProcs }}" style-hover="background:rgba(44,42,107,0.08)">Tests &amp; Procedures</button>
        <span style="position:relative;display:inline-block">
          <button onClick="{{ toggleTools }}" aria-haspopup="true" aria-expanded="{{ toolsExp }}" style="{{ navToolsSt }}" style-hover="background:rgba(44,42,107,0.08)">Tools ▾</button>
          <sc-if value="{{ menuTools }}" hint-placeholder-val="{{ false }}">
            <span data-r="menu" style="position:absolute;top:calc(100% + 10px);left:0;z-index:60;min-width:240px;display:flex;flex-direction:column;padding:8px;border-radius:18px;background:#fff;border:1px solid rgba(44,42,107,0.12);box-shadow:0 24px 60px -20px rgba(29,27,75,0.4)">
              <sc-for list="{{ navItems }}" as="i" hint-placeholder-count="8">
                <button onClick="{{ i.go }}" style="text-align:left;padding:11px 14px;border-radius:12px;border:none;background:transparent;cursor:pointer;font-size:13.5px;font-weight:600;color:#2C2A6B;white-space:nowrap" style-hover="background:rgba(44,42,107,0.07)">{{ i.t }}</button>
              </sc-for>
            </span>
          </sc-if>

          <a href="{{ wa.board }}" target="_blank" rel="noreferrer" style="display:inline-flex;align-items:center;gap:8px;padding:13px 24px;border-radius:999px;font-size:14.5px;font-weight:600;color:#2C2A6B;background:transparent;border:1.5px solid rgba(44,42,107,0.2);transition:background .15s ease" style-hover="background:rgba(44,42,107,0.06);color:#2C2A6B">Physicians: join the Nodule Board</a>
        </div>
      </div>
    </div>
  </div>

<!-- ============ SHIKHAR ============ -->
  <sc-if value="{{ isShikhar }}" hint-placeholder-val="{{ false }}">
  <div data-screen-label="Shikhar" style="min-height:100vh;padding:120px 24px 90px">
    <div style="max-width:1000px;margin:0 auto">
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:26px">
        <button onClick="{{ goHome }}" aria-label="Back" style="width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.8);border:1px solid rgba(44,42,107,0.12);color:#2C2A6B;cursor:pointer;transition:transform .15s ease" style-hover="transform:translateX(-3px)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
        </button>
        <div>
          <div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(24px,3vw,32px);letter-spacing:-0.02em;color:#2C2A6B">ŪPIRI Shikhar — Altitude Readiness</div>
          <div style="font-family:'Noto Sans Telugu',sans-serif;font-size:13px;color:#6966A4">శిఖరం — ఎత్తులకు మీ ఊపిరి సిద్ధమా?</div>
        </div>
      </div>

      <!-- MOUNTAIN HERO -->
      <div style="position:relative;border-radius:32px;overflow:hidden;background:linear-gradient(180deg,#1B2A5E 0%, #3A6EA5 55%, #7FB2E5 100%);box-shadow:0 30px 70px -28px rgba(29,27,75,0.55);animation:fadeUp .5s ease both">
        <svg width="100%" height="220" viewBox="0 0 1000 220" preserveAspectRatio="none" style="position:absolute;bottom:0;left:0" aria-hidden="true">
          <path d="M0 220 L180 90 L280 160 L420 40 L560 150 L700 70 L850 170 L1000 110 L1000 220 Z" fill="rgba(23,21,64,0.55)"></path>
          <path d="M0 220 L120 150 L260 200 L420 40 L470 90 L560 150 L700 70 L760 120 L1000 220 Z" fill="rgba(23,21,64,0.35)"></path>
          <path d="M400 62 L420 40 L440 62 L428 62 L420 52 L412 62 Z" fill="rgba(255,255,255,0.85)"></path>
          <path d="M682 90 L700 70 L718 90 L708 90 L700 82 L692 90 Z" fill="rgba(255,255,255,0.75)"></path>
        </svg>
        <div style="position:absolute;inset:0;pointer-events:none" aria-hidden="true">
          <span style="position:absolute;left:20%;bottom:20%;width:7px;height:7px;border-radius:50%;border:1.5px solid rgba(255,255,255,0.7);animation:drift 9s linear infinite"></span>
          <span style="position:absolute;left:46%;bottom:12%;width:5px;height:5px;border-radius:50%;border:1.5px solid rgba(255,255,255,0.6);animation:drift 12s linear 3s infinite"></span>
          <span style="position:absolute;left:72%;bottom:18%;width:6px;height:6px;border-radius:50%;border:1.5px solid rgba(255,255,255,0.65);animation:drift 10.5s linear 6s infinite"></span>
        </div>
        <div style="position:relative;padding:46px 50px 120px">
          <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px">
            <span style="font-size:12px;font-weight:700;padding:6px 14px;border-radius:999px;background:rgba(245,130,31,0.2);border:1px solid rgba(245,130,31,0.45);color:#FFC46B">Chardham · Kailash · Ladakh · EBC</span>
            <span style="font-size:12px;font-weight:700;padding:6px 14px;border-radius:999px;background:rgba(107,213,155,0.14);border:1px solid rgba(107,213,155,0.4);color:#B7E4CB">Marathoners &amp; cyclists</span>
          </div>
          <h2 style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(28px,3.8vw,44px);letter-spacing:-0.02em;line-height:1.08;color:#fff;margin:0;max-width:560px;text-wrap:balance">Ready for thin air — before you climb.</h2>
          <p style="font-size:15px;line-height:1.65;color:#DCE9F8;max-width:560px;margin:14px 0 0">At 3,500 m, every breath carries roughly a third less oxygen than at sea level. Healthy lungs adapt. Hidden heart or lung limitations — the kind you never notice in the city — tend to surface above ~2,500 m, on the trail, far from help. A physician-signed fitness assessment protects the trip you've been planning for years.</p>
          <div style="margin-top:24px">
            <a href="{{ wa.shikhar }}" target="_blank" rel="noreferrer" style="display:inline-flex;align-items:center;gap:10px;padding:14px 28px;border-radius:999px;font-size:15px;font-weight:700;color:#fff;background:linear-gradient(135deg,#F5821F,#FFA452);box-shadow:0 16px 38px -12px rgba(245,130,31,0.7);transition:transform .18s ease" style-hover="transform:translateY(-2px) scale(1.02);color:#fff">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
              Book my Shikhar assessment
            </a>
          </div>
        </div>
      </div>

      <!-- ALTITUDE SCALE -->
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:24px">
        <div style="padding:20px 22px;border-radius:22px;border:1px solid rgba(255,255,255,0.9);background:rgba(255,255,255,0.7);backdrop-filter:blur(14px);animation:fadeUp .5s ease .1s both"><div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:22px;color:#2C2A6B">2,500 m</div><div style="font-size:12.5px;color:#4A4880;margin-top:4px">where altitude illness begins for the unprepared</div></div>
        <div style="padding:20px 22px;border-radius:22px;border:1px solid rgba(255,255,255,0.9);background:rgba(255,255,255,0.7);backdrop-filter:blur(14px);animation:fadeUp .5s ease .18s both"><div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:22px;color:#2C2A6B">3,500 m</div><div style="font-size:12.5px;color:#4A4880;margin-top:4px">~⅓ less oxygen per breath (Kedarnath, Leh)</div></div>
        <div style="padding:20px 22px;border-radius:22px;border:1px solid rgba(255,255,255,0.9);background:rgba(255,255,255,0.7);backdrop-filter:blur(14px);animation:fadeUp .5s ease .26s both"><div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:22px;color:#2C2A6B">5,364 m</div><div style="font-size:12.5px;color:#4A4880;margin-top:4px">Everest Base Camp — half the oxygen of home</div></div>
        <div style="padding:20px 22px;border-radius:22px;border:1px solid rgba(255,255,255,0.9);background:rgba(255,255,255,0.7);backdrop-filter:blur(14px);animation:fadeUp .5s ease .34s both"><div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:22px;color:#F5821F">1 visit</div><div style="font-size:12.5px;color:#4A4880;margin-top:4px">spirometry + CPET + consult + certificate</div></div>
      </div>

      <!-- RISKS -->
      <h3 style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:22px;color:#2C2A6B;margin:40px 0 6px">Know the three altitude illnesses</h3>
      <p style="font-size:14px;color:#4A4880;margin:0 0 18px">All three are preventable and treatable when recognised early. The goal of learning them is confidence, not fear.</p>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:18px">
        <div style="display:flex;flex-direction:column;gap:10px;padding:26px;border-radius:26px;border:1px solid rgba(255,255,255,0.9);background:rgba(255,255,255,0.75);backdrop-filter:blur(16px);box-shadow:0 24px 56px -26px rgba(29,27,75,0.3)">
          <div style="display:flex;align-items:center;justify-content:space-between">
            <div style="width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:#E7E7F4;color:#2C2A6B"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"></path><path d="M9.6 4.6A2 2 0 1 1 11 8H2"></path><path d="M12.6 19.4A2 2 0 1 0 14 16H2"></path></svg></div>
            <span style="font-size:12px;font-weight:700;padding:5px 13px;border-radius:999px;background:#FDEBD9;color:#A95508">AMS</span>
          </div>
          <div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:17px;color:#2C2A6B">Acute Mountain Sickness <span style="font-family:'Noto Sans Telugu',sans-serif;font-size:11.5px;font-weight:600;color:#6966A4">ఎత్తు అనారోగ్యం</span></div>
          <p style="margin:0;font-size:13.5px;line-height:1.55;color:#4A4880">The most common altitude illness — the body protesting a fast ascent above ~2,500 m.</p>
          <div style="font-size:11px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:#6966A4;margin-top:4px">Warning signs</div>
          <div style="font-size:13.5px;line-height:1.7;color:#4A4880">Headache · Nausea, poor appetite · Poor sleep, fatigue · Dizziness</div>
          <div style="font-size:12px;color:#6966A4"><strong>Higher risk:</strong> Fast ascent, no rest days, previous AMS.</div>
          <div style="font-size:12.5px;line-height:1.55;color:#3A3870;background:#EAF2FB;border-radius:14px;padding:12px 14px;margin-top:auto">Usually settles with rest and no further ascent. It's a signal to pause — not panic.</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:10px;padding:26px;border-radius:26px;border:1px solid rgba(255,255,255,0.9);background:rgba(255,255,255,0.75);backdrop-filter:blur(16px);box-shadow:0 24px 56px -26px rgba(29,27,75,0.3)">
          <div style="display:flex;align-items:center;justify-content:space-between">
            <div style="width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:#E7E7F4;color:#2C2A6B"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"></path></svg></div>
            <span style="font-size:12px;font-weight:700;padding:5px 13px;border-radius:999px;background:#FBE7E5;color:#BE3A2F">HAPE</span>
          </div>
          <div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:17px;color:#2C2A6B">High-Altitude Pulmonary Edema <span style="font-family:'Noto Sans Telugu',sans-serif;font-size:11.5px;font-weight:600;color:#6966A4">ఊపిరితిత్తుల్లో నీరు</span></div>
          <p style="margin:0;font-size:13.5px;line-height:1.55;color:#4A4880">Fluid collecting in the lungs at altitude — uncommon, but the most dangerous lung emergency up there.</p>
          <div style="font-size:11px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:#6966A4;margin-top:4px">Warning signs</div>
          <div style="font-size:13.5px;line-height:1.7;color:#4A4880">Breathless even at rest · Cough (sometimes frothy/pink) · Chest tightness · Exhaustion out of proportion</div>
          <div style="font-size:12px;color:#6966A4"><strong>Higher risk:</strong> Rapid ascent, existing lung conditions, previous HAPE, heavy exertion on arrival day.</div>
          <div style="font-size:12.5px;line-height:1.55;color:#3A3870;background:#FBE7E5;border-radius:14px;padding:12px 14px;margin-top:auto">A medical emergency: descend and seek help immediately. Recognising it early saves lives.</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:10px;padding:26px;border-radius:26px;border:1px solid rgba(255,255,255,0.9);background:rgba(255,255,255,0.75);backdrop-filter:blur(16px);box-shadow:0 24px 56px -26px rgba(29,27,75,0.3)">
          <div style="display:flex;align-items:center;justify-content:space-between">
            <div style="width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:#E7E7F4;color:#2C2A6B"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"></path><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"></path></svg></div>
            <span style="font-size:12px;font-weight:700;padding:5px 13px;border-radius:999px;background:#FBE7E5;color:#BE3A2F">HACE</span>
          </div>
          <div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:17px;color:#2C2A6B">High-Altitude Cerebral Edema <span style="font-family:'Noto Sans Telugu',sans-serif;font-size:11.5px;font-weight:600;color:#6966A4">మెదడు వాపు</span></div>
          <p style="margin:0;font-size:13.5px;line-height:1.55;color:#4A4880">Brain swelling at altitude — rare, but serious. Usually follows untreated AMS.</p>
          <div style="font-size:11px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:#6966A4;margin-top:4px">Warning signs</div>
          <div style="font-size:13.5px;line-height:1.7;color:#4A4880">Confusion, unusual behaviour · Stumbling, clumsy walk · Severe headache · Drowsiness</div>
          <div style="font-size:12px;color:#6966A4"><strong>Higher risk:</strong> Ignoring AMS symptoms and continuing to ascend.</div>
          <div style="font-size:12.5px;line-height:1.55;color:#3A3870;background:#FBE7E5;border-radius:14px;padding:12px 14px;margin-top:auto">A medical emergency: immediate descent. Travel companions should know these signs too.</div>
        </div>
      </div>

      <!-- INCLUDED + WHO -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px">
        <div style="padding:30px 32px;border-radius:28px;border:1px solid rgba(255,255,255,0.9);background:rgba(255,255,255,0.75);backdrop-filter:blur(16px);box-shadow:0 24px 56px -26px rgba(29,27,75,0.3)">
          <div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:19px;color:#2C2A6B">What the Shikhar assessment includes</div>
          <div style="font-family:'Noto Sans Telugu',sans-serif;font-size:12px;color:#6966A4;margin:4px 0 16px">అసెస్‌మెంట్‌లో ఏమేమి ఉంటాయి</div>
          <div style="display:flex;flex-direction:column;gap:12px;font-size:14px;line-height:1.55;color:#4A4880">
            <div style="display:flex;gap:10px;background:#EAF2FB;border-radius:16px;padding:14px 16px"><strong style="color:#2C2A6B;flex-shrink:0">Spirometry</strong>Full lung-function testing — how much air your lungs move, and how fast.</div>
            <div style="display:flex;gap:10px;background:#EAF2FB;border-radius:16px;padding:14px 16px"><strong style="color:#2C2A6B;flex-shrink:0">CPET / CPET-lite</strong>Cardio-pulmonary exercise testing: how your heart and lungs perform under load — with VO₂max for athletes.</div>
            <div style="display:flex;gap:10px;background:#EAF2FB;border-radius:16px;padding:14px 16px"><strong style="color:#2C2A6B;flex-shrink:0">Physician consult</strong>A pulmonologist reviews your results, your itinerary and your history — with tailored ascent advice.</div>
            <div style="display:flex;gap:10px;background:#EAF2FB;border-radius:16px;padding:14px 16px"><strong style="color:#2C2A6B;flex-shrink:0">Certificate</strong>A physician-signed altitude-fitness assessment from the Advanced Lung Function &amp; Exercise Physiology Lab.</div>
          </div>
        </div>
        <div style="padding:30px 32px;border-radius:28px;border:1px solid rgba(255,255,255,0.9);background:rgba(255,255,255,0.75);backdrop-filter:blur(16px);box-shadow:0 24px 56px -26px rgba(29,27,75,0.3);display:flex;flex-direction:column">
          <div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:19px;color:#2C2A6B;margin-bottom:16px">Who should get assessed?</div>
          <div style="display:flex;flex-direction:column;gap:11px;font-size:14px;line-height:1.55;color:#4A4880;flex:1">
            <div style="display:flex;gap:10px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#27784C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:3px"><path d="M20 6 9 17l-5-5"></path></svg>Pilgrims 45+ heading to Chardham, Amarnath or Kailash — especially first-timers</div>
            <div style="display:flex;gap:10px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#27784C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:3px"><path d="M20 6 9 17l-5-5"></path></svg>Anyone with asthma, COPD, heart disease, high BP or diabetes planning altitude travel</div>
            <div style="display:flex;gap:10px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#27784C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:3px"><path d="M20 6 9 17l-5-5"></path></svg>First-time high-altitude trekkers (Ladakh, Spiti, Everest Base Camp)</div>
            <div style="display:flex;gap:10px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#27784C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:3px"><path d="M20 6 9 17l-5-5"></path></svg>Marathoners, cyclists and endurance athletes who want VO₂max and performance data</div>
          </div>
          <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:20px">
            <a href="{{ wa.shikhar }}" target="_blank" rel="noreferrer" style="display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:999px;font-size:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,#F5821F,#FFA452);box-shadow:0 12px 30px -10px rgba(245,130,31,0.7);transition:transform .18s ease" style-hover="transform:translateY(-2px);color:#fff">Book on WhatsApp</a>
            <a href="{{ wa.shikharGroup }}" target="_blank" rel="noreferrer" style="display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:999px;font-size:14px;font-weight:600;color:#2C2A6B;background:transparent;border:1.5px solid rgba(44,42,107,0.2);transition:background .15s ease" style-hover="background:rgba(44,42,107,0.06);color:#2C2A6B">Group &amp; yatra organisers</a>
          </div>
        </div>
      </div>
      <p style="font-size:12px;color:#6966A4;margin-top:18px;line-height:1.6">An assessment reduces surprises; it doesn't replace safe ascent practice. Acclimatise gradually, hydrate, and never ignore symptoms on the mountain. This page is education, not a diagnosis.</p>
    </div>
  </div>
  </sc-if>

  <!-- ============ TESTS & PROCEDURES (§5) ============ -->
  <sc-if value="{{ isProcs }}" hint-placeholder-val="{{ false }}">
  <div data-screen-label="Tests and Procedures" style="min-height:100vh;padding:120px 24px 90px">
    <div style="max-width:1150px;margin:0 auto">
      <nav aria-label="Breadcrumb" style="margin-bottom:16px">
        <ol style="list-style:none;display:flex;gap:8px;flex-wrap:wrap;padding:0;margin:0;font-size:12.5px;color:#6966A4">
          <li><button onClick="{{ goHome }}" style="background:none;border:none;padding:0;cursor:pointer;font-size:12.5px;color:#69679C;text-decoration:underline">Home</button></li>
          <li aria-hidden="true">›</li>

          <li aria-current="page" style="font-weight:700;color:#2C2A6B">Tests &amp; Procedures</li>
        </ol>
      </nav>
      <h1 style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(28px,3.8vw,42px);letter-spacing:-0.025em;color:#1D1B4B;margin:0">Tests &amp; procedures</h1>
      <p style="font-size:16px;line-height:1.6;color:#4A4880;margin:12px 0 30px;max-width:720px">What each test involves, why it is done, how to prepare and what happens afterwards — in plain language first.</p>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:18px">
        <sc-for list="{{ procCards }}" as="x" hint-placeholder-count="9">
          <article style="display:flex;flex-direction:column;padding:26px;border-radius:26px;border:1px solid rgba(255,255,255,0.9);background:rgba(255,255,255,0.78);backdrop-filter:blur(16px);box-shadow:0 24px 56px -28px rgba(29,27,75,0.3)">
            <span aria-hidden="true" style="width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;background:#FDEBD9;color:#A95508;margin-bottom:14px">
              <svg width="22" height="22" viewBox="{{ x.vb }}" fill="none" stroke="currentColor" stroke-width="{{ x.sw }}" stroke-linecap="round" stroke-linejoin="round">
                <sc-for list="{{ x.paths }}" as="p" hint-placeholder-count="2"><path d="{{ p.d }}"></path></sc-for>
              </svg>

      <!-- D. KNOW WHEN TO REFER -->
      <section style="margin-bottom:60px;padding:38px 40px;border-radius:30px;background:rgba(44,42,107,0.05);border:1px solid rgba(44,42,107,0.1)">

        <p style="font-size:14.5px;line-height:1.6;color:#4A4880;margin:10px 0 26px;max-width:720px">This network is not about moving patients. It is about knowing the point at which a patient benefits from subspecialty input — and having somewhere to send them when that point arrives.</p>

        <p style="font-size:15px;color:#69679C;margin:0 0 26px;max-width:720px">Patients can access advanced Yashoda expertise when required while maintaining continuity with their referring physician wherever clinically appropriate.</p>

          </li>

            <span style="display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#F5821F,#FFA452);color:#fff;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:16px">2</span>
            <h3 style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:19px;color:#2C2A6B;margin:14px 0 6px">Collaborate</h3>
            <p style="font-size:13.5px;line-height:1.6;color:#4A4880;margin:0">The assessment, investigation or procedure is done and discussed with you — you stay part of the decision, not downstream of it.</p>

  /* Every route reads in four languages off the same URL, so each one advertises

  applyAlternates(url) {

      const href = l.c === 'en' ? url : url + '?lang=' + l.c;
      this.headTag('link[rel="alternate"][hreflang="' + l.c + '"]', () => {
        const el = document.createElement('link');
        el.setAttribute('rel', 'alternate'); el.setAttribute('hreflang', l.c); return el;
      }).setAttribute('href', href);
    });

  /* Breadcrumbs mirror the visible trail so crawlers see the same hierarchy. */
  crumbs(route, t, d, pc) {
    const items = [{ name: 'Home', item: this.ORIGIN + '/' }];
    if (pc) { items.push({ name: 'Tests & Procedures', item: this.ORIGIN + '/tests-and-procedures' }, { name: pc.n, item: this.ORIGIN + '/tests-and-procedures/' + pc.id }); }
    else if (d) { items.push({ name: 'Doctors', item: this.ORIGIN + '/doctors' }, { name: d.name, item: this.ORIGIN + '/doctors/' + d.id }); }
    else if (t) { items.push({ name: 'Knowledge Hub', item: this.ORIGIN + '/knowledge-hub' }, { name: t.n, item: this.ORIGIN + '/knowledge-hub/' + t.id }); }
    else if (route === 'procs') items.push({ name: 'Tests & Procedures', item: this.ORIGIN + '/tests-and-procedures' });
    else if (route === 'find') items.push({ name: 'Doctors', item: this.ORIGIN + '/doctors' });
    else if (route === 'knowledge') items.push({ name: 'Knowledge Hub', item: this.ORIGIN + '/knowledge-hub' });

  /* Structured data, rewritten per route. Conditions get MedicalWebPage so the

  applySchema(route, t, url, pair, d, pc) {
    const publisher = {
      '@type': 'MedicalOrganization', name: this.BRAND.name,
      department: { '@type': 'MedicalOrganization', name: this.BRAND.name + ' ' + this.BRAND.unit },
      url: this.BRAND.site

    const data = pc
      ? {
        '@context': 'https://schema.org', '@type': 'MedicalProcedure', name: pc.n, description: pc.plain, url,
        howPerformed: pc.what, preparation: pc.prep.join(' '), followup: pc.after.join(' '),
        provider: publisher, breadcrumb: this.crumbs(route, null, null, pc)
      }
      : d
      ? {
        '@context': 'https://schema.org', '@type': 'Physician', name: d.name, url,
        medicalSpecialty: 'Pulmonary', description: pair[1], image: d.img,
        jobTitle: d.desig, knowsLanguage: d.langs,
        worksFor: { '@type': 'MedicalOrganization', name: this.BRAND.name + ', ' + d.unit, url: this.BRAND.site },
        availableService: d.procs.map(x => ({ '@type': 'MedicalProcedure', name: x })),
        breadcrumb: this.crumbs(route, t, d)
      }
      : t
      ? {
        '@context': 'https://schema.org', '@type': 'MedicalWebPage', name: pair[0], description: pair[1],
        url, inLanguage: 'en', publisher, lastReviewed: undefined,
        about: { '@type': 'MedicalCondition', name: t.n, description: t.ov,
          signOrSymptom: t.sym.map(x => ({ '@type': 'MedicalSignOrSymptom', name: x })) },
        significantLink: this.ORIGIN + '/knowledge-hub', breadcrumb: this.crumbs(route, t, null)
      }
      : {
        '@context': 'https://schema.org', '@type': 'WebPage', name: pair[0], description: pair[1],
        url, inLanguage: 'en', publisher,
        isPartOf: { '@type': 'WebSite', name: 'ŪPIRI · ' + this.BRAND.name, url: this.ORIGIN },
        breadcrumb: this.crumbs(route, null, null),
        /* §9: the homepage lists the department's procedures as indexable text,
           so it also declares them as an ItemList of MedicalProcedure — the same
           entities the individual procedure pages describe in full. */
        ...(route === 'home' ? {
          mainEntity: {
            '@type': 'ItemList', name: 'Procedures performed by ' + this.BRAND.name + ' ' + this.BRAND.unit,
            numberOfItems: this.PROCEDURES.length,
            itemListElement: this.PROCEDURES.map((x, i) => ({
              '@type': 'ListItem', position: i + 1,
              item: {
                '@type': 'MedicalProcedure', name: x.n, description: x.plain,
                url: this.ORIGIN + '/tests-and-procedures/' + x.id,
                provider: publisher

        } : {})
      };
    /* A second block: the page's own sections answer real search questions, so
       they are also expressed as an FAQPage. */
    const faq = t
      ? [['What is ' + t.n.toLowerCase() + '?', t.ov],
         ['What are the symptoms of ' + t.n.toLowerCase() + '?', t.sym.join('. ')],
         ['How is ' + t.n.toLowerCase() + ' diagnosed?', t.dx.join('. ')],
         ['How is ' + t.n.toLowerCase() + ' treated?', t.tx.join('. ')],
         ['When should I see a specialist for ' + t.n.toLowerCase() + '?', t.spec.join('. ')]]
      : pc
        ? [['What is ' + pc.n + '?', pc.what],
           ['Why is ' + pc.n + ' done?', pc.why],
           ['What happens during ' + pc.n + '?', pc.happens.join('. ')],
           ['How long does ' + pc.n + ' take?', pc.howlong],
           ['Is ' + pc.n + ' painful?', pc.pain],
           ['How do I prepare for ' + pc.n + '?', pc.prep.join('. ')],
           ['What happens after ' + pc.n + '?', pc.after.join('. ')]]

      const x = document.createElement('script');
      x.type = 'application/ld+json'; x.setAttribute('data-faq', '');

    });

      '@context': 'https://schema.org', '@type': 'FAQPage',

  }

  /* Probe for a Yashoda logo file and use it only once it has actually loaded. */
  findBrandLogo(i) {
    i = i || 0;

  /* ---- reading language ---- */
  langOf(code) { return this.LANGS.find(l => l.c === code) || this.LANGS[0]; }
  langKnown(code) { return code === 'en' || !!this.I18N[code]; }
  /* The translator is installed on the runtime, which applies it to every string
     on its way into the DOM. English installs none, so it costs nothing. */
  installTranslator(code) {
    const dict = this.I18N[code];

  /* The base stylesheet carries Latin and Telugu. The other scripts are fetched
     only if a reader actually asks for them, so English pays nothing for them. */
  FONTS = { kn: 'Noto+Sans+Kannada', bn: 'Noto+Sans+Bengali' };
  ensureFont(code) {
    const fam = this.FONTS[code];
    if (!fam || document.getElementById('font-' + code)) return;
    const l = document.createElement('link');
    l.id = 'font-' + code;
    l.rel = 'stylesheet';
    l.href = 'https://fonts.googleapis.com/css2?family=' + fam + ':wght@400;600;700;800&display=swap';
    document.head.appendChild(l);
  }
  setLang = (code) => {
    if (!this.langKnown(code)) return;
    this.installTranslator(code);

    try {
      const u = new URL(location.href);
      if (code === 'en') u.searchParams.delete('lang'); else u.searchParams.set('lang', code);
      history.replaceState(history.state, '', u.pathname + u.search);
    } catch (e) { /* file:// has no history origin */ }
    this.setState({ lang: code, menu: null, mobileNav: false });
  };

  mtUrl(code) {
    const host = this.ORIGIN.replace(/^https?:\/\//, '').replace(/\./g, '-');

  componentDidMount() {
    this.findBrandLogo();
    const patch = { qd: new Date().toISOString().slice(0, 10) };
    /* the URL wins over the remembered choice, so a shared link reads as sent */
    /* §7: on a phone every unit starts collapsed, so the section is four tidy
       rows rather than a long scroll of cards; a wider screen has room to show
       the first unit's team straight away. */
    try { if (window.innerWidth < 900) patch.docUnitOpen = ''; } catch (e) { /* no window */ }
    let lang = null;
    try { lang = new URLSearchParams(location.search).get('lang'); } catch (e) { /* no URLSearchParams */ }
    try { lang = lang || localStorage.getItem('upiri:lang'); } catch (e) { /* private mode */ }
    if (lang && this.langKnown(lang)) { patch.lang = lang; this.installTranslator(lang); }
    const start = this.props.startScreen;
    const fromUrl = this.routeFromPath(location.pathname);
    if (start && start !== 'home') patch.route = start;
    else if (fromUrl.route !== 'home' || fromUrl.khTopic || fromUrl.docId || fromUrl.procId) {
      patch.route = fromUrl.route; patch.khTopic = fromUrl.khTopic;
      patch.docId = fromUrl.docId || null; patch.procId = fromUrl.procId || null;
      this.state.docId = patch.docId; this.state.procId = patch.procId;
    }
    try { const d = JSON.parse(localStorage.getItem('upiri2:rendo')); if (d) patch.rd = d; } catch (e) { }
    this.setState(patch);
    this.syncUrl(patch.route || 'home', patch.khTopic, true);
    /* A tap outside closes whatever is open — the dropdowns, and the phone sheet,
       which previously stayed up until you found the menu button again. Taps
       inside the sheet are left alone so its own controls still work. */
    document.addEventListener('click', (e) => {
      const inSheet = e.target && e.target.closest && e.target.closest('[data-r="nav-sheet"]');
      const patch = {};
      if (this.state.menu) patch.menu = null;
      if (this.state.mobileNav && !inSheet) patch.mobileNav = false;
      if (Object.keys(patch).length) this.setState(patch);
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && (this.state.menu || this.state.mobileNav)) this.setState({ menu: null, mobileNav: false });
    });
    window.addEventListener('popstate', () => {
      const r = this.routeFromPath(location.pathname);
      this.state.docId = r.docId || null; this.state.procId = r.procId || null;
      this.setState({ route: r.route, khTopic: r.khTopic, docId: r.docId || null, procId: r.procId || null });

  }

  lerp(a, b, t) {
    const h = x => { const n = parseInt(x.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
    const A = h(a), B = h(b);
    return 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',') + ')';
  }
  lungCols(health) {
    const t = 1 - Math.max(0, Math.min(1, health));

  }

  countUp(key, target, dur) {
    dur = dur || 1300;
    if (this._raf) cancelAnimationFrame(this._raf);
    const t0 = performance.now();
    const tick = (t) => {
      const p = Math.min(1, (t - t0) / dur);
      this.setState({ [key]: Math.round(target * (1 - Math.pow(1 - p, 3))) });
      if (p < 1) this._raf = requestAnimationFrame(tick);
    };
    this._raf = requestAnimationFrame(tick);

  /* ---- risk ---- */
  riskScore() {
    const s = this.state; let v = 0;
    v += ({ '<40': 0, '40–49': 1, '50–59': 2, '60–69': 3, '70+': 4 })[s.age] ?? 0;
    v += ({ never: 0, former: 2, current: 4 })[s.smoke] ?? 0;
    if (s.smoke && s.smoke !== 'never') v += ({ '<10': 1, '10–20': 2, '21–30': 3, '30+': 4 })[s.years] ?? 0;
    if (s.smoke === 'former' && s.quitLong === 'yes') v -= 1;
    if (s.exp.includes('dust')) v += 2;
    if (s.exp.includes('traffic')) v += 1;
    if (s.exp.includes('biomass')) v += 1;
    if (s.exp.includes('secondhand')) v += 1;
    if (s.hist.includes('family')) v += 2;
    if (s.hist.includes('copd')) v += 2;
    if (s.hist.includes('cancer')) v += 1;
    if (s.hist.includes('tb')) v += 1;
    return Math.max(0, v);
  }
  riskReady(q) {
    const s = this.state;
    if (q.k === 'smoke') return s.smoke === 'never' || (!!s.years && (s.smoke === 'current' || !!s.quitLong));
    if (q.multi) return true;
    return !!s[q.k];
  }
  riskNext = () => {
    const s = this.state;
    if (s.rStep >= this.RISK_QS.length - 1) {
      this.setState({ rDone: true, rShown: 0 });
      const sc = this.riskScore();
      setTimeout(() => this.countUp('rShown', sc), 350);
    } else this.setState({ rStep: s.rStep + 1 });
    window.scrollTo({ top: 0 });
  };
  riskBack = () => {
    const s = this.state;
    if (s.rDone) this.setState({ rDone: false });
    else if (s.rStep > 0) this.setState({ rStep: s.rStep - 1 });
    else this.go('home');
  };
  riskRestart = () => this.setState({ rStep: 0, rDone: false, rShown: 0, flags: [], age: null, activity: null, sleep: null, diet: null, smoke: null, years: null, quitLong: null, exp: [], vent: null, cityYears: null, hist: [] });

  tog(k, v) { const a = this.state[k]; this.setState({ [k]: a.includes(v) ? a.filter(x => x !== v) : a.concat(v) }); }

  /* ---- breath ---- */
  bPick(k, pts) {
    const bAns = { ...this.state.bAns, [k]: pts };
    const i = this.state.bStep;
    this.setState({ bAns });
    if (i < this.QUIZ.length - 1) setTimeout(() => this.setState({ bStep: i + 1 }), 340);
    else setTimeout(() => {
      const total = Math.min(100, Object.values(bAns).reduce((a, b) => a + b, 0));
      this.setState({ bDone: true, bTotal: total, bShown: 0 });
      this.countUp('bShown', total);
      setTimeout(() => this.setState({ bHealth: Math.max(0.08, total / 100) }), 600);
    }, 380);
  }
  bRetake = () => this.setState({ bStep: 0, bAns: {}, bDone: false, bTotal: 0, bShown: 0, bHealth: 1 });
  bBack = () => {
    const s = this.state;

  };

  setSpiro = () => this.setState({ bMode: 'spiro' });
  calcSpiro = () => {
    const s = this.state;
    const a = parseFloat(s.ageIn), h = parseFloat(s.ht), f = parseFloat(s.fev1);
    if (!a || !h || !f) return;
    const inches = h / 2.54;
    let la = s.sex === 'male' ? 2.875 * inches - 31.25 * f - 39.375 : 3.56 * inches - 40 * f - 77.28;
    la = Math.round(Math.min(95, Math.max(18, la)));
    const delta = la - a;
    this.setState({ la: { la, delta }, laShown: 0, laHealth: 1 });
    this.countUp('laShown', la);
    setTimeout(() => this.setState({ laHealth: Math.max(0.08, Math.min(1, 0.75 - delta * 0.028)) }), 600);
  };

            unit: u, count: list.length + (list.length === 1 ? ' specialist' : ' specialists'),
            isOpen: on, open: on ? 'true' : 'false',
            caret: 'margin-left:auto;display:flex;color:#6966A4;transition:transform .2s ease;transform:rotate(' + (on ? '180deg' : '0deg') + ')',
            toggle: () => this.setState({ docUnitOpen: on ? '' : u }),
            docs: list.map(d => {
              const c = docCard(d);
              return { ...c, langLine: 'Speaks ' + d.langs.slice(0, 3).join(' · ') };
            })
          };
        });
      })(),
      /* §9: the procedure list is indexable text — real names, a plain-language
         line, and the terms people actually search for. Each links to its own
         page, which already carries MedicalProcedure schema. */
      svcList: this.PROCEDURES.map(x => ({
        n: x.n, plain: x.plain, kw: 'Also searched as: ' + x.kw,
        href: '/tests-and-procedures/' + x.id,
        open: (e) => { if (e && e.preventDefault) e.preventDefault(); this.goProc(x.id); }
      })),
      /* §14: unit list for the footer. TODO(yashoda): supply the street address
         and OPD phone per unit — only the unit names are sourced today, so the
         second line stays empty rather than carrying an invented address. */
      footerUnits: [...new Set(this.DOCTORS.map(d => d.unit))].map(u => ({
        unit: 'Yashoda Hospitals, ' + u, line: ''
      })),
      homeDocs: this.DOCTORS.slice(0, 3).map(docCard),
      /* doctor profile */
      dr: doc ? docCard(doc) : {},
      drName: doc ? doc.name : '', drDesig: doc ? doc.desig : '', drQual: doc ? doc.qual : '',
      drUnit: doc ? doc.unit : '', drExp: doc ? doc.exp : '', drTimings: doc ? doc.timings : '',
      drAbout: doc ? doc.about.split(' | ').map(t => ({ t })) : [],
      drEdu: doc ? splitList(doc.edu).map(t => ({ t })) : [],
      drHist: doc ? splitList(doc.hist).map(t => ({ t })) : [],
      drServices: doc ? doc.services.split(/(?=[A-Z][a-z]+(?:\s|$))/).map(x => x.trim()).filter(x => x.length > 6).slice(0, 30).map(t => ({ t })) : [],
      drLangs: doc ? doc.langs.map(t => ({ t })) : [],
      drConds: doc ? doc.conds.map(c => ({ t: condName(c), open: () => this.goTopic(c) })) : [],
      drProcs: doc ? doc.procs.map(t => ({ t })) : [],
      drHasTimings: !!(doc && doc.timings), drProfileUrl: doc ? doc.url : '',
      drBook: doc ? this.wal('I would like to book an appointment with ' + doc.name + ' (Yashoda Hospitals, ' + doc.unit + ').') : '',
      drImg: doc ? doc.img : '', drImgAlt: doc ? doc.name + ', ' + doc.desig : '',
      drInitials: doc ? doc.name.replace(/^Dr\.?\s*/, '').split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase() : '',
      /* condition page -> specialists */
      tpDocs: tp ? this.DOCTORS.filter(d => d.conds.includes(tp.id)).slice(0, 3).map(docCard) : [],
      tpHasDocs: tp ? this.DOCTORS.some(d => d.conds.includes(tp.id)) : false,

      /* ---- what brings you here today? ----
         Each question opens the tool or pathway that answers it. The two symptom
         questions start the checker with that symptom already ticked, so the
         patient continues from where they left off rather than starting over. */
      questions: this.QUESTIONS.map(q => ({
        q: q.q, cta: q.cta, ...this.iconOf(q.ic),
        go: () => ({
          cough: () => this.goTriageWith('cough'),
          breath: () => this.goTriageWith('breath'),
          asthma: () => this.goClub('asthma'),
          copd: () => this.goTopic('copd'),
          nodule: () => this.go('journey'),
          start: () => this.go('risk')
        })[q.k]()
      })),
      goQuestions: () => {
        const el = document.getElementById('questions');
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      },

      achievements: this.ACHIEVEMENTS.map(a => ({ t: a.t })),

      /* ---- clinical review status ---- */
      revText: this.REVIEW.reviewed
        ? 'Medical information reviewed by Yashoda Pulmonology' + (this.REVIEW.reviewedOn ? ' · ' + this.REVIEW.reviewedOn : '')
        : 'Medical information pending review by Yashoda Pulmonology',
      revDone: this.REVIEW.reviewed, revPending: !this.REVIEW.reviewed,

      /* ---- Yashoda brand lockup ---- */
      brandHasLogo: !!s.brandLogo, brandNoLogo: !s.brandLogo,
      brandLogo: s.brandLogo || '', brandLockup: this.BRAND.lockup, brandAlt: this.BRAND.logoAlt,
      brandName: this.BRAND.name, brandUnit: this.BRAND.unit, brandSite: this.BRAND.site,

      /* ---- clinical network (/alumni) ---- */
      isAlumni: s.route === 'alumni',
      goAlumni: (e) => { if (e && e.preventDefault) e.preventDefault(); this.go('alumni'); },
      netWhy: this.NET_WHY.map(c => ({ t: c.t, d: c.d, ...this.iconOf(({ talk: 'wind', help: 'pulse', rescue: 'shield', team: 'lung', book: 'micro', lib: 'scan', flask: 'micro', mentor: 'pulse', grad: 'shield', mic: 'wind', scan: 'scan', link: 'lung' })[c.i]) })),
      referTriggers: this.REFER_TRIGGERS.map(r => ({ t: r.t, d: r.d, tag: r.tag })),
      councilRoles: this.COUNCIL_ROLES.map(c => ({ r: c.r, d: c.d, initials: c.r.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase() })),
      alumniEngage: this.ALUMNI_ENGAGE.map(e => ({ t: e.t, d: e.d })),

      /* ---- knowledge hub (/knowledge-hub) ---- */
      isKnowledge: s.route === 'knowledge' && !s.khTopic,
      isTopic: s.route === 'knowledge' && !!s.khTopic,
      goKnowledge: (e) => { if (e && e.preventDefault) e.preventDefault(); this.go('knowledge'); },
      backToHub: this.backToHub,
      khQuery: s.khQuery,
      onKhQuery: (e) => this.setState({ khQuery: e.target.value }),
      clearKhQuery: () => this.setState({ khQuery: '' }),
      khHasQuery: khQ.length > 0,
      khNoResults: khQ.length > 0 && khHitCount === 0,
      khResultCount: khHitCount + (khQ ? ' result' + (khHitCount === 1 ? '' : 's') + ' for “' + s.khQuery.trim() + '”' : ''),
      khGroups,
      khSuggested: this.KH_SUGGESTED.map(q => ({ q, pick: () => this.setState({ khQuery: q }) })),
      khCategories: this.KH_CATEGORIES.map(c => ({
        g: c.g, d: c.d,
        items: c.ids.map(id => {
          const t = this.KH_TOPICS.find(x => x.id === id);
          return { n: t.n, blurb: t.blurb, ...this.iconOf(t.ic), open: () => this.goTopic(id) };
        })
      })),
      khTabs: this.KH_TABS.map(t => ({ label: t, pick: () => this.setState({ khTab: t }), st: this.pillSt(s.khTab === t) })),
      khTopicCards: khTopicCards,
      khShowTopics: !khQ && (s.khTab === 'All'),
      khArticles: khArticles.map(a => ({ ...a, open: () => this.goTopic(a.topicId) })),
      khVideos: khVideos.map(v => ({ ...v, open: () => this.goTopic(v.topicId) })),
      khCases: khCases.map(c => ({ ...c, open: () => this.goTopic(c.topicId) })),
      khShowArticles: !khQ && (s.khTab === 'All' || s.khTab === 'Articles' || s.khTab === 'Patient Guides' || s.khTab === 'Expert Insights'),
      khShowVideos: !khQ && (s.khTab === 'All' || s.khTab === 'Videos'),
      khShowCases: !khQ && (s.khTab === 'All' || s.khTab === 'Clinical Cases'),
      khShowFeatured: !khQ && s.khTab === 'All',
      khFeatured,
      /* topic detail */
      tp: tp || {}, tpOv: tp ? tp.ov : '', tpName: tp ? tp.n : '',
      tpSym: tp ? tp.sym.map(t => ({ t })) : [], tpDx: tp ? tp.dx.map(t => ({ t })) : [],
      tpTx: tp ? tp.tx.map(t => ({ t })) : [], tpSpec: tp ? tp.spec.map(t => ({ t })) : [],
      tpAdv: tp ? tp.adv.map(t => ({ t })) : [], tpSvc: tp ? tp.svc.map(t => ({ t })) : [],
      tpArticles: tp ? this.KH_ARTICLES.filter(a => a.topic === tp.id).map(a => ({ ...a, topicName: tp.n })) : [],
      tpVideos: tp ? this.KH_VIDEOS.filter(v => v.topic === tp.id).map(v => videoVm(v, tp.n)) : [],
      tpCases: tp ? this.KH_CASES.filter(c => c.topic === tp.id).map(c => ({ ...c, topicName: tp.n })) : [],
      tpHasArticles: tp ? this.KH_ARTICLES.some(a => a.topic === tp.id) : false,
      tpHasVideos: tp ? this.KH_VIDEOS.some(v => v.topic === tp.id) : false,
      tpHasCases: tp ? this.KH_CASES.some(c => c.topic === tp.id) : false,
      tpPaths: tp ? this.iconOf(tp.ic).paths : [],
      tpVb: tp ? this.iconOf(tp.ic).vb : '0 0 24 24', tpSw: tp ? this.iconOf(tp.ic).sw : 2,

      /* routes */
      isTriage: s.route === 'triage', isClubs: s.route === 'clubs', isClub: s.route === 'club',
      isAllergy: s.route === 'allergy', isCase: s.route === 'case', isShikhar: s.route === 'shikhar',
      goTriage: () => this.go('triage'), goClubs: () => this.go('clubs'), goAllergy: () => this.go('allergy'),
      goCase: () => this.go('case'), goShikhar: () => this.go('shikhar'),
      goClubAsthma: () => this.goClub('asthma'), goClubCopd: () => this.goClub('copd'), goClubIld: () => this.goClub('ild'),
      /* triage */
      tSymTiles, tFollowRows,
      tS0: s.tStep === 0, tS1: s.tStep === 1, tS2: s.tStep === 2,
      tProgressW: Math.round(((s.tStep + 1) / 3) * 100) + '%',
      tNext: this.tNext, tBack: this.tBack, tRestart: this.tRestart,
      tCont0St: t0Ready ? contOn : contOff, tCont1St: t1Ready ? contOn : contOff,
      tNot0Ready: t0Ready ? 'false' : 'true', tNot1Ready: t1Ready ? 'false' : 'true',
      tNoneSel: s.tSel.length === 0,
      tAgeOpts: ['<18', '18–44', '45–59', '60+'].map(v => ({ label: v, pick: () => this.setState({ tAge: v }), st: this.pillSt(s.tAge === v) })),
      tSmokeOpts: ['Never', 'Former', 'Current'].map(v => ({ label: v, pick: () => this.setState({ tSmoke: v }), st: this.pillSt(s.tSmoke === v) })),
      tKnownOpts: ['None', 'Asthma', 'COPD', 'ILD / other'].map(v => ({ label: v, pick: () => this.setState({ tKnown: v }), st: this.pillSt(s.tKnown === v) })),
      tRisk: TL.risk + ' risk', tColor: TL.color, tSoft: TL.soft, tWhen: TL.when, tHeadline: TL.headline, tTe: TL.te, tAdvice: TL.advice,
      tHasReasons: tri.reasons.length > 0, tReasons, tSummary,
      tL0: tri.level === 0, tL1: tri.level === 1, tL2: tri.level === 2, tL3: tri.level === 3, tNotL3: tri.level !== 3,
      /* clubs */
      clubLabel: cc.label, clubTe: cc.te, clubAcademy: cc.academy, clubAcademyTe: cc.academyTe, clubChampTitle: cc.championsTitle,
      clubMember: cc.memberName, symptomQ: cc.symptomQ,
      symOpts: ['Good', 'Okay', 'Struggling'].map(v => ({ label: v, pick: () => this.cdPatch({ sym: v }), st: this.pillSt(cs.sym === v) })),
      todayLong: new Date().toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long' }),
      medRows,
      isDiaryTab: s.clubTab === 'diary', isContentTab: s.clubTab === 'content', isChampTab: s.clubTab === 'champions',
      setDiaryTab: () => this.setState({ clubTab: 'diary' }), setContentTab: () => this.setState({ clubTab: 'content' }), setChampTab: () => this.setState({ clubTab: 'champions' }),
      diaryTabSt: this.pillSt(s.clubTab === 'diary'), contentTabSt: this.pillSt(s.clubTab === 'content'), champTabSt: this.pillSt(s.clubTab === 'champions'),
      gzZones, gzHas, gzNoVal: !gzHas, gzX2: gzNeedle[0].toFixed(1), gzY2: gzNeedle[1].toFixed(1),
      gzVal: gzHas ? String(cs.today) : '—', gzUnit: isPef ? 'L/min' : '% SpO₂', gzMinL: String(gzMin), gzMaxL: String(gzMax),
      metricTitle: isPef ? 'Peak flow' : 'SpO₂', metricPlaceholder: isPef ? 'e.g., 410' : 'e.g., 96',
      pbLine: isPef ? 'Personal best: ' + cc.pb + ' L/min' : 'Target: 95–100%',
      clubVal: cs.val, onClubVal: (e) => this.cdPatch({ val: e.target.value }), valSave: this.valSave,
      warnShow: !!warn, warnC: warn ? warn.c : '#27784C', warnSf: warn ? warn.sf : '#E3F2E9', warnT: warn ? warn.t : '', warnX: warn ? warn.x : '',
      trendBars, ccVideos, ccChamps, ccLife,
      waMockMsg: 'Namaste ' + cc.memberName + '! Gentle reminder from your ' + cc.label + ' — we noticed missed controller doses this week. Your controller keeps tomorrow easy: log today\'s doses in your club diary. Reply HELP for a nurse call-back.',
      /* allergy */
      alOpts, alMonth: alCur.m, alIsNow: s.alSel === nowM,
      alAirLabel: alAir.label, alAirC: alAir.c, alAirSf: alAir.sf,
      alAllergens: alCur.allergens.map(t => ({ t })), alTip: alCur.tip
    };
  }
}
