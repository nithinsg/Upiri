<style>
*{box-sizing:border-box}

/* ---------------------------------------------------------------------------
   Motion. Restrained by design: entrances are short, loops are slow and wide,
   and everything below is disabled outright under prefers-reduced-motion.
   --------------------------------------------------------------------------- */
@keyframes markSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes airflow{to{stroke-dashoffset:-38}}
@keyframes revealUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes pulseRing{0%{transform:scale(.9);opacity:.55}70%{transform:scale(1.25);opacity:0}100%{opacity:0}}

@media (prefers-reduced-motion: no-preference){
  /* The Yashoda mark turns continuously at one constant speed: linear, infinite,
     no easing and no hover variation, so it reads as a steady presence rather
     than an effect. A transform-only animation stays on the compositor. */
  x-dc [data-r="brand-mark"]{animation:markSpin 20s linear infinite;transform-origin:50% 50%;will-change:transform}

  /* sections arrive as they scroll into view, where the browser supports it */
  @supports (animation-timeline: view()){
    x-dc main section{animation:revealUp .7s cubic-bezier(.16,1,.3,1) both;animation-timeline:view();animation-range:entry 0% entry 45%}
  }

  /* cards in a grid stagger slightly so a group reads as one movement */
  x-dc [style*="grid-template-columns"]>article,
  x-dc [style*="grid-template-columns"]>button,
  x-dc [style*="grid-template-columns"]>section{animation:popIn .5s cubic-bezier(.16,1,.3,1) both}
  x-dc [style*="grid-template-columns"]>*:nth-child(2){animation-delay:.06s}
  x-dc [style*="grid-template-columns"]>*:nth-child(3){animation-delay:.12s}
  x-dc [style*="grid-template-columns"]>*:nth-child(4){animation-delay:.18s}
  x-dc [style*="grid-template-columns"]>*:nth-child(5){animation-delay:.24s}
  x-dc [style*="grid-template-columns"]>*:nth-child(6){animation-delay:.3s}
  x-dc [style*="grid-template-columns"]>*:nth-child(n+7){animation-delay:.36s}

  /* air moving down the airways of the hero lungs */
  x-dc [data-r="airway"]{stroke-dasharray:7 12;animation:airflow 2.6s linear infinite}

  /* the live indicator on the nodule pathway */
  x-dc [data-r="pulse"]{animation:pulseRing 2.8s ease-out infinite}
}
@media (prefers-reduced-motion: reduce){
  x-dc [data-r="brand-mark"]{animation:none}
}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
@media print{body.print-cert *{visibility:hidden}body.print-cert .certificate,body.print-cert .certificate *{visibility:visible}body.print-cert .certificate{position:fixed;left:24px;top:24px;right:24px}}

/* Keyboard focus. Nearly every control here is styled inline with its own
   border, so the browser default ring is easy to lose against the glass
   surfaces. One explicit high-contrast ring is drawn for keyboard users only
   (:focus-visible, never on a mouse click), outside the control so a rounded
   corner cannot clip it. */
x-dc button:focus-visible,x-dc a:focus-visible,x-dc select:focus-visible,
x-dc input:focus-visible,x-dc textarea:focus-visible,x-dc [tabindex]:focus-visible{
  outline:3px solid #F5821F;outline-offset:3px;border-radius:10px}
x-dc [data-r="nav-pill"] button:focus-visible,x-dc [data-r="nav-pill"] a:focus-visible{outline-offset:2px}
/* Press feedback. Hover does not exist on a touch screen, so every control also
   dims very slightly while it is held — a filter rather than a transform, so it
   cannot fight the hover transforms the design already uses. */
x-dc button:active,x-dc a:active{filter:brightness(0.95)}

/* Reading language: the page stack is Latin-first, so when a local language is
   chosen the matching Noto face leads it. Headings carry their own inline family,
   so they get the script face appended as a fallback rather than replaced. */
html[lang="te"] x-dc{font-family:'Noto Sans Telugu','Inter',system-ui,sans-serif}
html[lang="kn"] x-dc{font-family:'Noto Sans Kannada','Inter',system-ui,sans-serif}
html[lang="bn"] x-dc{font-family:'Noto Sans Bengali','Inter',system-ui,sans-serif}
html[lang="te"] x-dc [style*="Bricolage"]{font-family:'Bricolage Grotesque','Noto Sans Telugu',sans-serif !important}
html[lang="kn"] x-dc [style*="Bricolage"]{font-family:'Bricolage Grotesque','Noto Sans Kannada',sans-serif !important}
html[lang="bn"] x-dc [style*="Bricolage"]{font-family:'Bricolage Grotesque','Noto Sans Bengali',sans-serif !important}

/* The navbar link row absorbs any squeeze by scrolling, so the space selector
   and the Book CTA are never pushed off the right edge at any width. */
x-dc [data-r="nav-links"]{min-width:0;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
x-dc [data-r="nav-links"]::-webkit-scrollbar{display:none}
x-dc [data-r="nav-links"]>button{flex:0 0 auto}

/* ---------------------------------------------------------------------------
   Small-screen layout. The design is authored with inline styles for a desktop
   canvas, so these rules override the inline declarations for phone widths.
   Selectors match on the inline style text (and on data-r hooks where a block
   needs restructuring rather than resizing).
   --------------------------------------------------------------------------- */
@media (max-width:820px){
  /* On a phone the decorative lung stage and the drifting dust sit between the
     patient and the questions, so they go: the hero says who we are and what to
     do, and "What brings you here today?" follows immediately. Both are
     aria-hidden decoration, so a reader loses nothing. */
  x-dc [data-r="hero-stage"],x-dc [data-r="hero-dust"]{display:none !important}
  x-dc [data-r="hero"]{min-height:0 !important}
  /* the capability chips keep their content but stop costing four rows of height,
     so "What brings you here today?" sits just under the first screen */
  x-dc [data-r="hero-chips"]{flex-wrap:nowrap !important;overflow-x:auto;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;padding-bottom:22px !important}
  x-dc [data-r="hero-chips"]::-webkit-scrollbar{display:none}
  x-dc [data-r="hero-chips"]>span{flex:0 0 auto}
  x-dc [data-r="hero-chips"]>span:last-child{display:none}   /* the scroll hint */

  /* multi-column grids collapse to one column … */
  x-dc [style*="grid-template-columns"]{grid-template-columns:1fr !important}
  /* … except the compact chip/tile grids, which stay side by side */
  x-dc [style*="repeat(6"]{grid-template-columns:repeat(3,1fr) !important}
  x-dc [style*="repeat(4"]{grid-template-columns:repeat(2,1fr) !important}
  /* long words and wide children must not stretch their track */
  x-dc [style*="grid-template-columns"]>*{min-width:0}
  /* pill rows (tabs, option chips, input+action pairs) wrap instead of overflowing */
  x-dc [style*="display:flex;gap:10px"],x-dc [style*="display:flex;gap:12px"]{flex-wrap:wrap}
  x-dc section,x-dc [style*="max-width:1150px"]{max-width:100% !important}
  x-dc [style*="padding:120px 24px 90px"]{padding:132px 16px 64px !important}
  x-dc [style*="padding:128px 24px 40px"]{padding:108px 16px 30px !important}
  x-dc [style*="padding:80px 24px 20px"]{padding:132px 16px 16px !important}
  x-dc [style*="padding:40px 24px 90px"],x-dc [style*="padding:56px 24px 40px"],
  x-dc [style*="padding:56px 24px 30px"]{padding-left:16px !important;padding-right:16px !important}
  x-dc [style*="padding:0 24px 24px"]{padding-left:16px !important;padding-right:16px !important}

  /* floating navbar: logo + space + Book on top, section links scroll below */
  x-dc [data-r="nav"]{padding:0 10px !important}
  x-dc [data-r="nav-pill"]{flex-wrap:wrap;row-gap:6px;border-radius:24px !important;padding:8px 10px !important}
  x-dc [data-r="nav-sep"]{display:none !important}
  x-dc [data-r="nav-links"]{order:3;width:100%;flex:1 0 100% !important;overflow-x:auto;scrollbar-width:none}
}
@media (max-width:1460px){
  /* the Yashoda lockup costs width; drop its unit line, then the lockup itself */
  x-dc [data-r="nav-brand"]>span>span:last-child{display:none}
  x-dc [data-r="nav-links"]>button{padding:8px 9px !important;font-size:13px !important}
}
@media (max-width:900px){
  /* Phone toolbar: menu button left · ŪPIRI centred · Yashoda mark + Book right.
     The brand is centred against the pill itself rather than against whatever
     happens to sit either side of it, so it stays put as the sides change. */
  x-dc [data-r="nav-links"]{display:none !important}
  x-dc [data-r="nav-space"]{display:none !important}
  x-dc [data-r="nav-lang-wrap"]{display:none !important}   /* language lives in the sheet */
  x-dc [data-r="nav-pill"]{position:relative;flex-wrap:nowrap !important;justify-content:space-between;
    padding:8px 10px !important}
  x-dc [data-r="nav-burger"]{display:flex !important;order:1;flex:0 0 auto}
  /* Centred against the pill itself — left:50% + translate(-50%) is measured on
     the pill, so the lockup does not drift when the menu button or the CTA
     changes width (language, icon-only CTA, open or closed menu). */
  x-dc [data-r="nav-home"]{order:2;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    padding:0 !important;gap:8px !important}
  x-dc [data-r="nav-pill"]>[data-r="nav-home"] svg{width:42px !important;height:42px !important}
  x-dc [data-r="nav-pill"] [data-r="nav-word"]{font-size:25px !important}
  /* The Yashoda mark rides beside the menu button rather than opposite it. The
     lockup was already dead-centre in the viewport, but with a heavy cluster on
     the right and only the menu button on the left the whitespace either side
     was 104px vs 70px, which reads as "pushed right". Balancing the two sides
     makes true centring look centred. */
  x-dc [data-r="nav-brand"]{display:flex !important;order:2;margin-left:6px !important;
    margin-right:auto !important;padding-left:0 !important;border-left:none !important}
  x-dc [data-r="nav-brand"]>span{display:none !important}
  x-dc [data-r="nav-pill"] [data-r="brand-mark"]{height:28px !important}
  x-dc [data-r="nav-book"]{order:4}
}
@media (min-width:901px) and (max-width:1150px){
  x-dc [data-r="nav-brand"]{display:none !important}
}
@media (max-width:1180px){
  x-dc [data-r="nav-links"]{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  x-dc [data-r="nav-links"]::-webkit-scrollbar{display:none}
  x-dc [data-r="nav-links"]>button{flex:0 0 auto;padding:8px 10px !important;font-size:13px !important}
  x-dc [data-r="nav-links"]::-webkit-scrollbar{display:none}
  x-dc [data-r="nav-links"]>button{flex:0 0 auto}
  x-dc [data-r="nav-pill"]>button svg{width:26px;height:26px}
  x-dc [data-r="nav-pill"]>button span{font-size:16px !important}
  x-dc [data-r="nav-space"]{margin-left:auto;max-width:112px;padding:6px 10px !important;font-size:11.5px !important;
    text-overflow:ellipsis;background-position:right 8px center !important}
  x-dc [data-r="nav-book"]{margin-left:6px !important;padding:7px 12px !important;font-size:12px !important}

  /* nodule journey: the 920px illustrated path becomes a plain vertical stack */
  x-dc [data-r="journey"]{height:auto !important}
  x-dc [data-r="journey"]>svg{display:none !important}
  x-dc [data-r="journey-cards"]{position:static !important;transform:none !important;
    width:100% !important;height:auto !important;display:flex;flex-direction:column;align-items:center;gap:12px}
  x-dc [data-r="journey-cards"]>div{position:static !important;left:auto !important;top:auto !important;width:100% !important}
  x-dc [data-r="journey-cards"]>div[style*="border-radius:50%"]{width:52px !important;height:52px !important;flex:0 0 auto}

  /* oversized decorative rings inside the hero / result stages */
  x-dc [style*="min-height:412px"]{min-height:330px !important}
  x-dc [style*="width:460px;height:460px"]{width:300px !important;height:300px !important}
  x-dc [style*="width:400px;height:400px"]{width:264px !important;height:264px !important}
  x-dc [style*="width:300px;height:300px"]{width:210px !important;height:210px !important}
  /* hero stat chips hang off the lung stage by design; pull them inside the screen */
  x-dc [style*="top:36px;right:-8px"]{top:8px !important;right:0 !important}
  x-dc [style*="bottom:52px;left:-14px"]{bottom:8px !important;left:0 !important}
  x-dc [style*="top:120px;left:-30px"]{top:96px !important;left:0 !important}
}
@media (max-width:520px){
  x-dc [style*="repeat(4"]{grid-template-columns:repeat(2,1fr) !important}
  /* the headline is the loudest thing on a phone; a smaller setting keeps it to
     three lines and brings the questions up with it */
  x-dc [data-r="hero"] h1{font-size:31px !important;line-height:1.12 !important}
  x-dc [data-r="hero"] p{font-size:16px !important}
  x-dc [style*="font-size:clamp"]{overflow-wrap:break-word}
  /* the centred brand has the narrowest toolbars to live in: stack the lockup so
     it can never run into the menu button or the Book CTA */
  x-dc [data-r="nav-pill"] [data-r="nav-word"]{display:flex;flex-direction:column;align-items:center;
    line-height:1.02;font-size:23px !important}
  x-dc [data-r="nav-pill"] [data-r="nav-word"]>span{font-size:14px !important}
  x-dc [data-r="nav-pill"]>[data-r="nav-home"] svg{width:38px !important;height:38px !important}
  x-dc [data-r="nav-book"]{padding:8px 12px !important}
}
@media (max-width:380px){
  /* Narrowest phones: trim the CTA rather than the brand, but keep its label —
     an icon-only button on the right would unbalance the two sides again. */
  x-dc [data-r="nav-book"]{padding:8px 10px !important;font-size:11.5px !important;gap:5px !important}
  x-dc [data-r="nav-pill"] [data-r="nav-word"]{font-size:21px !important}
  x-dc [data-r="nav-pill"]>[data-r="nav-home"] svg{width:34px !important;height:34px !important}
}

/* The rotor reads as spinning by squashing the blade disc rather than rotating
   it — a rotating blade at this size just strobes. Paused entirely for anyone
   who has asked for reduced motion. */
@keyframes heli-rotor{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.12)}}
x-dc [data-r="heli-rotor"]{animation:heli-rotor .16s linear infinite}
@media (prefers-reduced-motion:reduce){
  x-dc [data-r="heli-rotor"]{animation:none}
  x-dc [data-r="heli"]{opacity:1 !important;transform:translateX(58vw) !important}
}
@media (max-width:560px){
  /*
   * The message sits at the TOP, under the header.
   *
   * At the bottom it covered the whole scene: on a phone the card is tall
   * enough to sit over Uppi in his dock AND over the flight path, so the one
   * moment the page exists to show was hidden behind the caption describing it.
   * 96px is where the nav sheet opens, i.e. clear of the fixed header.
   */
  x-dc [data-r="heli-pop"]{left:12px !important;right:12px !important;max-width:none !important;top:96px !important;bottom:auto !important}
  x-dc [data-r="heli"]{width:118px !important}
}

/* ---------------------------------------------------------------------------
   Horizontal rails (videos, specialists).

   The layout is here rather than inline for two reasons: the small-screen block
   above rewrites multi-column grids by matching on inline style text, and a rail
   must NOT collapse to one column on a phone — sideways is the whole point. It
   also keeps `data-rail` as the single hook the auto-advance timer looks for.

   Scroll-snap does the positioning, so a nudge from the arrow, a swipe and the
   2s timer all land a card in the same place.
   --------------------------------------------------------------------------- */
x-dc [data-rail]{display:flex;gap:14px;overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  padding:2px 2px 6px;margin:0 -2px;scroll-padding-left:2px}
x-dc [data-rail]::-webkit-scrollbar{display:none}
x-dc [data-rail]>*{flex:0 0 306px;scroll-snap-align:start;min-width:0}
x-dc [data-rail-docs]>*{flex-basis:224px}
@media (max-width:560px){
  x-dc [data-rail]>*{flex-basis:80vw}
  x-dc [data-rail-docs]>*{flex-basis:64vw}
}
/* The arrows are a convenience on a pointer device; a touch screen already has
   the gesture, and two buttons floating over a swipeable rail only get in the
   way of it. */
@media (hover:none){ x-dc [data-rail-arrows]{display:none !important} }
</style>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px">
            <label style="font-size:14px;font-weight:700;color:#1D1B4B">Your name (for your certificate)
              <input value="{{ nm }}" onChange="{{ onNm }}" placeholder="e.g., Ravi" style="display:block;margin-top:8px;width:100%;border-radius:14px;padding:13px 14px;border:1.5px solid rgba(44,42,107,0.16);background:#fff;font-size:15px;outline-color:#F5821F">
            </label>
            <label style="font-size:14px;font-weight:700;color:#1D1B4B">Quit date
              <input type="date" value="{{ qd }}" onChange="{{ onQd }}" style="display:block;margin-top:8px;width:100%;border-radius:14px;padding:12px 14px;border:1.5px solid rgba(44,42,107,0.16);background:#fff;font-size:15px;outline-color:#F5821F">
            </label>
            <label style="font-size:14px;font-weight:700;color:#1D1B4B">Cigarettes/beedis per day
              <input inputMode="numeric" value="{{ cigs }}" onChange="{{ onCigs }}" style="display:block;margin-top:8px;width:100%;border-radius:14px;padding:13px 14px;border:1.5px solid rgba(44,42,107,0.16);background:#fff;font-size:15px;outline-color:#F5821F">

            <label style="font-size:14px;font-weight:700;color:#1D1B4B">Price each (₹)
              <input inputMode="numeric" value="{{ price }}" onChange="{{ onPrice }}" style="display:block;margin-top:8px;width:100%;border-radius:14px;padding:13px 14px;border:1.5px solid rgba(44,42,107,0.16);background:#fff;font-size:15px;outline-color:#F5821F">
            </label>

          <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:26px">
            <button onClick="{{ startRendo }}" style="display:inline-flex;align-items:center;gap:10px;padding:15px 30px;border-radius:999px;border:none;cursor:pointer;font-size:15.5px;font-weight:700;color:#fff;background:linear-gradient(135deg,#F5821F,#FFA452);box-shadow:0 16px 38px -12px rgba(245,130,31,0.7);transition:transform .18s ease" style-hover="transform:translateY(-2px) scale(1.02)">

      <!-- DASHBOARD -->
      <sc-if value="{{ hasRd }}" hint-placeholder-val="{{ false }}">

                </sc-for>
                <button onClick="{{ clearDemo }}" style="padding:8px 12px;border-radius:999px;font-size:12.5px;font-weight:700;cursor:pointer;background:transparent;border:none;color:#A95508;text-decoration:underline">Reset to real days</button>

            </div>
          </sc-if>

          <div style="text-align:center;padding:44px 40px 38px;border-radius:32px;position:relative;overflow:hidden;background:radial-gradient(700px 420px at 50% -10%, rgba(245,130,31,0.18), transparent 60%), linear-gradient(155deg,#171540,#2C2A6B);box-shadow:0 34px 80px -30px rgba(29,27,75,0.55);animation:popIn .45s ease both">

            <div style="position:relative;display:flex;align-items:center;justify-content:center;height:240px;margin-top:14px" aria-hidden="true">

                  <path d="M90 74 C62 78 45 110 46 143 C47 169 63 184 78 177 C91 171 93 150 93 122 L93 86 C93 77 92 73 90 74 Z" fill="{{ rBase }}" stroke="{{ rDeep }}" stroke-width="2.5" style="transition:fill 1.1s ease, stroke 1.1s ease"></path>

                <sc-if value="{{ tarFalling }}" hint-placeholder-val="{{ false }}">

                    </sc-for>
                  </g>
                </sc-if>
              </svg>
            </div>
            <div style="font-size:13px;color:#AEB8D2;margin-top:6px">{{ statusLine }}</div>
            <div style="height:12px;border-radius:999px;background:rgba(255,255,255,0.12);max-width:420px;margin:22px auto 0;overflow:hidden">
              <div style="height:100%;border-radius:999px;background:linear-gradient(90deg,#F5821F,#FFB25C);box-shadow:0 0 16px rgba(245,130,31,0.6);transition:width .8s ease;width:{{ pctW }}"></div>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:420px;margin:20px auto 0">
              <div style="border-radius:20px;padding:18px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.13)">
                <div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:26px;color:#fff">{{ savedFmt }}</div>

                <div style="font-size:12px;color:#AEB8D2;margin-top:2px">not smoked</div>

            </div>
            <sc-if value="{{ isChamp }}" hint-placeholder-val="{{ false }}">

              </div>
            </sc-if>
          </div>

          <div style="padding:32px 34px;margin-top:24px;border-radius:28px;border:1px solid rgba(255,255,255,0.9);background:rgba(255,255,255,0.75);backdrop-filter:blur(18px);box-shadow:0 24px 60px -28px rgba(29,27,75,0.3)">

              <button onClick="{{ resetRendo }}" style="display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:999px;font-size:14px;font-weight:600;color:#2C2A6B;background:transparent;border:1.5px solid rgba(44,42,107,0.2);cursor:pointer;transition:background .15s ease" style-hover="background:rgba(44,42,107,0.06)">Reset counter</button>
            </div>
            <p style="font-size:12.5px;color:#6966A4;line-height:1.6;margin:16px 0 0">Cravings peak and pass in ~3 minutes. If you slip, it's a data point, not a defeat — call the line, we restart together. Recovery timelines are population averages.</p>

        </div>

        <button onClick="{{ goClubs }}" aria-label="Back to clubs" style="width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.8);border:1px solid rgba(44,42,107,0.12);color:#2C2A6B;cursor:pointer;transition:transform .15s ease" style-hover="transform:translateX(-3px)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
        </button>
        <div style="flex:1">
          <div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(22px,2.8vw,30px);letter-spacing:-0.02em;color:#2C2A6B">{{ clubLabel }}</div>
          <div style="font-family:'Noto Sans Telugu',sans-serif;font-size:12.5px;color:#6966A4">{{ clubTe }}</div>
        </div>
        <span style="font-size:12px;font-weight:700;padding:6px 14px;border-radius:999px;background:#E3F2E9;color:#27784C">Member preview · {{ clubMember }}</span>
      </div>
      <div style="display:flex;gap:10px;margin-bottom:30px">
        <button onClick="{{ setDiaryTab }}" style="{{ diaryTabSt }}">My diary</button>
        <button onClick="{{ setContentTab }}" style="{{ contentTabSt }}">{{ clubAcademy }}</button>
        <button onClick="{{ setChampTab }}" style="{{ champTabSt }}">Champions</button>
      </div>

      <!-- DIARY -->
      <sc-if value="{{ isDiaryTab }}" hint-placeholder-val="{{ true }}">

          <div style="padding:28px 32px;border-radius:28px;border:1px solid rgba(255,255,255,0.9);background:rgba(255,255,255,0.75);backdrop-filter:blur(18px);box-shadow:0 24px 60px -28px rgba(29,27,75,0.3)">

              <div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:19px;color:#2C2A6B">{{ symptomQ }}</div>
              <div style="font-size:12.5px;color:#6966A4">{{ todayLong }}</div>
            </div>
            <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px">
              <sc-for list="{{ symOpts }}" as="o" hint-placeholder-count="3"><button onClick="{{ o.pick }}" style="{{ o.st }}">{{ o.label }}</button></sc-for>
            </div>
          </div>

          <div style="padding:28px 32px;margin-top:20px;border-radius:28px;border:1px solid rgba(255,255,255,0.9);background:rgba(255,255,255,0.75);backdrop-filter:blur(18px);box-shadow:0 24px 60px -28px rgba(29,27,75,0.3)">

                  <circle cx="30" cy="30" r="25" stroke="rgba(44,42,107,0.1)" stroke-width="7" fill="none"></circle>
                  <circle cx="30" cy="30" r="25" stroke="{{ m.ringColor }}" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="157" stroke-dashoffset="{{ m.ringOff }}" transform="rotate(-90 30 30)" style="transition:stroke-dashoffset .5s ease, stroke .5s ease"></circle>
                </svg>
                <div style="flex:1">
                  <div style="font-size:14.5px;font-weight:700;color:#1D1B4B">{{ m.name }}</div>
                  <div style="font-size:12.5px;color:#6966A4;margin-top:2px">{{ m.countLabel }}</div>
                </div>
                <sc-if value="{{ m.notRel }}" hint-placeholder-val="{{ true }}">
                  <div style="display:flex;gap:8px">
                    <sc-for list="{{ m.dots }}" as="d" hint-placeholder-count="2">
                      <button onClick="{{ d.pick }}" aria-label="Toggle dose" style="width:34px;height:34px;border-radius:50%;cursor:pointer;border:2px solid rgba(44,42,107,0.2);background:rgba(255,255,255,0.9);display:flex;align-items:center;justify-content:center;transition:all .15s ease">
                        <sc-if value="{{ d.filled }}" hint-placeholder-val="{{ false }}"><span style="width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,#F5821F,#FFA452);display:block"></span></sc-if>
                      </button>
                    </sc-for>
                  </div>
                </sc-if>
                <sc-if value="{{ m.isRel }}" hint-placeholder-val="{{ false }}">
                  <button onClick="{{ m.log }}" style="padding:10px 18px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;background:rgba(44,42,107,0.06);border:1.5px solid rgba(44,42,107,0.16);color:#2C2A6B;transition:background .15s ease" style-hover="background:rgba(44,42,107,0.12)">+ Log a use</button>
                </sc-if>
              </div>
            </sc-for>
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px">
            <div style="padding:26px 28px;border-radius:28px;border:1px solid rgba(255,255,255,0.9);background:rgba(255,255,255,0.75);backdrop-filter:blur(18px);box-shadow:0 24px 60px -28px rgba(29,27,75,0.3)">
              <div style="display:flex;align-items:baseline;justify-content:space-between">
                <div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:18px;color:#2C2A6B">{{ metricTitle }}</div>
                <div style="font-size:12px;color:#6966A4">{{ pbLine }}</div>
              </div>
              <svg width="100%" viewBox="0 0 240 140" style="margin-top:10px" aria-hidden="true">
                <sc-for list="{{ gzZones }}" as="z" hint-placeholder-count="3">
                  <path d="{{ z.d }}" stroke="{{ z.color }}" stroke-width="16" fill="none" stroke-linecap="round" opacity="0.85"></path>
                </sc-for>
                <sc-if value="{{ gzHas }}" hint-placeholder-val="{{ false }}">
                  <line x1="120" y1="118" x2="{{ gzX2 }}" y2="{{ gzY2 }}" stroke="#1D1B4B" stroke-width="4" stroke-linecap="round" style="transition:all .6s ease"></line>
                  <circle cx="120" cy="118" r="7" fill="#1D1B4B"></circle>
                </sc-if>
                <text x="28" y="136" font-size="11" fill="#6966A4">{{ gzMinL }}</text>
                <text x="200" y="136" font-size="11" fill="#6966A4">{{ gzMaxL }}</text>
                <text x="120" y="100" text-anchor="middle" font-size="30" font-weight="800" fill="#1D1B4B" font-family="Bricolage Grotesque, sans-serif">{{ gzVal }}</text>
                <text x="120" y="116" text-anchor="middle" font-size="11" fill="#6966A4">{{ gzUnit }}</text>
              </svg>
              <div style="display:flex;gap:10px;margin-top:10px">
                <input inputMode="numeric" value="{{ clubVal }}" onChange="{{ onClubVal }}" placeholder="{{ metricPlaceholder }}" aria-label="Today's reading" style="flex:1;border-radius:14px;padding:12px 14px;border:1.5px solid rgba(44,42,107,0.16);background:#fff;font-size:15px;outline-color:#F5821F">
                <button onClick="{{ valSave }}" style="padding:12px 22px;border-radius:14px;border:none;cursor:pointer;font-size:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,#F5821F,#FFA452);box-shadow:0 10px 26px -10px rgba(245,130,31,0.65);transition:transform .15s ease" style-hover="transform:translateY(-1px)">Log</button>
              </div>
            </div>
            <div style="padding:26px 28px;border-radius:28px;border:1px solid rgba(255,255,255,0.9);background:rgba(255,255,255,0.75);backdrop-filter:blur(18px);box-shadow:0 24px 60px -28px rgba(29,27,75,0.3);display:flex;flex-direction:column">
              <div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:18px;color:#2C2A6B">Last 7 entries</div>
              <div style="flex:1;display:flex;align-items:flex-end;gap:10px;margin-top:16px;min-height:120px">
                <sc-for list="{{ trendBars }}" as="b" hint-placeholder-count="6">
                  <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end">
                    <div style="{{ b.hSt }}"></div>
                    <div style="font-size:10.5px;color:#6966A4">{{ b.label }}</div>
                  </div>
                </sc-for>
              </div>
              <sc-if value="{{ gzNoVal }}" hint-placeholder-val="{{ true }}">
                <div style="font-size:12px;color:#6966A4;margin-top:10px">Log today's reading to add it to your trend.</div>
              </sc-if>
            </div>
          </div>

          <sc-if value="{{ warnShow }}" hint-placeholder-val="{{ false }}">
            <div style="margin-top:20px;padding:20px 26px;border-radius:22px;background:{{ warnSf }};border:1.5px solid {{ warnC }};animation:popIn .35s ease both">
              <div style="font-size:15px;font-weight:800;color:{{ warnC }}">{{ warnT }}</div>
              <div style="font-size:14px;line-height:1.6;color:#3A3870;margin-top:4px">{{ warnX }}</div>
            </div>
          </sc-if>

          <div style="margin-top:20px;padding:22px 26px;border-radius:24px;background:linear-gradient(150deg,#1F5C3D,#27784C);box-shadow:0 22px 52px -24px rgba(47,143,91,0.6)">
            <div style="display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:#B7E4CB;margin-bottom:10px">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"></path></svg>
              WhatsApp nudge · preview
            </div>
            <div style="background:rgba(255,255,255,0.95);border-radius:16px 16px 16px 4px;padding:14px 18px;font-size:13.5px;line-height:1.6;color:#1D1B4B;max-width:560px">{{ waMockMsg }}</div>
          </div>
        </div>
      </sc-if>

      <!-- ACADEMY -->
      <sc-if value="{{ isContentTab }}" hint-placeholder-val="{{ false }}">
        <div style="animation:popIn .4s ease both">
          <div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:20px;color:#2C2A6B">{{ clubAcademy }} <span style="font-family:'Noto Sans Telugu',sans-serif;font-size:13px;font-weight:600;color:#6966A4">{{ clubAcademyTe }}</span></div>
          <p style="font-size:14px;color:#69679C;margin:6px 0 18px">Short, honest videos by the ŪPIRI team. Scroll the shelf →</p>
          <div style="display:flex;gap:16px;overflow-x:auto;padding:4px 4px 18px">
            <sc-for list="{{ ccVideos }}" as="v" hint-placeholder-count="4">
              <div style="width:250px;flex-shrink:0;border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 18px 44px -20px rgba(29,27,75,0.35);transition:transform .18s ease;cursor:pointer" style-hover="transform:translateY(-5px)">
                <div style="{{ v.gradSt }}">
                  <div style="width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,0.9);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(0,0,0,0.25)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="#2C2A6B" stroke="none"><path d="m6 3 14 9-14 9V3z"></path></svg>
                  </div>
                  <span style="position:absolute;bottom:10px;right:12px;font-size:11px;font-weight:700;color:#fff;background:rgba(0,0,0,0.45);border-radius:999px;padding:3px 10px">{{ v.dur }}</span>
                </div>
                <div style="padding:14px 16px 16px">
                  <div style="font-size:13.5px;font-weight:700;line-height:1.4;color:#1D1B4B">{{ v.t }}</div>
                  <div style="font-size:11.5px;color:#6966A4;margin-top:6px">{{ v.by }}</div>
                </div>
              </div>
            </sc-for>
          </div>
          <div style="margin-top:14px;padding:22px 26px;border-radius:24px;border:1px solid rgba(255,255,255,0.9);background:rgba(255,255,255,0.72);backdrop-filter:blur(16px)">
            <div style="font-size:14px;font-weight:800;color:#2C2A6B;margin-bottom:10px">Club life</div>
            <sc-for list="{{ ccLife }}" as="l" hint-placeholder-count="3">
              <div style="display:flex;gap:10px;font-size:14px;line-height:1.6;color:#4A4880;padding:5px 0"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#27784C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:4px"><path d="M20 6 9 17l-5-5"></path></svg><span>{{ l.t }}</span></div>
            </sc-for>
          </div>
        </div>
      </sc-if>

      <!-- CHAMPIONS -->
      <sc-if value="{{ isChampTab }}" hint-placeholder-val="{{ false }}">
        <div style="animation:popIn .4s ease both">
          <div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:20px;color:#2C2A6B;margin-bottom:18px">{{ clubChampTitle }}</div>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:18px">
            <sc-for list="{{ ccChamps }}" as="c" hint-placeholder-count="3">
              <div style="display:flex;flex-direction:column;gap:14px;padding:26px;border-radius:26px;border:1px solid rgba(255,255,255,0.9);background:rgba(255,255,255,0.78);backdrop-filter:blur(16px);box-shadow:0 24px 56px -26px rgba(29,27,75,0.32)">
                <div style="display:flex;align-items:center;gap:12px">
                  <div style="width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;background:linear-gradient(135deg,#2C2A6B,#5E82E8)">{{ c.initials }}</div>
                  <div>
                    <div style="font-weight:700;font-size:14.5px;color:#1D1B4B">{{ c.name }}, {{ c.age }}</div>
                    <div style="display:flex;gap:2px;margin-top:2px">
                      <svg width="12" height="12" viewBox="0 0 24 24" fill="#F5821F" stroke="none"><path d="M12 2l2.9 6.26L21.5 9.27l-4.75 4.63 1.12 6.53L12 17.77l-5.87 3.09 1.12-6.53L2.5 9.27l6.6-1.01L12 2z"></path></svg>
                      <svg width="12" height="12" viewBox="0 0 24 24" fill="#F5821F" stroke="none"><path d="M12 2l2.9 6.26L21.5 9.27l-4.75 4.63 1.12 6.53L12 17.77l-5.87 3.09 1.12-6.53L2.5 9.27l6.6-1.01L12 2z"></path></svg>
                      <svg width="12" height="12" viewBox="0 0 24 24" fill="#F5821F" stroke="none"><path d="M12 2l2.9 6.26L21.5 9.27l-4.75 4.63 1.12 6.53L12 17.77l-5.87 3.09 1.12-6.53L2.5 9.27l6.6-1.01L12 2z"></path></svg>
                      <svg width="12" height="12" viewBox="0 0 24 24" fill="#F5821F" stroke="none"><path d="M12 2l2.9 6.26L21.5 9.27l-4.75 4.63 1.12 6.53L12 17.77l-5.87 3.09 1.12-6.53L2.5 9.27l6.6-1.01L12 2z"></path></svg>
                      <svg width="12" height="12" viewBox="0 0 24 24" fill="#F5821F" stroke="none"><path d="M12 2l2.9 6.26L21.5 9.27l-4.75 4.63 1.12 6.53L12 17.77l-5.87 3.09 1.12-6.53L2.5 9.27l6.6-1.01L12 2z"></path></svg>
                    </div>
                  </div>
                </div>
                <p style="margin:0;font-size:14px;line-height:1.6;color:#3A3870;flex:1">“{{ c.quote }}”</p>
                <span style="align-self:flex-start;font-size:12px;font-weight:700;padding:6px 14px;border-radius:999px;background:#E3F2E9;color:#27784C">{{ c.outcome }}</span>
              </div>
            </sc-for>
          </div>
          <p style="font-size:12px;color:#6966A4;margin-top:16px">Member stories shared with consent; names abbreviated. Individual results vary.</p>
        </div>
      </sc-if>
    </div>
  </div>
  </sc-if>
<!-- ============ ALLERGY CALENDAR ============ -->
  <sc-if value="{{ isAllergy }}" hint-placeholder-val="{{ false }}">
  <div data-screen-label="Allergy Calendar" style="min-height:100vh;padding:120px 24px 90px">
    <div style="max-width:880px;margin:0 auto">
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:26px">
        <button onClick="{{ goHome }}" aria-label="Back" style="width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.8);border:1px solid rgba(44,42,107,0.12);color:#2C2A6B;cursor:pointer;transition:transform .15s ease" style-hover="transform:translateX(-3px)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
        </button>
        <div>
          <div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(24px,3vw,32px);letter-spacing:-0.02em;color:#2C2A6B">Hyderabad Allergy Calendar</div>
          <div style="font-family:'Noto Sans Telugu',sans-serif;font-size:13px;color:#6966A4">ఈ నెల గాలిలో ఏముంది?</div>

      </div>
      <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:24px">

          <button onClick="{{ mo.pick }}" style="{{ mo.st }}">{{ mo.label }}</button>

        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
          <div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:30px;letter-spacing:-0.02em;color:#1D1B4B">{{ alMonth }}</div>
          <span style="font-size:12.5px;font-weight:700;padding:6px 16px;border-radius:999px;background:{{ alAirSf }};color:{{ alAirC }}">{{ alAirLabel }}</span>
          <sc-if value="{{ alIsNow }}" hint-placeholder-val="{{ false }}">
            <span style="font-size:12px;font-weight:700;padding:6px 14px;border-radius:999px;background:#FDEBD9;color:#A95508">This month</span>
          </sc-if>

            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#27784C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:3px"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"></path><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"></path></svg>

            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
            Allergy &amp; Immunology Clinic
          </a>
        </div>
      </div>
      <p style="font-size:12px;color:#6966A4;margin-top:18px;line-height:1.6">Seasonal patterns for the Hyderabad region; individual triggers vary. If the same month gets you every year, allergy testing + immunotherapy can change that story.</p>
    </div>
  </div>
  </sc-if>

          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
        </button>
        <div>
          <div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(24px,3vw,32px);letter-spacing:-0.02em;color:#2C2A6B">Case of the Month</div>
          <div style="font-family:'Noto Sans Telugu',sans-serif;font-size:13px;color:#6966A4">ఈ నెల కేసు — నాడ్యూల్ బోర్డ్ నుంచి</div>
        </div>
      </div>
      <div style="padding:38px 42px;border-radius:30px;border:1px solid rgba(255,255,255,0.9);background:rgba(255,255,255,0.78);backdrop-filter:blur(20px);box-shadow:0 28px 66px -28px rgba(29,27,75,0.35);animation:popIn .4s ease both">
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px">
          <span style="font-size:12px;font-weight:700;padding:6px 14px;border-radius:999px;background:#FDEBD9;color:#A95508">July 2026</span>
          <span style="font-size:12px;font-weight:700;padding:6px 14px;border-radius:999px;background:#E7E7F4;color:#2C2A6B">From the Nodule Board</span>
        </div>
        <h2 style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:32px;letter-spacing:-0.02em;color:#2C2A6B;margin:0">The pea-sized shadow</h2>
        <p style="font-size:13px;color:#6966A4;margin:8px 0 22px">Illustrative composite case; details anonymised and altered to protect identity. Presented with consent principles at the ŪPIRI Nodule Board.</p>
        <div style="display:flex;flex-direction:column;gap:14px;font-size:14.5px;line-height:1.65;color:#3A3870">
          <p style="margin:0"><strong style="color:#2C2A6B">The patient.</strong> A 48-year-old software architect. Never smoked. No symptoms. A routine pre-employment chest X-ray — the kind most people never think about again.</p>
          <p style="margin:0"><strong style="color:#2C2A6B">Day 0.</strong> The radiologist's read: normal. The AI second read (qXR) flagged a subtle 9 mm opacity in the right upper zone, partially hidden behind the second rib — exactly where human eyes tire. The radiologist re-reviewed and agreed: worth a closer look.</p>
          <p style="margin:0"><strong style="color:#2C2A6B">Day 1.</strong> Fast-track Nodule Clinic consult. Low-dose CT confirmed a 9 mm part-solid nodule with mild spiculation. Malignancy probability estimated with the Brock model: not low enough to watch.</p>
          <p style="margin:0"><strong style="color:#2C2A6B">Day 2.</strong> Nodule Board (pulmonology + radiology + oncology + thoracic surgery). Decision: tissue diagnosis via Archimedes BTPNA navigational bronchoscopy — the nodule sat beyond the reach of conventional bronchoscopy.</p>
          <p style="margin:0"><strong style="color:#2C2A6B">Day 4.</strong> Navigation biopsy under cone-beam CT confirmation. On-site cytology: adenocarcinoma. Staging PET the same week: Stage IA. No nodes, no spread.</p>
          <p style="margin:0"><strong style="color:#2C2A6B">The outcome.</strong> Minimally invasive lobectomy three weeks later. No chemotherapy required. He was back at his desk in a month, now on a simple surveillance calendar. Five-year outlook at this stage is excellent — the entire reason early detection exists.</p>
        </div>
        <div style="margin-top:24px;border-radius:22px;padding:24px 28px;background:linear-gradient(150deg,#1D1B4B,#2C2A6B)">
          <div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:17px;color:#fff;margin-bottom:10px">Teaching pearls</div>
          <div style="font-size:13.5px;line-height:1.75;color:#C9D2E6">
            • You don't have to smoke to get lung cancer — a large share of Indian lung cancer occurs in never-smokers.<br>
            • Rib overlap zones are where small nodules hide; a structured second read (AI or human) catches them.<br>
            • Time-to-diagnosis here: <strong style="color:#FFB067">4 days</strong>. The national norm for incidental nodules is often months — or never.<br>
            • For referring physicians: any nodule, any report, any lab → priority pathway, outcome summary back to you.
          </div>
        </div>
        <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:24px">

            Get my report reviewed
          </a>
          <a href="{{ wa.board }}" target="_blank" rel="noreferrer" style="display:inline-flex;align-items:center;gap:8px;padding:13px 24px;border-radius:999px;font-size:14.5px;font-weight:600;color:#2C2A6B;background:transparent;border:1.5px solid rgba(44,42,107,0.2);transition:background .15s ease" style-hover="background:rgba(44,42,107,0.06);color:#2C2A6B">Physicians: join the Nodule Board</a>
        </div>
      </div>
    </div>

<!-- ============ SHIKHAR ============ -->

    <div style="max-width:1000px;margin:0 auto">

        <button onClick="{{ goHome }}" aria-label="Back" style="width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.8);border:1px solid rgba(44,42,107,0.12);color:#2C2A6B;cursor:pointer;transition:transform .15s ease" style-hover="transform:translateX(-3px)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
        </button>
        <div>
          <div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(24px,3vw,32px);letter-spacing:-0.02em;color:#2C2A6B">ŪPIRI Shikhar — Altitude Readiness</div>
          <div style="font-family:'Noto Sans Telugu',sans-serif;font-size:13px;color:#6966A4">శిఖరం — ఎత్తులకు మీ ఊపిరి సిద్ధమా?</div>
        </div>

      <!-- MOUNTAIN HERO -->
      <div style="position:relative;border-radius:32px;overflow:hidden;background:linear-gradient(180deg,#1B2A5E 0%, #3A6EA5 55%, #7FB2E5 100%);box-shadow:0 30px 70px -28px rgba(29,27,75,0.55);animation:fadeUp .5s ease both">
        <svg width="100%" height="220" viewBox="0 0 1000 220" preserveAspectRatio="none" style="position:absolute;bottom:0;left:0" aria-hidden="true">
          <path d="M0 220 L180 90 L280 160 L420 40 L560 150 L700 70 L850 170 L1000 110 L1000 220 Z" fill="rgba(23,21,64,0.55)"></path>
          <path d="M0 220 L120 150 L260 200 L420 40 L470 90 L560 150 L700 70 L760 120 L1000 220 Z" fill="rgba(23,21,64,0.35)"></path>
          <path d="M400 62 L420 40 L440 62 L428 62 L420 52 L412 62 Z" fill="rgba(255,255,255,0.85)"></path>
          <path d="M682 90 L700 70 L718 90 L708 90 L700 82 L692 90 Z" fill="rgba(255,255,255,0.75)"></path>
        </svg>
        <div style="position:absolute;inset:0;pointer-events:none" aria-hidden="true">
          <span style="position:absolute;left:20%;bottom:20%;width:7px;height:7px;border-radius:50%;border:1.5px solid rgba(255,255,255,0.7);animation:drift 9s linear infinite"></span>
          <span style="position:absolute;left:46%;bottom:12%;width:5px;height:5px;border-radius:50%;border:1.5px solid rgba(255,255,255,0.6);animation:drift 12s linear 3s infinite"></span>
          <span style="position:absolute;left:72%;bottom:18%;width:6px;height:6px;border-radius:50%;border:1.5px solid rgba(255,255,255,0.65);animation:drift 10.5s linear 6s infinite"></span>
        </div>
        <div style="position:relative;padding:46px 50px 120px">
          <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px">
            <span style="font-size:12px;font-weight:700;padding:6px 14px;border-radius:999px;background:rgba(245,130,31,0.2);border:1px solid rgba(245,130,31,0.45);color:#FFC46B">Chardham · Kailash · Ladakh · EBC</span>
            <span style="font-size:12px;font-weight:700;padding:6px 14px;border-radius:999px;background:rgba(107,213,155,0.14);border:1px solid rgba(107,213,155,0.4);color:#B7E4CB">Marathoners &amp; cyclists</span>
          </div>
          <h2 style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(28px,3.8vw,44px);letter-spacing:-0.02em;line-height:1.08;color:#fff;margin:0;max-width:560px;text-wrap:balance">Ready for thin air — before you climb.</h2>
          <p style="font-size:15px;line-height:1.65;color:#DCE9F8;max-width:560px;margin:14px 0 0">At 3,500 m, every breath carries roughly a third less oxygen than at sea level. Healthy lungs adapt. Hidden heart or lung limitations — the kind you never notice in the city — tend to surface above ~2,500 m, on the trail, far from help. A physician-signed fitness assessment protects the trip you've been planning for years.</p>
          <div style="margin-top:24px">
            <a href="{{ wa.shikhar }}" target="_blank" rel="noreferrer" style="display:inline-flex;align-items:center;gap:10px;padding:14px 28px;border-radius:999px;font-size:15px;font-weight:700;color:#fff;background:linear-gradient(135deg,#F5821F,#FFA452);box-shadow:0 16px 38px -12px rgba(245,130,31,0.7);transition:transform .18s ease" style-hover="transform:translateY(-2px) scale(1.02);color:#fff">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
              Book my Shikhar assessment
            </a>
          </div>
        </div>
      </div>

      <!-- ALTITUDE SCALE -->
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:24px">
        <div style="padding:20px 22px;border-radius:22px;border:1px solid rgba(255,255,255,0.9);background:rgba(255,255,255,0.7);backdrop-filter:blur(14px);animation:fadeUp .5s ease .1s both"><div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:22px;color:#2C2A6B">2,500 m</div><div style="font-size:12.5px;color:#4A4880;margin-top:4px">where altitude illness begins for the unprepared</div></div>
        <div style="padding:20px 22px;border-radius:22px;border:1px solid rgba(255,255,255,0.9);background:rgba(255,255,255,0.7);backdrop-filter:blur(14px);animation:fadeUp .5s ease .18s both"><div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:22px;color:#2C2A6B">3,500 m</div><div style="font-size:12.5px;color:#4A4880;margin-top:4px">~⅓ less oxygen per breath (Kedarnath, Leh)</div></div>
        <div style="padding:20px 22px;border-radius:22px;border:1px solid rgba(255,255,255,0.9);background:rgba(255,255,255,0.7);backdrop-filter:blur(14px);animation:fadeUp .5s ease .26s both"><div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:22px;color:#2C2A6B">5,364 m</div><div style="font-size:12.5px;color:#4A4880;margin-top:4px">Everest Base Camp — half the oxygen of home</div></div>
        <div style="padding:20px 22px;border-radius:22px;border:1px solid rgba(255,255,255,0.9);background:rgba(255,255,255,0.7);backdrop-filter:blur(14px);animation:fadeUp .5s ease .34s both"><div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:22px;color:#F5821F">1 visit</div><div style="font-size:12.5px;color:#4A4880;margin-top:4px">spirometry + CPET + consult + certificate</div></div>
      </div>

      <!-- RISKS -->
      <h3 style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:22px;color:#2C2A6B;margin:40px 0 6px">Know the three altitude illnesses</h3>
      <p style="font-size:14px;color:#4A4880;margin:0 0 18px">All three are preventable and treatable when recognised early. The goal of learning them is confidence, not fear.</p>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:18px">
        <div style="display:flex;flex-direction:column;gap:10px;padding:26px;border-radius:26px;border:1px solid rgba(255,255,255,0.9);background:rgba(255,255,255,0.75);backdrop-filter:blur(16px);box-shadow:0 24px 56px -26px rgba(29,27,75,0.3)">
          <div style="display:flex;align-items:center;justify-content:space-between">
            <div style="width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:#E7E7F4;color:#2C2A6B"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"></path><path d="M9.6 4.6A2 2 0 1 1 11 8H2"></path><path d="M12.6 19.4A2 2 0 1 0 14 16H2"></path></svg></div>
            <span style="font-size:12px;font-weight:700;padding:5px 13px;border-radius:999px;background:#FDEBD9;color:#A95508">AMS</span>
          </div>
          <div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:17px;color:#2C2A6B">Acute Mountain Sickness <span style="font-family:'Noto Sans Telugu',sans-serif;font-size:11.5px;font-weight:600;color:#6966A4">ఎత్తు అనారోగ్యం</span></div>
          <p style="margin:0;font-size:13.5px;line-height:1.55;color:#4A4880">The most common altitude illness — the body protesting a fast ascent above ~2,500 m.</p>
          <div style="font-size:11px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:#6966A4;margin-top:4px">Warning signs</div>
          <div style="font-size:13.5px;line-height:1.7;color:#4A4880">Headache · Nausea, poor appetite · Poor sleep, fatigue · Dizziness</div>
          <div style="font-size:12px;color:#6966A4"><strong>Higher risk:</strong> Fast ascent, no rest days, previous AMS.</div>
          <div style="font-size:12.5px;line-height:1.55;color:#3A3870;background:#EAF2FB;border-radius:14px;padding:12px 14px;margin-top:auto">Usually settles with rest and no further ascent. It's a signal to pause — not panic.</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:10px;padding:26px;border-radius:26px;border:1px solid rgba(255,255,255,0.9);background:rgba(255,255,255,0.75);backdrop-filter:blur(16px);box-shadow:0 24px 56px -26px rgba(29,27,75,0.3)">
          <div style="display:flex;align-items:center;justify-content:space-between">
            <div style="width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:#E7E7F4;color:#2C2A6B"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"></path></svg></div>
            <span style="font-size:12px;font-weight:700;padding:5px 13px;border-radius:999px;background:#FBE7E5;color:#BE3A2F">HAPE</span>
          </div>
          <div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:17px;color:#2C2A6B">High-Altitude Pulmonary Edema <span style="font-family:'Noto Sans Telugu',sans-serif;font-size:11.5px;font-weight:600;color:#6966A4">ఊపిరితిత్తుల్లో నీరు</span></div>
          <p style="margin:0;font-size:13.5px;line-height:1.55;color:#4A4880">Fluid collecting in the lungs at altitude — uncommon, but the most dangerous lung emergency up there.</p>
          <div style="font-size:11px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:#6966A4;margin-top:4px">Warning signs</div>
          <div style="font-size:13.5px;line-height:1.7;color:#4A4880">Breathless even at rest · Cough (sometimes frothy/pink) · Chest tightness · Exhaustion out of proportion</div>
          <div style="font-size:12px;color:#6966A4"><strong>Higher risk:</strong> Rapid ascent, existing lung conditions, previous HAPE, heavy exertion on arrival day.</div>
          <div style="font-size:12.5px;line-height:1.55;color:#3A3870;background:#FBE7E5;border-radius:14px;padding:12px 14px;margin-top:auto">A medical emergency: descend and seek help immediately. Recognising it early saves lives.</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:10px;padding:26px;border-radius:26px;border:1px solid rgba(255,255,255,0.9);background:rgba(255,255,255,0.75);backdrop-filter:blur(16px);box-shadow:0 24px 56px -26px rgba(29,27,75,0.3)">
          <div style="display:flex;align-items:center;justify-content:space-between">
            <div style="width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:#E7E7F4;color:#2C2A6B"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"></path><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"></path></svg></div>
            <span style="font-size:12px;font-weight:700;padding:5px 13px;border-radius:999px;background:#FBE7E5;color:#BE3A2F">HACE</span>
          </div>
          <div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:17px;color:#2C2A6B">High-Altitude Cerebral Edema <span style="font-family:'Noto Sans Telugu',sans-serif;font-size:11.5px;font-weight:600;color:#6966A4">మెదడు వాపు</span></div>
          <p style="margin:0;font-size:13.5px;line-height:1.55;color:#4A4880">Brain swelling at altitude — rare, but serious. Usually follows untreated AMS.</p>
          <div style="font-size:11px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:#6966A4;margin-top:4px">Warning signs</div>
          <div style="font-size:13.5px;line-height:1.7;color:#4A4880">Confusion, unusual behaviour · Stumbling, clumsy walk · Severe headache · Drowsiness</div>
          <div style="font-size:12px;color:#6966A4"><strong>Higher risk:</strong> Ignoring AMS symptoms and continuing to ascend.</div>
          <div style="font-size:12.5px;line-height:1.55;color:#3A3870;background:#FBE7E5;border-radius:14px;padding:12px 14px;margin-top:auto">A medical emergency: immediate descent. Travel companions should know these signs too.</div>
        </div>
      </div>

      <!-- INCLUDED + WHO -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px">
        <div style="padding:30px 32px;border-radius:28px;border:1px solid rgba(255,255,255,0.9);background:rgba(255,255,255,0.75);backdrop-filter:blur(16px);box-shadow:0 24px 56px -26px rgba(29,27,75,0.3)">
          <div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:19px;color:#2C2A6B">What the Shikhar assessment includes</div>
          <div style="font-family:'Noto Sans Telugu',sans-serif;font-size:12px;color:#6966A4;margin:4px 0 16px">అసెస్‌మెంట్‌లో ఏమేమి ఉంటాయి</div>
          <div style="display:flex;flex-direction:column;gap:12px;font-size:14px;line-height:1.55;color:#4A4880">
            <div style="display:flex;gap:10px;background:#EAF2FB;border-radius:16px;padding:14px 16px"><strong style="color:#2C2A6B;flex-shrink:0">Spirometry</strong>Full lung-function testing — how much air your lungs move, and how fast.</div>
            <div style="display:flex;gap:10px;background:#EAF2FB;border-radius:16px;padding:14px 16px"><strong style="color:#2C2A6B;flex-shrink:0">CPET / CPET-lite</strong>Cardio-pulmonary exercise testing: how your heart and lungs perform under load — with VO₂max for athletes.</div>
            <div style="display:flex;gap:10px;background:#EAF2FB;border-radius:16px;padding:14px 16px"><strong style="color:#2C2A6B;flex-shrink:0">Physician consult</strong>A pulmonologist reviews your results, your itinerary and your history — with tailored ascent advice.</div>
            <div style="display:flex;gap:10px;background:#EAF2FB;border-radius:16px;padding:14px 16px"><strong style="color:#2C2A6B;flex-shrink:0">Certificate</strong>A physician-signed altitude-fitness assessment from the Advanced Lung Function &amp; Exercise Physiology Lab.</div>

      <!-- E. REFER → COLLABORATE → RETURN -->
      <section style="margin-bottom:60px">

        <p style="font-size:15px;color:#69679C;margin:0 0 26px;max-width:720px">Patients can access advanced Yashoda expertise when required while maintaining continuity with their referring physician wherever clinically appropriate.</p>

            <span style="display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#F5821F,#FFA452);color:#fff;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:16px">2</span>

            <p style="font-size:13.5px;line-height:1.6;color:#4A4880;margin:0">The assessment, investigation or procedure is done and discussed with you — you stay part of the decision, not downstream of it.</p>
          </li>
          <li style="padding:28px;border-radius:26px;border:1px solid rgba(255,255,255,0.9);background:rgba(255,255,255,0.78);backdrop-filter:blur(16px);box-shadow:0 24px 56px -26px rgba(29,27,75,0.3)">
            <span style="display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#F5821F,#FFA452);color:#fff;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:16px">3</span>

            <p style="font-size:13.5px;line-height:1.6;color:#4A4880;margin:0">Wherever clinically appropriate, the patient returns to you for continuing care with a clear plan they and you both understand.</p>
          </li>
        </ol>
      </section>

      <!-- F. CASE RESCUE -->
      <section style="margin-bottom:60px;padding:40px 44px;border-radius:30px;background:linear-gradient(145deg,#2C2A6B,#1D1B4B);color:#fff;box-shadow:0 30px 70px -30px rgba(29,27,75,0.6)">
        <div style="display:grid;grid-template-columns:1.3fr 0.7fr;gap:32px;align-items:center">
          <div>
            <span style="display:inline-block;font-size:11px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;padding:5px 13px;border-radius:999px;background:rgba(245,130,31,0.22);color:#FFB067">ŪPIRI Case Rescue</span>
            <h2 style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(24px,3vw,32px);letter-spacing:-0.02em;color:#fff;margin:14px 0 0">Have a difficult pulmonary case?</h2>
            <p style="font-size:15px;line-height:1.65;color:#C9D2E6;margin:12px 0 0;max-width:620px">Submit a case that is not behaving the way you expected and it goes to a specialist for discussion — imaging, physiology, the treatment already tried and what to consider next. This is clinical collaboration between colleagues, not a route to move the patient.</p>
          </div>
          <div>
            <a href="{{ wa.netCase }}" target="_blank" rel="noreferrer" style="display:inline-flex;align-items:center;gap:10px;padding:15px 30px;border-radius:999px;font-size:15.5px;font-weight:700;color:#fff;background:linear-gradient(135deg,#F5821F,#FFA452);box-shadow:0 16px 38px -12px rgba(245,130,31,0.7);transition:transform .18s ease" style-hover="transform:translateY(-2px) scale(1.02);color:#fff">

      </section>

      <!-- G. CLINICAL COUNCIL -->

        <h2 style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(22px,2.8vw,30px);letter-spacing:-0.02em;color:#1D1B4B;margin:0 0 8px">ŪPIRI Clinical Council</h2>
        <p style="font-size:15px;line-height:1.6;color:#69679C;margin:0 0 8px;max-width:720px">A standing group of 15–25 members who shape the network's academic direction — what gets taught, which cases get discussed, and where the network puts its effort.</p>

            </article>

        </div>

          <a href="{{ wa.netCouncil }}" target="_blank" rel="noreferrer" style="display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:999px;font-size:14px;font-weight:700;color:#2C2A6B;background:rgba(255,255,255,0.85);border:2px solid rgba(44,42,107,0.14);transition:transform .18s ease" style-hover="transform:translateY(-2px);color:#2C2A6B">Ask about the Clinical Council</a>

              <h3 style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:16.5px;color:#2C2A6B;margin:0 0 6px">{{ e.t }}</h3>
              <p style="font-size:13.5px;line-height:1.6;color:#4A4880;margin:0">{{ e.d }}</p>
            </article>
          </sc-for>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:22px">
          <a href="{{ wa.netCme }}" target="_blank" rel="noreferrer" style="padding:11px 22px;border-radius:999px;font-size:13.5px;font-weight:700;color:#2C2A6B;background:rgba(255,255,255,0.85);border:1.5px solid rgba(44,42,107,0.14)" style-hover="color:#2C2A6B;transform:translateY(-1px)">CME &amp; Grand Rounds list</a>

      <section style="text-align:center;padding:46px 30px;border-radius:30px;border:1px solid rgba(255,255,255,0.9);background:rgba(255,255,255,0.78);backdrop-filter:blur(20px);box-shadow:0 28px 66px -28px rgba(29,27,75,0.35)">
        <h2 style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(22px,3vw,32px);letter-spacing:-0.02em;color:#1D1B4B;margin:0;text-wrap:balance">Become part of the ŪPIRI Clinical Network</h2>

            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
          </button>

            <p style="font-size:13.5px;color:#F5821F;font-weight:700;margin:4px 0 0">Trusted pulmonary knowledge from Yashoda experts.</p>

          </div>
        </div>
        <p style="font-size:16px;line-height:1.6;color:#4A4880;margin:0 0 24px;max-width:760px;text-wrap:pretty">Trusted pulmonary information from Yashoda Hospitals — explained simply, clearly and by topic.</p>

  <!-- ============ THE AIRLIFT: HELICOPTER + THE 24x7 MESSAGE ============ -->
  <!-- Fixed to the viewport rather than to the scene, because the flight path is
       the width of the screen and it has to reach the corner Uppi stands in.
       Inert to the pointer throughout: it must never intercept a tap meant for
       the page, and least of all one meant for the emergency number. -->
  <sc-if value="{{ isEcmo }}" hint-placeholder-val="{{ false }}">
    <div aria-hidden="true" style="position:fixed;inset:0;pointer-events:none;z-index:8990;overflow:hidden">
      <div data-r="heli" style="position:absolute;right:auto;left:0;bottom:96px;width:170px;opacity:0;transform:translateX(-38vw);will-change:transform">
        <svg viewBox="0 0 170 96" width="170" height="96" fill="none" aria-hidden="true">
          <!-- tail boom -->
          <path d="M96 44 L152 39 L152 47 L96 52 Z" fill="#2C2A6B"></path>
          <path d="M148 26 L158 26 L158 44 L150 44 Z" fill="#2C2A6B"></path>
          <circle cx="153" cy="33" r="7" fill="#F5821F"></circle>
          <!-- cabin -->
          <ellipse cx="66" cy="48" rx="42" ry="25" fill="#2C2A6B"></ellipse>
          <path d="M40 38 q12 -12 30 -11 l0 22 l-30 0 Z" fill="#BBD3F0"></path>
          <rect x="76" y="34" width="22" height="16" rx="5" fill="#4E4B96"></rect>
          <!-- the orange stripe and the cross: it reads as a medical aircraft -->
          <path d="M28 54 q38 12 78 3 l0 7 q-40 9 -78 -3 Z" fill="#F5821F"></path>
          <path d="M60 60 h14 M67 53 v14" stroke="#fff" stroke-width="4" stroke-linecap="round"></path>
          <!-- skids -->
          <path d="M40 74 h56 M46 68 l-4 6 M92 68 l4 6" stroke="#1D1B4B" stroke-width="4" stroke-linecap="round"></path>
          <!-- rotor: a mast, and a blade disc that scales rather than rotates -->
          <path d="M66 22 v6" stroke="#1D1B4B" stroke-width="5" stroke-linecap="round"></path>
          <g data-r="heli-rotor" style="transform-origin:66px 20px;transform-box:fill-box">
            <ellipse cx="66" cy="20" rx="62" ry="3.2" fill="#1D1B4B" opacity="0.85"></ellipse>
          </g>
          <!-- the passenger, on a line under the cabin -->
          <g data-r="heli-rider" style="opacity:0;transition:opacity .3s ease">
            <path d="M66 72 v9" stroke="#1D1B4B" stroke-width="2.5" stroke-linecap="round"></path>
            <ellipse cx="66" cy="88" rx="9" ry="8" fill="#F2989F"></ellipse>
            <path d="M66 80 v-3" stroke="#F2989F" stroke-width="3" stroke-linecap="round"></path>
            <circle cx="63" cy="87" r="1.8" fill="#1D1B4B"></circle>
            <circle cx="69" cy="87" r="1.8" fill="#1D1B4B"></circle>

        <span aria-hidden="true" style="flex:none;width:38px;height:38px;border-radius:12px;background:rgba(245,130,31,0.22);display:flex;align-items:center;justify-content:center;color:#FFB877">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4"></path><path d="M4 8h16"></path><path d="M6 8v6a6 6 0 0 0 12 0V8"></path><path d="M9 20h6"></path></svg>
        </span>
        <span style="flex:1">
          <span style="display:block;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:15px;line-height:1.3">In an emergency we provide 24&times;7 Air Ambulance Support</span>
          <span style="display:block;font-size:12.5px;line-height:1.55;color:#C9D2E6;margin-top:5px">Nationally and internationally, with ECMO transfer where it is needed.</span>
          <a href="tel:105910" style="display:inline-flex;align-items:center;gap:7px;margin-top:11px;padding:9px 17px;border-radius:999px;font-size:13.5px;font-weight:800;color:#1D1B4B;background:#F5821F" style-hover="color:#1D1B4B;background:#FFA452">Call 105910</a>
        </span>
        <button onClick="{{ closeEcmoPop }}" aria-label="Dismiss" style="flex:none;width:26px;height:26px;border-radius:50%;border:none;background:rgba(255,255,255,0.12);color:#C9D2E6;cursor:pointer;pointer-events:auto;display:flex;align-items:center;justify-content:center">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg>

  <!-- ============ ECMO & THE 24x7 AIR AMBULANCE ============ -->
  <sc-if value="{{ isEcmo }}" hint-placeholder-val="{{ false }}">
  <div data-screen-label="ECMO and air ambulance" style="min-height:100vh;padding:120px 24px 90px">
    <div style="max-width:900px;margin:0 auto">

      <nav aria-label="Breadcrumb" style="margin-bottom:16px">
        <ol style="list-style:none;display:flex;gap:8px;flex-wrap:wrap;padding:0;margin:0;font-size:12.5px;color:#6966A4">
          <li><button onClick="{{ goHome }}" style="background:none;border:none;padding:0;cursor:pointer;font-size:12.5px;color:#69679C;text-decoration:underline">Home</button></li>
          <li aria-hidden="true">&rsaquo;</li>
          <li><button onClick="{{ goProcs }}" style="background:none;border:none;padding:0;cursor:pointer;font-size:12.5px;color:#69679C;text-decoration:underline">Tests &amp; Procedures</button></li>
          <li aria-hidden="true">&rsaquo;</li>
          <li aria-current="page" style="font-weight:700;color:#2C2A6B">ECMO &amp; Air Ambulance</li>
        </ol>
      </nav>

      <span style="display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:0.09em;text-transform:uppercase;padding:6px 14px;border-radius:999px;background:#FBE7E5;color:#A6362C">Advanced lung failure · 24&times;7</span>
      <h1 style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(28px,4vw,44px);line-height:1.12;letter-spacing:-0.025em;color:#1D1B4B;margin:14px 0 0">ECMO, and the air ambulance that brings you to it</h1>
      <p style="font-size:17.5px;line-height:1.6;color:#4A4880;margin:14px 0 0;max-width:660px">When a lung fails faster than a patient can be moved, the answer is not a faster ambulance. It is a team that can take over the work of the lungs where the patient already is — and then fly them in.</p>

      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:26px">
        <a href="tel:105910" style="display:inline-flex;align-items:center;gap:10px;padding:15px 28px;border-radius:999px;font-size:16px;font-weight:800;color:#fff;background:linear-gradient(135deg,#BE3A2F,#E4737E);box-shadow:0 16px 38px -12px rgba(206,68,56,0.6)" style-hover="transform:translateY(-2px);color:#fff">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
          Emergency &amp; air support: 105910
        </a>
        <button onClick="{{ goFind }}" style="padding:15px 28px;border-radius:999px;font-size:15px;font-weight:700;color:#2C2A6B;background:rgba(255,255,255,0.9);border:1.5px solid rgba(44,42,107,0.16);cursor:pointer">Talk to a pulmonologist</button>
      </div>

      <!-- The scene. Everything in it is decoration; the helicopter is drawn by
           the page and the character is Uppi's own, reached only through his
           documented airlift() seam. -->
      <div data-r="heli-scene" aria-hidden="true" style="position:relative;height:190px;margin:34px 0 6px;border-radius:26px;overflow:hidden;background:linear-gradient(180deg,#EDF2F8 0%,#DDE6F3 62%,#CBD8EB 100%);border:1px solid rgba(44,42,107,0.1)">
        <span style="position:absolute;left:0;right:0;bottom:0;height:44px;background:linear-gradient(180deg,rgba(44,42,107,0.05),rgba(44,42,107,0.14))"></span>
        <span style="position:absolute;left:6%;bottom:44px;width:34px;height:52px;background:rgba(44,42,107,0.16);border-radius:4px 4px 0 0"></span>
        <span style="position:absolute;left:12%;bottom:44px;width:22px;height:78px;background:rgba(44,42,107,0.12);border-radius:4px 4px 0 0"></span>
        <span style="position:absolute;left:17%;bottom:44px;width:40px;height:38px;background:rgba(44,42,107,0.14);border-radius:4px 4px 0 0"></span>
        <span style="position:absolute;right:9%;bottom:44px;width:28px;height:64px;background:rgba(44,42,107,0.13);border-radius:4px 4px 0 0"></span>
        <span style="position:absolute;left:50%;top:26px;transform:translateX(-50%);font-size:11.5px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:rgba(44,42,107,0.34)">Hitec City · rooftop evacuation</span>
      </div>
      <p style="font-size:12px;color:#6966A4;margin:0 0 10px">Illustration. Yashoda&rsquo;s Hitec City facility provides air ambulance and medical evacuation from the terrace.</p>

      <section style="margin-top:30px">
        <h2 style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:23px;color:#1D1B4B;margin:0 0 8px">What ECMO actually is</h2>
        <p style="font-size:15.5px;line-height:1.75;color:#3D3B72;margin:0 0 18px">Extracorporeal membrane oxygenation is a way of taking over gas exchange from outside the body, so that lungs which cannot keep up are allowed to stop trying for a while.</p>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
          <sc-for list="{{ ecmoWhat }}" as="x" hint-placeholder-count="4">
            <article style="padding:22px 24px;border-radius:22px;background:#fff;border:1px solid rgba(44,42,107,0.1)">
              <h3 style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:16px;line-height:1.3;color:#2C2A6B;margin:0 0 8px">{{ x.t }}</h3>
              <p style="font-size:13.5px;line-height:1.65;color:#4A4880;margin:0">{{ x.d }}</p>
            </article>
          </sc-for>
        </div>
      </section>

      <section style="margin-top:34px;padding:28px 30px;border-radius:26px;background:#E7E7F4;border:1px solid rgba(44,42,107,0.14)">
        <h2 style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:23px;color:#1D1B4B;margin:0 0 8px">Awake ECMO</h2>
        <p style="font-size:15.5px;line-height:1.75;color:#3D3B72;margin:0 0 14px">Most people picture ECMO as a patient asleep on a ventilator. It does not have to be. Yashoda reports one of the highest series of Awake ECMO cases anywhere, with more than a hundred since the COVID pandemic, and describes it as the standard of care for its sickest patients.</p>
        <ul style="margin:0;padding-left:20px;font-size:15px;line-height:1.75;color:#3D3B72">
          <sc-for list="{{ ecmoAwake }}" as="x" hint-placeholder-count="5"><li style="margin-bottom:7px">{{ x.t }}</li></sc-for>
        </ul>
        <p style="font-size:14px;line-height:1.7;color:#4A4880;margin:16px 0 0">This runs out of a dedicated Advanced Lung Failure Unit, with daily rounds by intensivists, specialty doctors, perfusionists, respiratory therapists, physiotherapists, dietitians and specialist nursing staff.</p>
      </section>

      <section style="margin-top:34px">
        <h2 style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:23px;color:#1D1B4B;margin:0 0 8px">The air lift</h2>
        <p style="font-size:15.5px;line-height:1.75;color:#3D3B72;margin:0 0 18px">Yashoda operates air ambulance services 24&times;7, nationally and internationally, staffed by doctors, nurses and paramedics equipped for the patient they are going to collect. What it is used for:</p>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
          <sc-for list="{{ ecmoAir }}" as="x" hint-placeholder-count="7">
            <article style="padding:20px 22px;border-radius:20px;background:#fff;border:1px solid rgba(44,42,107,0.1)">
              <h3 style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:15px;line-height:1.3;color:#2C2A6B;margin:0 0 7px">{{ x.t }}</h3>
              <p style="font-size:13px;line-height:1.6;color:#4A4880;margin:0">{{ x.d }}</p>
            </article>
          </sc-for>
        </div>
