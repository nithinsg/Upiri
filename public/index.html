  tTog(id) { const a = this.state.tSel; this.setState({ tSel: a.includes(id) ? a.filter(x => x !== id) : a.concat(id) }); }
  tNext = () => { this.setState({ tStep: Math.min(2, this.state.tStep + 1) }); window.scrollTo({ top: 0 }); };
  tBack = () => { const s = this.state; if (s.tStep > 0) this.setState({ tStep: s.tStep - 1 }); else this.go('home'); };
  tRestart = () => this.setState({ tStep: 0, tSel: [], tFollow: {}, tAge: null, tSmoke: null, tKnown: null });
  runTriage() {
    const s = this.state, has = id => s.tSel.includes(id), f = s.tFollow;
    if (has('breath') && f.breathWhen === 'Even at rest') return { level: 0, reasons: ['breathlessness even at rest'] };
    const r24 = [];
    if (has('blood')) r24.push('blood in the sputum');
    if (has('tight')) r24.push('chest tightness or pain');
    if (has('fever') && has('breath')) r24.push('fever together with breathlessness');
    if (s.tKnown && s.tKnown !== 'None' && (has('breath') || has('wheeze'))) r24.push('worsening breathing with known ' + s.tKnown);
    if (r24.length) return { level: 1, reasons: r24 };
    const rw = [];
    if (has('cough') && f.coughDur === '3 weeks or more') rw.push('a cough lasting 3 weeks or more');
    if (has('weight')) rw.push('unexplained weight loss');
    if (has('hoarse')) rw.push('a hoarse voice beyond 3 weeks');
    if (rw.length) return { level: 2, reasons: rw };
    return { level: 3, reasons: [] };
  }

        "అంటే విశ్రాంతిలో కాకుండా శ్రమ చేసినప్పుడు వస్తుంది. ఇది ఉపయోగకరమైన తేడా.",
      "Do you have the report with you — does it give a size, and was anything recommended?":
        "రిపోర్ట్ మీ దగ్గర ఉందా — అందులో కొలత ఇచ్చారా, ఏమైనా సూచించారా?",
      "So it's only when you push a bit, not the whole time. That boundary is worth knowing.":
        "అంటే కొంచెం శ్రమ చేసినప్పుడు మాత్రమే, ఎప్పుడూ కాదు. ఈ హద్దు తెలుసుకోవడం ముఖ్యం.",
      "You've told me enough to be useful. The next step is someone listening to your chest.":
        "మీరు చెప్పింది సరిపోతుంది. తదుపరి అడుగు — ఎవరైనా మీ ఛాతీని పరీక్షించడం.",
      "Good to know you've never smoked — that does change which explanations are more likely.":
        "మీరు ఎప్పుడూ పొగ తాగలేదని తెలియడం మంచిది — దీనివల్ల ఏ కారణాలు ఎక్కువ సాధ్యమో మారుతుంది.",
      "That's a reasonable thing to be worried about, and it's worth working through properly.":
        "దీని గురించి ఆందోళన పడటం సహజం, దీనిని సరిగా పరిశీలించడం మంచిది.",
      "The fact that it is getting worse rather than settling is the part that matters most here.":
        "ఇది తగ్గకుండా ఎక్కువవుతుండటమే ఇక్కడ అత్యంత ముఖ్యమైన విషయం.",
      "When it is at its worst, can you still speak in full sentences and manage around the house?":
        "ఎక్కువగా ఉన్నప్పుడు కూడా మీరు పూర్తి వాక్యాలు మాట్లాడగలరా, ఇంటి పనులు చేసుకోగలరా?",
      "needing your reliever inhaler most days, which usually means the treatment needs revisiting":
        "చాలా రోజులు రిలీవర్ ఇన్‌హేలర్ అవసరం కావడం — సాధారణంగా చికిత్సను మళ్లీ చూడాల్సి ఉందని అర్థం",
      "Is there anything that reliably sets it off — dust, smoke, cold air, exercise, a particular room?":
        "దీనిని ఖచ్చితంగా మొదలుపెట్టేది ఏదైనా ఉందా — దుమ్ము, పొగ, చల్లని గాలి, వ్యాయామం, ఏదైనా గది?",
      "Thanks for being straight with me about that — it helps, and it's not something to be judged for.":
        "దాని గురించి నిజం చెప్పినందుకు ధన్యవాదాలు — ఇది సహాయపడుతుంది, దీనికి ఎవరూ మిమ్మల్ని తప్పుపట్టరు.",
      "Does anyone smoke at home, or is there much smoke or dust around — cooking fire, incense, traffic?":
        "ఇంట్లో ఎవరైనా పొగ తాగుతారా, లేదా చుట్టూ పొగ, దుమ్ము ఎక్కువగా ఉంటుందా — వంట పొయ్యి, అగరుబత్తి, ట్రాఫిక్?",
      "Hi, I'm Uppi, your lung partner. Tell me what's bothering you, and we'll figure out what to do next.":
        "నమస్తే, నేను ఊపిరి — మీ ఊపిరితిత్తుల తోడు. మిమ్మల్ని ఏమి ఇబ్బంది పెడుతోందో చెప్పండి, తరువాత ఏమి చేయాలో కలిసి చూద్దాం.",
      "Has anyone told you that you stop breathing or gasp during sleep — and how do you feel through the day?":
        "నిద్రలో మీరు ఊపిరి ఆపేస్తున్నారని ఎవరైనా చెప్పారా — పగలంతా ఎలా అనిపిస్తోంది?",
      "Does the breathlessness come on when you move around, or does it happen even when you are sitting still?":
        "కదిలినప్పుడు ఊపిరి ఆడకపోతుందా, లేక కూర్చున్నప్పుడు కూడా అలాగే ఉంటుందా?",
      "If anything changes, or you think of something you forgot to mention, tell me and I'll take another look.":
        "ఏదైనా మారితే, లేదా చెప్పడం మరిచిపోయినది గుర్తొస్తే, నాకు చెప్పండి — నేను మళ్లీ చూస్తాను.",
      "Night-time is a real clue. Symptoms that peak at night or early morning tend to behave in a particular way.":
        "రాత్రి సమయం ఒక ముఖ్యమైన సూచన. రాత్రి లేదా తెల్లవారుజామున ఎక్కువయ్యే లక్షణాలు ఒక ప్రత్యేక రీతిలో ప్రవర్తిస్తాయి.",
      "Is it worse at any particular time — at night, first thing in the morning, or after being around dust or smoke?":
        "ఏదైనా ఒక సమయంలో ఎక్కువవుతుందా — రాత్రి, తెల్లవారుజామున, లేదా దుమ్ము, పొగ తగిలిన తరువాత?",
      "Is there anything you have noticed in yourself — a cough, breathlessness, anything that made you think about it now?":
        "మీలో మీరు గమనించినది ఏదైనా ఉందా — దగ్గు, ఊపిరి ఆడకపోవడం, ఇప్పుడు దీని గురించి ఆలోచించేలా చేసినది?",
      "Breathlessness is worth taking seriously whenever it is new, or worse than it used to be for the same amount of effort.":
        "ఊపిరి ఇబ్బంది కొత్తగా వచ్చినప్పుడు, లేదా అదే స్థాయి శ్రమకు గతంలో కంటే ఎక్కువగా ఉన్నప్పుడు, దానిని తీవ్రంగా పరిగణించాలి.",
      "The Yashoda call centre is 080 6590 6165 if you need help getting there. I'll stay here, but please make the call first.":
        "అక్కడికి చేరడంలో సహాయం కావాలంటే యశోద కాల్ సెంటర్ నంబర్ 080 6590 6165. నేను ఇక్కడే ఉంటాను, కానీ ముందు కాల్ చేయండి.",
      "While you're here — what has been going on with your breathing? Anything you tell me now is worth mentioning in the room.":
        "మీరు ఇక్కడ ఉన్నారు కాబట్టి — మీ శ్వాస విషయంలో ఏమి జరుగుతోంది? ఇప్పుడు మీరు చెప్పేది డాక్టర్ గదిలో కూడా చెప్పడం మంచిది.",
      "An assessment usually starts with a chest X-ray and a breathing test, plus a sputum test where tuberculosis is a possibility.":
        "పరీక్ష సాధారణంగా ఛాతీ ఎక్స్-రే, శ్వాస పరీక్షతో మొదలవుతుంది — క్షయ (టీబీ) అనుమానం ఉంటే కఫం పరీక్ష కూడా.",
      "Diagnosis needs spirometry, a simple breathing test where you blow hard into a machine. It is the only way to confirm COPD rather than assume it.":
        "నిర్ధారణకు స్పైరోమెట్రీ అవసరం — ఇది ఒక సాధారణ శ్వాస పరీక్ష, యంత్రంలోకి గట్టిగా ఊదాలి. సీఓపీడీని ఊహించకుండా నిర్ధారించడానికి ఇదొక్కటే మార్గం.",
      "It is also genuinely hard, and it usually takes support rather than willpower alone. That is not a character judgement — it is how nicotine works.":
        "ఇది నిజంగా కష్టం కూడా, సాధారణంగా కేవలం సంకల్పం కాకుండా సహాయం అవసరం. ఇది మీ వ్యక్తిత్వంపై తీర్పు కాదు — నికోటిన్ పనిచేసే తీరు అది.",
      "I'm here for anything to do with breathing and lungs — a cough, a wheeze, breathlessness, allergies, sleep, smoking, or a test you've been asked to have.":
        "శ్వాస, ఊపిరితిత్తులకు సంబంధించిన దేనికైనా నేను ఇక్కడ ఉన్నాను — దగ్గు, పిల్లికూత, ఊపిరి ఇబ్బంది, అలర్జీలు, నిద్ర, పొగ అలవాటు, లేదా మీకు చెప్పిన ఏదైనా పరీక్ష.",
      "If an inhaler seems to have stopped working, technique is worth checking before the dose is changed. It is a two-minute thing to review at any appointment.":
        "ఇన్‌హేలర్ పనిచేయడం ఆగినట్టు అనిపిస్తే, మోతాదు మార్చే ముందు వాడే పద్ధతిని ఒకసారి పరిశీలించడం మంచిది. ఏ అపాయింట్‌మెంట్‌లోనైనా ఇది రెండు నిమిషాల పని.",
      "Uppi is a guide, not a doctor, and cannot diagnose. This conversation stays on your device and is cleared when you close the tab. In an emergency call {n}.":
        "ఊపిరి ఒక సహాయకుడు మాత్రమే, వైద్యుడు కాదు — రోగ నిర్ధారణ చేయలేడు. ఈ సంభాషణ మీ పరికరంలోనే ఉంటుంది, ట్యాబ్ మూసేయగానే తొలగిపోతుంది. అత్యవసర పరిస్థితిలో {n}కి కాల్ చేయండి.",
      "Go to the nearest emergency department now, or call 108 for an ambulance. If you are struggling to breathe, do not drive yourself — ask someone to take you.":
        "ఇప్పుడే దగ్గరలోని అత్యవసర విభాగానికి వెళ్లండి, లేదా అంబులెన్స్ కోసం 108కి కాల్ చేయండి. ఊపిరి తీసుకోవడం కష్టంగా ఉంటే మీరే వాహనం నడపవద్దు — ఎవరినైనా తీసుకెళ్లమని అడగండి.",
      "Three weeks is the point where a cough stops being a leftover from a cold and starts deserving a proper look. That is not a reason to panic — it is a reason to book.":
        "మూడు వారాలు దాటిన దగ్గు ఇక జలుబు తాలూకు మిగులు కాదు — దానిని సరిగా పరిశీలించాల్సిన సమయం అది. ఇది భయపడాల్సిన కారణం కాదు — అపాయింట్‌మెంట్ తీసుకోవాల్సిన కారణం.",
      "Sneezing, an itchy or blocked nose and watery eyes usually mean the lining of the nose is reacting to something in the air — dust mites, pollen, mould, pets or smoke.":
        "తుమ్ములు, ముక్కు దురద లేదా మూసుకుపోవడం, కళ్లలో నీరు — సాధారణంగా గాలిలోని దేనికో ముక్కు లోపలి పొర స్పందిస్తోందని అర్థం — దుమ్ము పురుగులు, పుప్పొడి, బూజు, పెంపుడు జంతువులు లేదా పొగ.",
      "Testing is straightforward: a sputum test and a chest X-ray. Anyone with that pattern should be tested rather than treated with repeated courses of ordinary antibiotics.":
        "పరీక్ష సులభమే: కఫం పరీక్ష, ఛాతీ ఎక్స్-రే. ఆ తీరు ఉన్నవారికి మామూలు యాంటీబయాటిక్స్ మళ్లీ మళ్లీ ఇవ్వకుండా పరీక్ష చేయించాలి.",
      "It is common, very treatable, and worth diagnosing because untreated it pushes up blood pressure and cardiac risk. The test is a sleep study, which can often be done at home.":
        "ఇది సాధారణం, చికిత్సకు బాగా లొంగుతుంది, నిర్ధారించుకోవడం ముఖ్యం — ఎందుకంటే చికిత్స లేకపోతే ఇది రక్తపోటును, గుండె ప్రమాదాన్ని పెంచుతుంది. పరీక్ష అంటే నిద్ర పరీక్ష, దీనిని తరచుగా ఇంట్లోనే చేయవచ్చు.",
      "Lungs are not the only cause — the heart, anaemia and anxiety all produce genuine breathlessness. That is part of why an assessment rather than a guess is the right next step.":
        "ఊపిరితిత్తులే ఏకైక కారణం కాదు — గుండె, రక్తహీనత, ఆందోళన కూడా నిజమైన ఊపిరి ఇబ్బందిని కలిగిస్తాయి. అందుకే ఊహించడం కాకుండా సరైన పరీక్ష చేయించుకోవడమే తదుపరి అడుగు.",
      "It needs specialist assessment — typically a high-resolution CT scan and detailed lung function testing — because the different types are managed very differently and some are treatable.":
        "దీనికి నిపుణుల పరిశీలన అవసరం — సాధారణంగా హై-రిజల్యూషన్ సీటీ స్కాన్, వివరమైన ఊపిరితిత్తుల పనితీరు పరీక్షలు — ఎందుకంటే వేర్వేరు రకాలకు చికిత్స చాలా వేరుగా ఉంటుంది, కొన్నింటికి చికిత్స ఉంది.",
      "Checking is quick and usually reassuring — a chest X-ray, and a CT scan if anything needs a closer look. Finding something early is the entire reason the threshold for looking is set low.":
        "పరీక్ష త్వరగా అవుతుంది, సాధారణంగా ధైర్యాన్నిస్తుంది — ఛాతీ ఎక్స్-రే, ఇంకా దగ్గరగా చూడాల్సి వస్తే సీటీ స్కాన్. ముందుగానే గుర్తించడమే పరీక్ష చేయించే హద్దును తక్కువగా ఉంచడానికి కారణం.",
      "It takes a few minutes, needs no needles, and is repeated a couple of times to get a reliable reading. You may be asked to do it again after an inhaler, to see how much the airways open up.":
        "దీనికి కొన్ని నిమిషాలు పడుతుంది, సూదులు అవసరం లేదు, నమ్మదగిన కొలత కోసం రెండు మూడుసార్లు చేస్తారు. శ్వాసనాళాలు ఎంత తెరుచుకుంటాయో చూడటానికి ఇన్‌హేలర్ తరువాత మళ్లీ చేయమని అడగవచ్చు.",
      "Signs that a child needs to be seen the same day: breathing fast or with obvious effort, the skin pulling in between or under the ribs, being too breathless to feed or speak, or drowsiness.":
        "పిల్లలను అదే రోజు వైద్యులకు చూపించాల్సిన సూచనలు: వేగంగా లేదా స్పష్టంగా కష్టపడి ఊపిరి తీసుకోవడం, పక్కటెముకల మధ్య లేదా కింద చర్మం లోపలికి లాగడం, పాలు తాగలేనంత లేదా మాట్లాడలేనంత ఊపిరి ఇబ్బంది, లేదా నిద్రమత్తు.",
      "Most coughs that start in the last week or two come from a viral infection, and they settle on their own — though the cough itself can hang around for a while after everything else has gone.":
        "గత వారం రెండు వారాల్లో మొదలైన చాలా దగ్గులు వైరల్ ఇన్ఫెక్షన్ వల్ల వస్తాయి, అవి వాటంతట అవే తగ్గుతాయి — అయితే మిగతా లక్షణాలు పోయిన తరువాత కూడా దగ్గు కొంతకాలం ఉండవచ్చు.",
      "Nothing you've described so far points to something that needs urgent attention. Keep an eye on how it changes over the next week — if it isn't settling, or anything new starts, that changes the answer.":
        "మీరు ఇప్పటివరకు చెప్పిన దేనిలోనూ వెంటనే చూడాల్సిన సూచన లేదు. వచ్చే వారంలో ఇది ఎలా మారుతుందో గమనించండి — తగ్గకపోతే, లేదా కొత్తగా ఏదైనా మొదలైతే, సమాధానం మారుతుంది.",
      "Spirometry means blowing as hard and as long as you can into a machine that measures how much air you move and how fast. It is the test that separates asthma from COPD rather than guessing between them.":
        "స్పైరోమెట్రీ అంటే — మీరు ఎంత గాలిని ఎంత వేగంగా కదిలిస్తారో కొలిచే యంత్రంలోకి వీలైనంత గట్టిగా, వీలైనంత సేపు ఊదడం. ఆస్తమాను సీఓపీడీ నుండి ఊహించకుండా వేరు చేసే పరీక్ష ఇదే.",
      "If it's easier, I can ask the Yashoda team to call you. Tap \"Ask Yashoda to call me\" below and give me your name and number, and I'll pass it straight to them. Nothing else from our conversation goes with it.":
        "మీకు సులభమైతే, యశోద బృందాన్ని మీకు కాల్ చేయమని నేను అడగగలను. కింద \"నాకు కాల్ చేయమని యశోదను అడగండి\" నొక్కి, మీ పేరు, ఫోన్ నంబర్ ఇవ్వండి — నేను నేరుగా వారికి అందిస్తాను. మన సంభాషణలోని మరేదీ దానితో వెళ్లదు.",
      "What matters is the trend. A cough that is slowly easing week by week is usually behaving normally. A cough that is getting worse, or that comes with fever and breathlessness, is worth having looked at sooner.":
        "ముఖ్యమైనది దాని గమనం. వారం వారం నెమ్మదిగా తగ్గుతున్న దగ్గు సాధారణంగా మామూలుగానే ఉంటుంది. ఎక్కువవుతున్న దగ్గు, లేదా జ్వరం, ఊపిరి ఇబ్బందితో వచ్చే దగ్గును త్వరగా పరీక్షించుకోవడం మంచిది.",
      "A wheeze is the whistling sound air makes when it squeezes through airways that have narrowed. Sometimes the small airways inside the lungs tighten, which can make breathing feel difficult or cause that whistle.":
        "ఇరుకైన శ్వాసనాళాల గుండా గాలి వెళ్లేటప్పుడు వచ్చే విజిల్ లాంటి శబ్దమే పిల్లికూత. కొన్నిసార్లు ఊపిరితిత్తుల లోపలి చిన్న నాళాలు బిగుసుకుంటాయి, దీనివల్ల శ్వాస కష్టంగా అనిపించవచ్చు లేదా ఆ శబ్దం రావచ్చు.",
      "It matters more than it looks. Untreated nasal allergy makes asthma harder to control, and the drip down the back of the throat is a common reason a cough will not settle. Treating the nose often quietens the chest.":
        "ఇది కనిపించే దానికంటే ముఖ్యం. చికిత్స చేయని ముక్కు అలర్జీ ఆస్తమాను నియంత్రించడం కష్టం చేస్తుంది, గొంతు వెనుక భాగంలోకి కారడం దగ్గు తగ్గకపోవడానికి సాధారణ కారణం. ముక్కుకు చికిత్స చేస్తే తరచుగా ఛాతీ కూడా శాంతిస్తుంది.",
      "Tuberculosis is still common in India, and it is treatable — but it needs to be found. The pattern to know is a cough lasting two weeks or more, often with evening fevers, night sweats, weight loss or loss of appetite.":
        "క్షయ (టీబీ) భారతదేశంలో ఇప్పటికీ సాధారణం, దీనికి చికిత్స ఉంది — కానీ ముందుగా గుర్తించాలి. తెలుసుకోవలసిన తీరు: రెండు వారాలు లేదా అంతకంటే ఎక్కువ కాలం ఉన్న దగ్గు, తరచుగా సాయంత్రం జ్వరం, రాత్రి చెమటలు, బరువు తగ్గడం లేదా ఆకలి లేకపోవడంతో పాటు.",
      "A wheeze that comes and goes — worse at night or early morning, worse around dust, smoke, cold air or exercise — is a pattern worth showing a doctor, because it responds well to treatment once it is properly identified.":
        "వచ్చి పోయే పిల్లికూత — రాత్రి లేదా తెల్లవారుజామున ఎక్కువ, దుమ్ము, పొగ, చల్లని గాలి లేదా వ్యాయామంతో ఎక్కువ — ఇది వైద్యులకు చూపించదగిన తీరు, ఎందుకంటే సరిగా గుర్తించిన తరువాత దీనికి చికిత్స బాగా పనిచేస్తుంది.",
      "Polluted air makes existing lung conditions flare and irritates healthy airways too. In Indian cities the main exposures are traffic and construction dust outdoors, and cooking smoke, incense and mosquito coils indoors.":
        "కలుషిత గాలి ఉన్న ఊపిరితిత్తుల సమస్యలను తీవ్రం చేస్తుంది, ఆరోగ్యమైన శ్వాసనాళాలను కూడా చికాకు పెడుతుంది. భారతీయ నగరాల్లో ప్రధాన కారణాలు — బయట ట్రాఫిక్, నిర్మాణ దుమ్ము; ఇంట్లో వంట పొగ, అగరుబత్తులు, దోమల చుట్టలు.",
      "Asthma means the airways are inflamed and easily irritated, so they narrow in response to triggers. It typically shows up as wheeze, cough, chest tightness or breathlessness that varies — worse at some times, gone at others.":
        "ఆస్తమా అంటే శ్వాసనాళాలు వాపుతో, తేలికగా చికాకు పడేలా ఉండటం — దాంతో ట్రిగ్గర్‌లకు స్పందించి అవి ఇరుకవుతాయి. ఇది సాధారణంగా పిల్లికూత, దగ్గు, ఛాతీ బిగుతు లేదా మారుతూ ఉండే ఊపిరి ఇబ్బందిగా కనిపిస్తుంది — కొన్ని సమయాల్లో ఎక్కువ, కొన్నిసార్లు అసలు ఉండదు.",
      "Unlike asthma, the narrowing does not fully reverse — but that does not mean nothing can be done. Stopping smoking, the right inhalers, vaccination and pulmonary rehabilitation all measurably change how well someone lives with it.":
        "ఆస్తమాలా కాకుండా, ఈ ఇరుకుదల పూర్తిగా తిరిగి సరికాదు — కానీ ఏమీ చేయలేమని కాదు. పొగ మానేయడం, సరైన ఇన్‌హేలర్లు, టీకాలు, పల్మనరీ రిహాబిలిటేషన్ — ఇవన్నీ దీనితో జీవించే తీరును స్పష్టంగా మెరుగుపరుస్తాయి.",
      "COPD is long-term narrowing of the airways, most often from years of smoking, and in India also from cooking smoke and occupational dust. It usually shows as breathlessness that has built up over years, a cough on most days, and phlegm.":
        "సీఓపీడీ అంటే శ్వాసనాళాలు దీర్ఘకాలంగా ఇరుకవడం — చాలావరకు ఏళ్ల తరబడి పొగ తాగడం వల్ల, భారతదేశంలో వంట పొగ, పని ప్రదేశపు దుమ్ము వల్ల కూడా. ఇది సాధారణంగా ఏళ్ల తరబడి పెరిగిన ఊపిరి ఇబ్బంది, చాలా రోజులు దగ్గు, కఫంగా కనిపిస్తుంది.",
      "Two things change asthma outcomes more than anything else: taking the preventer inhaler every day even when you feel fine, and using the inhaler correctly. A large share of people get less than half their dose because of technique alone.":
        "ఆస్తమా ఫలితాలను మిగతా వేటికంటే ఎక్కువగా మార్చేవి రెండు: బాగానే ఉన్నామనిపించినా ప్రతిరోజూ ప్రివెంటర్ ఇన్‌హేలర్ వాడటం, ఇన్‌హేలర్‌ను సరైన పద్ధతిలో వాడటం. కేవలం పద్ధతి సరిగా లేకపోవడం వల్లే చాలామందికి సగం మోతాదు కూడా అందడం లేదు.",
      "Practical steps help more than they sound like they would: cooking on gas or electricity rather than solid fuel, ventilating while cooking, avoiding outdoor exertion on the worst days, and keeping windows shut when a road is being dug up.":
        "ఆచరణాత్మక చర్యలు అనిపించే దానికంటే ఎక్కువ సహాయపడతాయి: కట్టెలు కాకుండా గ్యాస్ లేదా విద్యుత్‌పై వంట, వంట చేసేటప్పుడు గాలి ఆడేలా చూడటం, గాలి ఎక్కువ కలుషితమైన రోజుల్లో బయట శ్రమ తగ్గించడం, రోడ్డు తవ్వుతున్నప్పుడు కిటికీలు మూసి ఉంచడం.",
      "Loud snoring with pauses in breathing, gasping in the night, and feeling tired through the day despite enough hours in bed is the pattern of obstructive sleep apnoea — the throat relaxing enough during sleep to block airflow, over and over.":
        "గట్టిగా గురక, మధ్యలో శ్వాస ఆగిపోవడం, రాత్రి ఒక్కసారిగా ఊపిరి పీల్చడం, తగినంత సేపు పడుకున్నా పగలంతా అలసటగా ఉండటం — ఇది అబ్‌స్ట్రక్టివ్ స్లీప్ అప్నియా తీరు. నిద్రలో గొంతు వదులై గాలి ప్రవాహం మళ్లీ మళ్లీ ఆగిపోతుంది.",
      "If it's easier, I can ask the Yashoda team to call you — they can usually reach you quickly. Tap \"Ask Yashoda to call me\" below and give me your name and number, and I'll pass it straight to them. Nothing else from our conversation goes with it.":
        "మీకు సులభమైతే, యశోద బృందాన్ని మీకు కాల్ చేయమని నేను అడగగలను — వారు సాధారణంగా త్వరగా సంప్రదిస్తారు. కింద \"నాకు కాల్ చేయమని యశోదను అడగండి\" నొక్కి, మీ పేరు, ఫోన్ నంబర్ ఇవ్వండి — నేను నేరుగా వారికి అందిస్తాను. మన సంభాషణలోని మరేదీ దానితో వెళ్లదు.",
      "Wheezing is common in young children, and many who wheeze with colds grow out of it. That said, a child who wheezes repeatedly, coughs at night, or gets breathless with play deserves a proper assessment rather than repeated courses of cough syrup.":
        "చిన్న పిల్లల్లో పిల్లికూత సాధారణం, జలుబుతో పిల్లికూత వచ్చే చాలామందికి పెద్దయ్యాక తగ్గిపోతుంది. అయితే మళ్లీ మళ్లీ పిల్లికూత వచ్చే, రాత్రి దగ్గే, ఆడుకునేటప్పుడు ఊపిరి ఆడని పిల్లలకు దగ్గు సిరప్‌లు మళ్లీ మళ్లీ ఇవ్వకుండా సరైన పరీక్ష చేయించాలి.",
      "An inhaler only works if the medicine reaches the small airways, and technique decides whether it does. The commonest problems are breathing in too fast with a metered-dose inhaler, not holding the breath afterwards, and not using a spacer when one would help.":
        "మందు చిన్న శ్వాసనాళాలకు చేరితేనే ఇన్‌హేలర్ పనిచేస్తుంది, అది జరుగుతుందా లేదా అనేది వాడే పద్ధతి నిర్ణయిస్తుంది. సాధారణ తప్పులు: మీటర్డ్-డోస్ ఇన్‌హేలర్‌తో చాలా వేగంగా ఊపిరి పీల్చడం, తరువాత ఊపిరి బిగపట్టకపోవడం, స్పేసర్ ఉపయోగపడేచోట దానిని వాడకపోవడం.",
      "Most persistent coughs are not cancer. But a few features move a cough from \"watch it\" to \"check it now\": coughing up blood, weight loss without trying, a cough that has changed in someone who smokes or used to, or a hoarse voice that lasts beyond three weeks.":
        "చాలా నిరంతర దగ్గులు క్యాన్సర్ కాదు. కానీ కొన్ని లక్షణాలు దగ్గును \"గమనించండి\" నుండి \"ఇప్పుడే పరీక్షించండి\" స్థాయికి మారుస్తాయి: దగ్గులో రక్తం, ప్రయత్నించకుండా బరువు తగ్గడం, పొగ తాగే లేదా గతంలో తాగిన వ్యక్తిలో దగ్గు మారడం, లేదా మూడు వారాలకు మించి ఉన్న గొంతు బొంగురు.",
      "A fever with a cough, phlegm and breathlessness can mean an infection has reached the lung. That combination is worth being seen for promptly rather than waiting it out, particularly for anyone older, pregnant, or living with a long-term lung or heart condition.":
        "జ్వరంతో పాటు దగ్గు, కఫం, ఊపిరి ఇబ్బంది ఉంటే ఇన్ఫెక్షన్ ఊపిరితిత్తులకు చేరిందని అర్థం కావచ్చు. ఈ కలయికను ఎదురుచూడకుండా వెంటనే చూపించుకోవడం మంచిది — ముఖ్యంగా వృద్ధులు, గర్భిణులు, లేదా దీర్ఘకాలిక ఊపిరితిత్తుల, గుండె సమస్య ఉన్నవారు.",
      "I'm really glad you told me, and I don't want you to be alone with this. I'm not the right kind of help for it — please talk to someone now: Tele-MANAS on 14416 is free, 24 hours, and staffed by people trained for exactly this. If you are in immediate danger, call 112.":
        "మీరు నాకు చెప్పినందుకు నిజంగా సంతోషం, ఈ విషయంలో మిమ్మల్ని ఒంటరిగా వదిలేయాలని నేను అనుకోవడం లేదు. దీనికి సరైన సహాయం నేను కాదు — దయచేసి ఇప్పుడే ఎవరితోనైనా మాట్లాడండి: టెలి-మానస్ 14416 ఉచితం, 24 గంటలూ అందుబాటులో ఉంటుంది, ఇలాంటి వాటికే శిక్షణ పొందినవారు ఉంటారు. మీకు తక్షణ ప్రమాదం ఉంటే 112కి కాల్ చేయండి.",
      "Interstitial lung disease is a group of conditions in which the tissue between the air sacs becomes inflamed or scarred, making the lungs stiffer and less able to move oxygen across. The usual story is breathlessness building over months and a dry cough that will not go.":
        "ఇంటర్‌స్టీషియల్ లంగ్ డిసీజ్ అంటే గాలి తిత్తుల మధ్య కణజాలం వాపు లేదా మచ్చలకు గురయ్యే వ్యాధుల సముదాయం — దీనివల్ల ఊపిరితిత్తులు గట్టిపడి ఆక్సిజన్‌ను తరలించే శక్తి తగ్గుతుంది. సాధారణ తీరు: నెలల తరబడి పెరిగే ఊపిరి ఇబ్బంది, తగ్గని పొడి దగ్గు.",
      "Stopping smoking is the single change with the largest effect on lung health, at any age and after any number of years. Carbon monoxide clears from the blood within a day, the airways start to relax within a few days, and lung function measurably improves over the following months.":
        "పొగ మానేయడమే ఊపిరితిత్తుల ఆరోగ్యంపై అత్యధిక ప్రభావం చూపే ఒకే ఒక మార్పు — ఏ వయసులోనైనా, ఎన్ని సంవత్సరాల తరువాతైనా. కార్బన్ మోనాక్సైడ్ ఒక్క రోజులో రక్తం నుండి తొలగిపోతుంది, కొన్ని రోజుల్లో శ్వాసనాళాలు వదులవడం మొదలవుతుంది, తరువాతి నెలల్లో ఊపిరితిత్తుల పనితీరు స్పష్టంగా మెరుగవుతుంది.",
      "A persistent cough has several common causes: asthma, post-nasal drip from allergies, acid reflux, a lingering infection, the after-effects of smoking, and in some cases tuberculosis, which is still common in India. Less often it points to something in the lung that needs finding early.":
        "నిరంతర దగ్గుకు అనేక సాధారణ కారణాలు ఉన్నాయి: ఆస్తమా, అలర్జీల వల్ల ముక్కు నుండి గొంతులోకి కారడం, ఆమ్ల రిఫ్లక్స్, తగ్గని ఇన్ఫెక్షన్, పొగ అలవాటు ప్రభావాలు, కొన్ని సందర్భాల్లో క్షయ (టీబీ) — ఇది భారతదేశంలో ఇప్పటికీ సాధారణం. అరుదుగా ఇది ఊపిరితిత్తులలో ముందుగా కనుగొనవలసిన దానిని సూచిస్తుంది.",
      "The two questions that matter most are when it happens and how fast it changed. Breathlessness that only comes on when you climb stairs or walk uphill, and has crept up over months, points in a different direction from breathlessness that arrived suddenly or happens while you are sitting still.":
        "అత్యంత ముఖ్యమైన రెండు ప్రశ్నలు — ఇది ఎప్పుడు వస్తుంది, ఎంత వేగంగా మారింది. మెట్లు ఎక్కినప్పుడు లేదా ఎత్తుకు నడిచినప్పుడు మాత్రమే వచ్చి, నెలల తరబడి నెమ్మదిగా పెరిగిన ఊపిరి ఇబ్బంది — అకస్మాత్తుగా వచ్చిన లేదా కూర్చున్నప్పుడే వచ్చే ఊపిరి ఇబ్బంది కంటే వేరే దిశను సూచిస్తుంది.",
      "Well-controlled asthma should mean almost no daytime symptoms, no waking at night because of it, and rarely needing a reliever inhaler. Needing the reliever several times a week is the clearest sign the treatment needs revisiting — it is not a sign of failure, and it usually has a straightforward fix.":
        "బాగా నియంత్రణలో ఉన్న ఆస్తమా అంటే — పగటిపూట దాదాపు లక్షణాలు ఉండవు, రాత్రి దానివల్ల మెలకువ రాదు, రిలీవర్ ఇన్‌హేలర్ అరుదుగా మాత్రమే అవసరమవుతుంది. వారానికి చాలాసార్లు రిలీవర్ అవసరమవడం అంటే చికిత్సను మళ్లీ చూడాల్సి ఉందని స్పష్టమైన సూచన — ఇది వైఫల్యం కాదు, దీనికి సాధారణంగా సులభమైన పరిష్కారం ఉంటుంది.",

    {
      id: "inhaler-technique", t: "Using your inhaler correctly: the mistakes we see every week",
      topic: "asthma", cat: "Patient Guides", read: "5 min",
      lead: "Most people who are still symptomatic on treatment are not on the wrong drug. They are getting less of the right one than the label says.",
      body: [
        { h: "Why technique decides whether the medicine works", p: ["An inhaler only helps if the drug reaches the small airways. Studies of real patients consistently find that a large proportion make at least one error that materially reduces the delivered dose — and the person almost never knows. From the outside, a badly used inhaler and a well used one look identical.", "This is why a review of technique comes before any step up in treatment. Escalating the dose of a medicine that is landing on the back of the throat does not fix the problem; it just adds side effects."] },
        { h: "The errors that matter most", p: ["Not every mistake changes the dose. These are the ones that do:"], list: ["Not breathing out fully first. There is no room for the dose if the lungs are already full.", "Firing the canister before the breath in has started, or after it has finished. With a pressurised inhaler, press and breathe must begin together.", "Breathing in fast and sharp from a pressurised inhaler. It needs a slow, deep breath — about four to five seconds. A dry-powder device is the opposite: it needs a quick, forceful one.", "Not holding the breath afterwards. Ten seconds, or as long as is comfortable, lets the particles settle instead of being breathed straight back out.", "Sealing the lips poorly, so the dose escapes at the corners of the mouth.", "Not shaking a pressurised inhaler that needs shaking, and not priming a new or long-unused device."] },
        { h: "Use a spacer with a pressurised inhaler", p: ["A spacer slows the aerosol down and lets the propellant evaporate, so more drug reaches the lungs and less hits the throat. It also removes the hardest part of the technique — the need to co-ordinate the press with the breath.", "Guidelines recommend a spacer for pressurised metered-dose inhalers generally, and it is essential for children, for older people, and for anyone during an attack. Breathe in and out through the spacer five times after each puff, and give one puff at a time."] },
        { h: "Rinse your mouth after a steroid inhaler", p: ["Rinse and spit after any inhaler containing a corticosteroid. This is what prevents oral thrush and hoarseness, the two side effects that most often make people quietly stop their controller."] },
        { h: "Bring the device to your appointment", p: ["Bring every inhaler you use — not the box, the actual device — to each review. A technique check takes two minutes and is the single highest-value thing that happens in many asthma and COPD appointments.", "If your inhaler has no dose counter, ask how to tell when it is empty. An empty inhaler still sprays, still tastes the same, and contains no medicine."] }
      ],
      src: ["GINA 2024 Global Strategy for Asthma Management and Prevention — inhaler skills and adherence", "GOLD 2024 Global Strategy for the Diagnosis, Management and Prevention of COPD — inhaler technique", "NICE NG80 Asthma: diagnosis, monitoring and chronic asthma management"]

    {
      id: "reading-your-spirometry", t: "Understanding your spirometry report",
      topic: "pulmonary-function-testing", cat: "Patient Guides", read: "6 min",
      lead: "Four numbers do most of the work. Once you know what they mean, the report stops being a page of decimals.",
      body: [
        { h: "What the test measures", p: ["Spirometry asks you to take the deepest breath you can and blow it out as hard and as long as you can. It measures how much air you can move and how fast you can move it. It does not measure oxygen levels, and it does not image the lungs."] },
        { h: "The four numbers", p: [], list: ["FVC — forced vital capacity. The total volume you blew out. A low FVC suggests the lungs are not expanding fully.", "FEV1 — the volume in the first second. This is the headline number for how obstructed the airways are.", "FEV1/FVC — the ratio. This is what separates the two main patterns. A ratio below 0.70 after a bronchodilator is the usual threshold for fixed airflow obstruction.", "Per cent predicted — your value compared with people of the same age, height, sex and ethnicity. This is why the same litres mean different things in different people."] },
        { h: "Obstruction and restriction", p: ["An obstructive pattern — a reduced ratio — means air is leaving slowly. Asthma and COPD are the common causes. A restrictive pattern — a preserved or high ratio with a reduced FVC — means the lungs are not filling fully, which points towards the lung tissue, the chest wall, or the muscles rather than the airways.", "Spirometry can suggest restriction but cannot confirm it. That needs full lung volumes, which are measured separately."] },
        { h: "Reversibility", p: ["If the test is repeated after a bronchodilator and the FEV1 improves substantially, the obstruction is at least partly reversible — which supports asthma. Airflow limitation that persists after a bronchodilator is what defines COPD.", "A single normal spirometry does not exclude asthma. Asthma is variable by nature, and it is entirely possible to test normal on a good day."] },
        { h: "Gas transfer, if it was done", p: ["DLCO or TLCO measures how well gas crosses from the air sacs into the blood. It is often the first number to fall in emphysema and in interstitial lung disease, and it can be abnormal when the spirometry still looks acceptable."] },
        { h: "Two cautions", p: ["A test is only as good as the effort. A report will usually say whether the blows met quality standards; if they did not, the numbers mean less than they appear to.", "And a number is not a diagnosis. Spirometry is interpreted alongside your history, your examination and your imaging — never on its own."] }
      ],
      src: ["ATS/ERS 2019 Standardization of Spirometry", "ERS/ATS 2021 Technical standard on interpretive strategies for routine lung function tests", "GOLD 2024 — spirometric criteria for airflow limitation"]
    },
    {
      id: "a-nodule-was-found", t: "A lung nodule was found. What happens next?",
      topic: "lung-nodules", cat: "Patient Guides", read: "7 min",
      lead: "Most lung nodules are not cancer. The purpose of what follows is to answer the question quickly rather than to leave you worrying slowly.",
      body: [
        { h: "What a nodule is", p: ["A pulmonary nodule is a small rounded spot in the lung, usually under 30 mm, seen on a CT or an X-ray. They are common. Scans done for other reasons — a chest infection, an injury, a pre-employment check — find them all the time.", "Most turn out to be old scars, healed infection, or small collections of inflammatory tissue. In a country with a high background of tuberculosis, healed granulomas are a particularly common explanation."] },
        { h: "What the team is weighing up", p: ["The plan depends on the nodule and on you:"], list: ["Size. Under about 6 mm, the risk is very low. Risk rises with diameter.", "Appearance. Smooth and solid behaves differently from spiculated or part-solid. Certain patterns of calcification and fat are effectively diagnostic of a benign cause.", "Growth. A nodule stable over two years of imaging is reassuring; one that grows needs action.", "Your risk. Age, smoking history, occupational exposure, previous cancer and a family history all shift the assessment."] },
        { h: "The three possible plans", p: ["Almost every nodule leads to one of three routes."], list: ["No further imaging, when the nodule is very small or has clearly benign features.", "Interval CT surveillance, repeating the scan at defined intervals to see whether anything changes. This is the commonest plan, and being placed on it is generally a good sign.", "Further tests now — a PET-CT, or a biopsy — when the nodule is large enough, growing, or looks suspicious."] },
        { h: "How a sample is taken, if one is needed", p: ["Where the nodule sits decides the route. A nodule near the chest wall is usually reached with a CT-guided needle through the skin. One nearer the centre is often reached through the airways at bronchoscopy, sometimes with endobronchial ultrasound or navigation. Both are day procedures."] },
        { h: "Why the follow-up scan matters", p: ["The single most useful thing you can do is attend the follow-up scan on time. Surveillance only works if the interval is kept — a scan deferred by a year turns a plan into a gap.", "Bring any previous imaging you have, from any hospital. An old scan showing the same nodule unchanged can end the process immediately."] },
        { h: "When to come back sooner", p: ["Do not wait for a scheduled scan if you cough up blood, lose weight without trying, develop chest pain that does not settle, or become newly breathless."] }
      ],
      src: ["Fleischner Society 2017 Guidelines for Management of Incidental Pulmonary Nodules Detected on CT Images", "British Thoracic Society Guidelines for the Investigation and Management of Pulmonary Nodules", "NICE NG12 Suspected cancer: recognition and referral"]
    },
    {
      id: "antifibrotics-in-pf-ild", t: "Antifibrotics in progressive fibrosing ILD: practical prescribing",
      topic: "pulmonary-fibrosis", cat: "Expert Insights", read: "9 min",
      lead: "The evidence moved from one disease to one behaviour. What follows is the practical consequence at the bedside.",
      body: [
        { h: "The shift that matters", p: ["Antifibrotic therapy began as an IPF story. It no longer is. Trial evidence established that a progressive fibrosing phenotype — regardless of the underlying ILD diagnosis — responds to antifibrotic therapy with a slowing of FVC decline.", "The practical consequence is that the question at review is no longer only \"which ILD is this?\" but also \"is this one behaving progressively?\" Both answers change management."] },
        { h: "Defining progression at the bedside", p: ["Progression is judged over roughly a year on a combination of physiology, symptoms and imaging — a relative fall in FVC, worsening breathlessness or cough, and increasing fibrosis on HRCT. No single element is sufficient on its own, which is why serial measurement matters more than any one reading.", "This makes the follow-up schedule part of the treatment. A patient seen once a year with no interval lung function cannot be assessed for progression at all."] },
        { h: "Choosing, and what to warn about", p: ["Both licensed agents slow decline rather than reverse scarring, and the conversation at initiation should say so plainly. Expectations set as \"this will improve my breathing\" lead to early discontinuation when they are not met.", "Tolerability drives real-world persistence far more than efficacy does. Gastrointestinal effects and, with one agent, photosensitivity are the usual reasons people stop. Dose reduction and interruption are legitimate strategies and are preferable to abandonment."], list: ["Baseline and scheduled liver function testing is required with both agents.", "Diarrhoea is managed proactively rather than reactively — anti-motility agents, dose reduction, then interruption.", "Nausea is reduced by taking the drug with food and by splitting the dose.", "Counsel on sun protection where photosensitivity is a known effect.", "Review interacting drugs, including anticoagulants and strong enzyme inducers and inhibitors."] },
        { h: "What antifibrotics do not replace", p: ["Treating the fibrosis does not remove the rest of the plan. Where an inflammatory or autoimmune driver is present, immunosuppression may still be indicated — and in some ILDs it is the primary treatment. Antifibrotics sit alongside that decision, not instead of it."], list: ["Oxygen assessment, including on exertion, where saturations fall.", "Pulmonary rehabilitation, which improves function and quality of life across fibrotic ILD.", "Vaccination and prompt treatment of infection.", "Screening for pulmonary hypertension and for reflux where clinically indicated.", "Early, parallel discussion of transplantation in suitable candidates."] },
        { h: "The referral point most often missed", p: ["Transplant referral is repeatedly made too late rather than too early. Referral is a conversation and an assessment, not a commitment, and a patient assessed early keeps options that a patient assessed at crisis does not."] }
      ],
      src: ["ATS/ERS/JRS/ALAT 2022 Clinical Practice Guideline: Idiopathic Pulmonary Fibrosis (an Update) and Progressive Pulmonary Fibrosis in Adults", "NICE NG115 and TA504/TA379 — antifibrotic therapy", "ISHLT Consensus Document for the Selection of Lung Transplant Candidates (2021)"]
    },
    {
      id: "breathless-not-the-lungs", t: "When breathlessness is not the lungs",
      topic: "pulmonary-hypertension", cat: "Expert Insights", read: "8 min",
      lead: "A normal chest X-ray and near-normal spirometry in a breathless patient is not reassurance. It is a prompt to widen the differential.",
      body: [
        { h: "The trap", p: ["Exertional breathlessness with unremarkable initial tests is one of the commonest reasons a serious diagnosis is delayed. The instinct is to reassure; the correct move is to keep going, because several of the conditions that present exactly this way are treatable and time-sensitive."] },
        { h: "What is worth excluding, and how", p: [], list: ["Pulmonary hypertension. Often normal on X-ray and spirometry, with an isolated reduction in gas transfer as the only early clue. Echocardiography is the screening test; right heart catheterisation confirms.", "Chronic thromboembolic disease. A history of venous thromboembolism may be absent. A V/Q scan, not a CT pulmonary angiogram, is the appropriate screening investigation — and this is a potentially curable cause.", "Heart failure with preserved ejection fraction. Common, easily missed, and not excluded by a normal ejection fraction on a resting scan.", "Anaemia and thyroid disease. Cheap to exclude and regularly forgotten.", "Deconditioning and obesity, which are diagnoses of exclusion rather than first assumptions.", "Dysfunctional breathing, which frequently coexists with organic disease rather than replacing it."] },
        { h: "The two numbers that redirect the work-up", p: ["Gas transfer and exercise oxygen saturation do more than anything else to separate these groups. An isolated low DLCO with preserved spirometry points hard towards the pulmonary vasculature or early interstitial disease. Desaturation on a walk test that was invisible at rest changes both urgency and direction."] },
        { h: "Where CPET earns its place", p: ["When resting tests are normal and the symptom is exertional, the test that reproduces the symptom is the one that explains it. Cardiopulmonary exercise testing measures ventilation, gas exchange and cardiac response under load simultaneously, and it separates a cardiac limit from a ventilatory limit from a peripheral one.", "It is also the honest answer to the patient who has been told repeatedly that everything is normal while they cannot climb a flight of stairs."] },
        { h: "Practical rule", p: ["If breathlessness is progressive and the initial tests are normal, the correct next step is another test, not reassurance and discharge."] }
      ],
      src: ["2022 ESC/ERS Guidelines for the diagnosis and treatment of pulmonary hypertension", "ERS/ATS 2021 Technical standard on interpretive strategies for routine lung function tests", "ERS Statement on standardisation of cardiopulmonary exercise testing in chronic lung disease"]
    },
    {
      id: "pulmonary-rehabilitation", t: "Pulmonary rehabilitation: what it is and who it helps",
      topic: "copd", cat: "Articles", read: "6 min",
      lead: "It is a supervised exercise and education programme, and across chronic lung disease it produces larger gains in breathlessness and quality of life than most drugs do.",
      body: [
        { h: "What actually happens", p: ["A programme typically runs twice a week for six to twelve weeks. Each session combines supervised aerobic and resistance exercise with education — on breathing techniques, on inhalers, on pacing, on nutrition, on what to do when symptoms flare, and on managing the anxiety that breathlessness produces.", "The exercise is prescribed and progressed individually. Nobody is asked to do more than they can, and the starting point can be very low."] },
        { h: "Why it works when the lungs have not changed", p: ["Rehabilitation does not improve spirometry, and it is not meant to. It works on everything around the lungs — the leg muscles that fatigue early, the deconditioning that follows months of avoiding exertion, the breathing pattern, and the fear that makes people stop before they need to.", "That is why someone whose FEV1 is unchanged can finish a programme walking substantially further and feeling markedly less breathless."] },
        { h: "Who should be referred", p: [], list: ["Anyone with COPD who is breathless on everyday activity — a formal grade of 2 or more on the mMRC scale is the usual threshold.", "After a hospital admission for an exacerbation, where early rehabilitation reduces readmission.", "Fibrotic interstitial lung disease, bronchiectasis and pulmonary hypertension, where benefit is also established.", "Before and after lung surgery or transplantation, as prehabilitation and recovery.", "Persistent breathlessness after a severe respiratory infection."] },
        { h: "The honest caveats", p: ["The gains fade if the exercise stops. The programme is the start of a habit, not a course of treatment that finishes — a maintenance plan should be agreed before discharge.", "And uptake is the weak point everywhere. The commonest reason a patient does not benefit is that they never started: travel, timing and cost matter more than motivation. Ask about those directly when referring."] }
      ],
      src: ["ATS/ERS Statement on Pulmonary Rehabilitation", "GOLD 2024 — pulmonary rehabilitation", "NICE NG115 Chronic obstructive pulmonary disease in over 16s"]

    {
      id: "silica-exposure", t: "Silica exposure in stone and construction work",
      topic: "occupational-lung-disease", cat: "Articles", read: "7 min",
      lead: "Silicosis is entirely preventable, entirely irreversible, and still occurring — including in young workers after short, intense exposures.",
      body: [
        { h: "Where the dust comes from", p: ["Crystalline silica is released whenever material containing quartz is cut, ground, drilled or polished dry. That covers stone cutting and polishing, engineered and artificial stone work, granite and sandstone quarrying, construction and demolition, tunnelling, foundry work, sandblasting, and ceramics.", "The dangerous fraction is respirable — small enough to reach the air sacs and invisible in ordinary light. A workplace can look clean and still be hazardous."] },
        { h: "What it does", p: ["Inhaled silica causes progressive scarring of the lung. Classical silicosis develops over years, but accelerated and acute forms occur after heavy exposure over months — and artificial stone work has produced severe disease in workers in their twenties and thirties.", "Silica exposure also raises the risk of tuberculosis substantially, and is classified as a lung carcinogen. It is associated with COPD, kidney disease and autoimmune disease."] },
        { h: "Why it is missed", p: ["Early silicosis is silent. By the time breathlessness and cough appear, the scarring is established and cannot be reversed. There is no treatment that removes it — which is precisely why detection has to happen through surveillance rather than through symptoms.", "It is also mistaken for tuberculosis, which delays both diagnoses, and the two genuinely coexist often enough that finding one is a reason to look for the other."] },
        { h: "What actually prevents it", p: ["Control at source is the only intervention that works reliably. Respirators are the last line, not the first."], list: ["Wet cutting and wet polishing rather than dry.", "Local exhaust ventilation and on-tool dust extraction.", "Enclosure and isolation of the dustiest processes.", "Substitution of high-silica materials where possible.", "Properly fitted respiratory protection, fit-tested, where controls cannot fully remove exposure.", "Not taking dust home: changing facilities, and no laundering of work clothes with household washing."] },
        { h: "For workers and employers", p: ["Any exposed worker with a cough, breathlessness or weight loss should be assessed — and should say what they do for a living, unprompted, because the occupational history is the piece most often missing from the notes.", "Where one worker is diagnosed, the others doing the same job need screening. Occupational lung disease is rarely an individual finding."] }
      ],
      src: ["WHO/ILO Global Programme for the Elimination of Silicosis", "ATS Statement: Occupational Contribution to the Burden of Airway Disease", "IARC Monographs — crystalline silica, Group 1 carcinogen", "WHO Guidelines on tuberculosis screening in silica-exposed workers"]
    },
    {
      id: "sleep-apnoea-and-the-heart", t: "Sleep apnoea and the heart",
      topic: "sleep-medicine", cat: "Articles", read: "5 min",
      lead: "Untreated obstructive sleep apnoea is a cardiovascular condition that happens to present at night.",
      body: [
        { h: "What happens during an apnoea", p: ["The upper airway collapses repeatedly during sleep. Each time, oxygen falls, carbon dioxide rises, and the body produces a surge of sympathetic activity to reopen the airway. Blood pressure and heart rate spike, and sleep fragments — often hundreds of times a night, without the person waking properly or remembering any of it."] },
        { h: "The cardiovascular consequences", p: ["Repeated overnight, that cycle has measurable daytime effects."], list: ["Hypertension, particularly blood pressure that resists three or more drugs, and pressure that fails to dip overnight.", "Atrial fibrillation, with a markedly higher recurrence rate after cardioversion or ablation when the apnoea is untreated.", "Heart failure, where sleep-disordered breathing is common and independently associated with worse outcomes.", "Coronary disease and stroke risk.", "Poorer glycaemic control in type 2 diabetes."] },
        { h: "Who should be tested", p: [], list: ["Loud habitual snoring with witnessed pauses in breathing.", "Waking unrefreshed, morning headache, or daytime sleepiness.", "Resistant hypertension, or non-dipping blood pressure.", "Atrial fibrillation, especially before a rhythm-control procedure.", "Before surgery requiring general anaesthesia, where undiagnosed apnoea raises perioperative risk."] },
        { h: "What treatment changes", p: ["CPAP reliably abolishes the events, improves sleepiness and quality of life, and lowers blood pressure — the reduction being largest in resistant hypertension and in those who use it consistently. Adherence is the whole game: a machine used four hours a night is a treatment, and one left in the cupboard is not.", "Weight loss, positional therapy and mandibular advancement devices have defined roles, and surgery is appropriate in selected anatomy. The choice depends on severity and on what a person will actually use."] },
        { h: "One practical point", p: ["Sleepiness at the wheel is the most immediately dangerous symptom and the least often volunteered. Ask about it directly, and advise accordingly until treatment is established."] }
      ],
      src: ["American Academy of Sleep Medicine Clinical Practice Guideline for Diagnostic Testing for Adult OSA", "AASM Clinical Practice Guideline: Treatment of OSA with Positive Airway Pressure", "2021 ESC Guidelines and AHA Scientific Statement on OSA and cardiovascular disease"]
