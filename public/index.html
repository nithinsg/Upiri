    {
      id: "quitting-what-works", t: "Quitting: what actually works",
      topic: "smoking-cessation", cat: "Patient Guides", read: "6 min",
      lead: "Willpower alone has the lowest success rate of any method. Combining medication with support multiplies the odds several times over.",
      body: [
        { h: "Why stopping is hard, and why that is not a character flaw", p: ["Nicotine dependence is a physical dependence with a defined withdrawal syndrome — irritability, poor concentration, restlessness, low mood, disturbed sleep and intense craving. Most of it peaks within the first week and settles substantially by four weeks.", "Understanding that the worst is time-limited, and treatable, is what gets people through the period where most attempts fail."] },
        { h: "What the evidence supports", p: ["Three things independently raise the chance of success, and they stack:"], list: ["Medication. Nicotine replacement works best as a combination — a patch for background craving plus a fast-acting form (gum, lozenge, spray, inhalator) for breakthrough. Prescription options including varenicline and bupropion are more effective again where suitable.", "Behavioural support. Structured support, in person or by telephone, roughly doubles the effect of medication alone.", "A quit date. A defined day, prepared for, outperforms open-ended intention."] },
        { h: "The practical plan", p: [], list: ["Set a date within two weeks, and tell the people around you.", "Start medication as advised — some are begun before the quit date.", "Remove cigarettes, lighters and ashtrays from home, car and workplace the night before.", "Identify your three highest-risk moments — after a meal, with tea or alcohol, with particular company — and decide in advance what you will do instead.", "Expect craving to come in waves of a few minutes. It passes whether or not you smoke.", "Treat a lapse as information, not as failure. Most people who succeed have made several attempts."] },
        { h: "What changes, and how quickly", p: ["Carbon monoxide levels normalise within a day. Circulation and lung function begin improving within weeks to months. The excess risk of heart disease falls steeply in the first year, and the risk of lung cancer declines steadily over the years that follow.", "Quitting improves outcomes at every age and at every stage of disease — including after a diagnosis of COPD, and including after a diagnosis of lung cancer, where it improves treatment tolerance and survival."] },
        { h: "For beedis, and for smokeless tobacco", p: ["Beedis deliver comparable or higher carbon monoxide and tar despite their size, and carry the same risks. Smokeless and chewed tobacco is not a safe substitute; it carries its own oral, oesophageal and cardiovascular risk. Both merit the same structured support."] }
      ],
      src: ["WHO Framework Convention on Tobacco Control and WHO tobacco cessation guidelines", "NICE NG209 Tobacco: preventing uptake, promoting quitting and treating dependence", "US Public Health Service Clinical Practice Guideline: Treating Tobacco Use and Dependence", "Cochrane Reviews on combination nicotine replacement therapy and behavioural support"]
    },
    {
      id: "biologics-in-severe-asthma", t: "Biologics in severe asthma: who qualifies",
      topic: "severe-asthma", cat: "Expert Insights", read: "10 min",
      lead: "Before phenotyping anyone for a biologic, establish that the asthma is severe rather than merely uncontrolled. Most referrals fail at that first step.",
      body: [
        { h: "Difficult-to-treat is not severe", p: ["Severe asthma means asthma that remains uncontrolled despite optimised high-dose inhaled corticosteroid plus a second controller, taken correctly and consistently, with comorbidity addressed — or that deteriorates when that treatment is reduced.", "The majority of patients arriving at a severe asthma clinic do not meet that definition on arrival. They have inhaler technique errors, poor adherence, ongoing exposure, or an untreated comorbidity. Prescribing a biologic over any of those is expensive, ineffective and delays the actual fix."] },
        { h: "The checklist that must come first", p: [], list: ["Confirm the diagnosis objectively. Not all wheeze is asthma; vocal cord dysfunction, bronchiectasis, COPD and cardiac disease all masquerade.", "Observe inhaler technique with the patient’s own device, at every visit.", "Assess adherence with prescription refill data rather than by asking. Reported adherence and actual adherence differ substantially.", "Treat comorbidity: allergic and non-allergic rhinitis, nasal polyposis, reflux, obesity, obstructive sleep apnoea, anxiety and dysfunctional breathing.", "Remove ongoing exposure — smoking, occupational sensitisers, indoor allergen, biomass smoke.", "Review drugs that worsen asthma, including beta blockers and NSAIDs in susceptible patients."] },
        { h: "Phenotyping, once severity is established", p: ["The decision then rests on inflammatory phenotype, measured while the picture is still interpretable — some markers are suppressed by systemic corticosteroid, so timing matters."], list: ["Blood eosinophil count, on more than one occasion.", "Fractional exhaled nitric oxide where available.", "Total IgE with specific sensitisation to a perennial aeroallergen, for the allergic pathway.", "Exacerbation frequency and maintenance oral corticosteroid burden.", "Coexisting nasal polyposis, atopic dermatitis or eosinophilic comorbidity, which may make one agent preferable when several are options."] },
        { h: "Setting expectations", p: ["The realistic goals are fewer exacerbations, reduced or discontinued maintenance oral corticosteroid, and better symptom control and quality of life. Lung function gains are typically modest.", "Response is assessed formally — commonly at around four months, with a fuller review at a year — against criteria agreed before starting. Non-response is a reason to reassess the phenotype and the diagnosis, not simply to switch agents indefinitely."] },
        { h: "The point most worth making to patients", p: ["A biologic is an addition, not a replacement. Inhaled therapy continues, and the biggest risk after a good response is that it quietly stops."] }
      ],
      src: ["GINA 2024 — Difficult-to-treat and severe asthma in adolescent and adult patients", "ERS/ATS Guidelines on definition, evaluation and treatment of severe asthma", "NICE technology appraisals for biologic therapies in severe asthma"]
    },
    {
      id: "one-airway", t: "Allergic rhinitis and asthma: one airway",
      topic: "allergy", cat: "Articles", read: "5 min",
      lead: "The nose and the chest are a single continuous airway. Treating only the lower half is why some asthma stays stubborn.",
      body: [
        { h: "The united airway", p: ["The lining of the nose and the lining of the bronchi share structure, inflammatory cells and mediators. Allergic inflammation rarely respects the boundary: most people with asthma have rhinitis, and a substantial proportion of people with persistent rhinitis have asthma, sometimes undiagnosed.", "Clinically, this means untreated nasal disease is a common and correctable reason for asthma that will not settle."] },
        { h: "Why the nose affects the chest", p: [], list: ["A blocked nose forces mouth breathing, so air reaches the bronchi unfiltered, unwarmed and undehumidified.", "Post-nasal drip provokes cough and airway irritation.", "Shared systemic inflammation drives both sites at once.", "Disturbed sleep from nasal obstruction worsens daytime symptoms and control."] },
        { h: "What to treat, and in what order", p: ["Intranasal corticosteroid is the most effective single treatment for persistent allergic rhinitis and improves asthma symptoms alongside it. Antihistamines help sneeze, itch and rhinorrhoea more than they help blockage. Saline irrigation is cheap, safe and underused.", "Technique matters here too: the spray should be aimed away from the septum, using the opposite hand, without sniffing hard afterwards. Epistaxis and treatment failure usually trace back to aim."] },
        { h: "Allergen avoidance, realistically", p: ["Complete avoidance is rarely achievable. Reduction is, and it is worth targeting the exposures that actually matter for the individual rather than issuing a generic list."], list: ["House dust mite: mattress and pillow encasings, hot washing of bedding, reduced soft furnishing in the bedroom.", "Pollen: track the local season, keep windows shut at peak times, shower and change after long periods outdoors.", "Mould: address damp and leaks rather than treating the symptoms alone.", "Pets: honest discussion, since partial measures achieve little if the animal sleeps in the bedroom."] },
        { h: "When to consider immunotherapy", p: ["Where symptoms are driven by a confirmed, clinically relevant allergen and persist despite optimal medication, allergen immunotherapy can modify the disease rather than suppress it. It requires a confirmed sensitisation matching the clinical pattern, and a specialist assessment."] }
      ],
      src: ["ARIA 2019 — Allergic Rhinitis and its Impact on Asthma", "GINA 2024 — comorbidities in asthma", "EAACI Guidelines on Allergen Immunotherapy"]
    },
    {
      id: "staging-lung-cancer", t: "Staging lung cancer: why it decides everything",
      topic: "lung-cancer", cat: "Expert Insights", read: "9 min",
      lead: "Treatment intent, sequence and prognosis all follow from the stage. Getting it right is not administrative — it is the single highest-value step in the pathway.",
      body: [
        { h: "What staging answers", p: ["Staging describes the size and local extent of the tumour, whether lymph nodes are involved and which ones, and whether disease has spread beyond the chest. That determines whether the intent is cure or control, and whether the first treatment is surgery, radiotherapy, systemic therapy, or a combination.", "Two patients with an identical tumour on the scan can have entirely different treatment plans on the basis of a single involved node."] },
        { h: "Why the mediastinum is the crux", p: ["Nodal status is where staging most often changes the plan, and where imaging alone is least reliable. CT under-calls and over-calls. PET-CT is more accurate but still yields false positives — particularly in a population with a high background of granulomatous disease and healed tuberculosis, where an avid node may be entirely benign.", "That is the argument for tissue confirmation rather than radiological assumption: treating a patient as incurable on the strength of an inflammatory node is a serious and avoidable error, and so is operating on a patient with unrecognised nodal disease."] },
        { h: "How nodes are sampled", p: ["Endobronchial ultrasound with transbronchial needle aspiration is the usual first-line approach, reaching the paratracheal and hilar stations through the airway, with endoscopic ultrasound extending access to lower and posterior stations. Surgical mediastinoscopy remains available where results are discordant with the clinical picture.", "A negative needle result in a strongly suspicious node is a reason to go further, not to stop."] },
        { h: "Molecular and biomarker testing is part of staging now", p: ["For non-small-cell disease, the tissue must answer more than \"is it cancer\". Predictive biomarker testing determines eligibility for targeted and immune therapies, and increasingly influences treatment even in earlier-stage disease.", "The practical implication is at the moment of sampling: obtain enough tissue, and plan the biopsy route with the downstream testing in mind. Repeating a procedure because the sample was adequate for diagnosis but not for genotyping costs the patient weeks."] },
        { h: "The multidisciplinary meeting is not a formality", p: ["Staging synthesises radiology, pathology, molecular results, lung function and fitness. It is a multidisciplinary judgement, and outcomes are demonstrably better where that discussion actually happens rather than being recorded as having happened."] },
        { h: "What patients should be told", p: ["That the tests before treatment are what make the treatment right, and that a delay of a few days to obtain proper staging is almost always worth it. The commonest source of anxiety in this window is not knowing why nothing appears to be happening."] }
      ],
      src: ["IASLC 8th Edition TNM Classification for Lung Cancer", "NICE NG122 Lung cancer: diagnosis and management", "ESMO Clinical Practice Guidelines for non-small-cell lung cancer", "ACCP/ERS guidance on endosonographic mediastinal staging"]
    },
    {
      id: "what-happens-at-bronchoscopy", t: "What happens at a bronchoscopy, start to finish",
      topic: "bronchoscopy", cat: "Patient Guides", read: "6 min",
      lead: "It is a camera test of the airways, it usually takes fifteen to thirty minutes, and most people go home the same day.",
      body: [
        { h: "Before the day", p: ["You will be asked not to eat for several hours beforehand, with a shorter window for clear fluids. The exact timings come from the unit and should be followed precisely, because a stomach that is not empty is the commonest reason a procedure is postponed.", "Tell the team about blood thinners, diabetes medication, inhalers, allergies, loose teeth, and any previous reaction to sedation. Blood thinners often need adjusting in advance — never stop them on your own."] },
        { h: "In the room", p: ["A cannula goes into the back of your hand. Monitoring goes on your finger and chest. Local anaesthetic is sprayed or gargled to numb the throat and nose, which tastes bitter and makes the throat feel swollen — that feeling is expected and does not mean the airway is closing.", "Sedation is usually given so that you are drowsy and comfortable rather than fully asleep. The bronchoscope passes through the nose or mouth, past the vocal cords, into the windpipe and then the bronchi. It is thinner than the airway and does not block your breathing. Oxygen is given throughout."] },
        { h: "What may be done through the scope", p: [], list: ["A wash of the airway, to send for infection and cell studies.", "Brushings or small biopsies of the airway lining.", "Biopsies of lung tissue, sometimes with X-ray or ultrasound guidance.", "Endobronchial ultrasound to see and sample lymph nodes next to the airway.", "Removal of a mucus plug or a foreign body, or treatment of a narrowed airway."] },
        { h: "Afterwards", p: ["You rest in recovery until the sedation wears off. You must not eat or drink until the throat numbness has gone — usually one to two hours — because swallowing is not safe until sensation returns.", "A sore throat, a hoarse voice, a mild cough and small streaks of blood in the spit for a day or so are all common. So is feeling tired for the rest of the day."] },
        { h: "Going home", p: ["If you have had sedation you need a responsible adult to take you home, and you must not drive, operate machinery, sign anything legally binding or drink alcohol for 24 hours."] },
        { h: "When to seek help", p: ["Contact the hospital or attend an emergency department for more than a small amount of fresh blood, worsening breathlessness, chest pain, or a fever developing in the days afterwards."] }
      ],
      src: ["British Thoracic Society Guideline for Diagnostic Flexible Bronchoscopy in Adults", "BTS Guidelines for the management of patients on anticoagulants and antiplatelet agents undergoing endoscopic procedures"]
    },
    {
      id: "living-with-ild", t: "Living with interstitial lung disease",
      topic: "ild", cat: "Patient Guides", read: "7 min",
      lead: "ILD is a family of conditions, not one disease — and the name on your letter changes what happens next more than almost anything else.",
      body: [
        { h: "Why the exact diagnosis matters so much", p: ["Interstitial lung disease describes scarring or inflammation of the lung tissue itself rather than the airways. There are more than a hundred causes, and they are treated in opposite directions: some respond to suppressing the immune system, some are made worse by it, and some need antifibrotic therapy instead.", "That is why the work-up is detailed and can feel slow — a high-resolution CT, blood tests for autoimmune disease, a careful exposure history, and often a multidisciplinary discussion between a pulmonologist, a radiologist and a pathologist. Getting the pattern right is what makes the treatment right."] },
        { h: "The exposure history is part of the diagnosis", p: ["Be exhaustive, including things you would not think to mention:"], list: ["Birds at home or nearby — pigeons, poultry, feather bedding and pillows.", "Damp, mould, air conditioning and humidifiers.", "Work with dust, fumes, asbestos, silica, metals or organic material.", "Hobbies involving dust or animals.", "Every medicine you have taken, including those stopped long ago, and any radiotherapy.", "Joint pains, rashes, dry eyes and mouth, reflux, or cold and colour-changing fingers."] },
        { h: "What the follow-up numbers are for", p: ["Lung function is repeated at intervals not because a single reading is meaningful but because the trend is. The direction of travel over six to twelve months decides whether treatment is working and whether the disease is behaving progressively — which is itself a treatment decision.", "Attending those appointments even when you feel unchanged is genuinely part of the treatment."] },
        { h: "What helps day to day", p: [], list: ["Pulmonary rehabilitation, which improves walking distance and breathlessness in fibrotic ILD.", "Oxygen assessment if your saturations fall on exertion — the drop often happens while walking and is invisible sitting still.", "Vaccination, and early treatment of chest infection.", "Stopping smoking, which matters in every ILD.", "Treating reflux and sleep apnoea where present.", "Support for the cough, which is often the most wearing symptom and is worth raising specifically."] },
        { h: "Transplant is a conversation to have early", p: ["For those with progressive disease, referral for transplant assessment is easier and safer when made early. Referral is an assessment and a discussion — not a commitment — and being assessed early preserves options that late referral removes."] },
        { h: "When to seek help sooner", p: ["Get medical advice promptly for a sudden or rapid worsening of breathlessness over days, new fever or coloured sputum, or chest pain. Acute deterioration in ILD needs assessment rather than waiting for the next appointment."] }
      ],
      src: ["ATS/ERS/JRS/ALAT 2022 Clinical Practice Guideline on IPF and Progressive Pulmonary Fibrosis", "ATS/ERS 2020 Diagnosis of Hypersensitivity Pneumonitis in Adults", "ISHLT Consensus Document for the Selection of Lung Transplant Candidates (2021)"]
    },
    {
      id: "referring-for-lung-transplant", t: "Referring for lung transplantation: the timing error that costs most",
      topic: "lung-transplantation", cat: "Expert Insights", read: "8 min",
      lead: "The commonest mistake in transplant referral is not referring the wrong patient. It is referring the right patient too late.",
      body: [
        { h: "Referral and listing are different decisions", p: ["Referral starts an assessment. Listing commits a patient to the waiting list. Conflating the two is what produces late referral: clinicians wait until they believe the patient is ready to be listed, by which point the assessment itself — which takes time, and may identify correctable problems — has to be done against the clock.", "A referral that concludes \"not yet, review in six months\" is a successful referral, not a wasted one."] },
        { h: "When to pick up the phone", p: ["Referral is appropriate when disease is progressive despite optimal therapy and the trajectory suggests advanced disease within the next couple of years, rather than when the patient is already at the end of it. Concretely:"], list: ["Fibrotic ILD with declining lung function or gas transfer despite treatment, and any patient requiring supplemental oxygen.", "COPD with progressive decline, rising exacerbation frequency, hypercapnia, or pulmonary hypertension.", "Cystic fibrosis or bronchiectasis with falling lung function, frequent exacerbations or massive haemoptysis.", "Pulmonary arterial hypertension that remains in a higher risk category despite appropriate combination therapy.", "Any of these after an ICU admission for respiratory failure."] },
        { h: "What the assessment is actually looking for", p: ["Beyond the lungs: cardiac and renal function, nutritional state, bone health, infection and colonisation, malignancy history, psychological readiness, adherence, and the practical support available at home. Several of these are modifiable, which is the argument for finding them early."], list: ["Nutrition and body composition, in both directions.", "Deconditioning, which is treatable with rehabilitation and is not itself a contraindication.", "Smoking and substance use, where a documented period of abstinence is required.", "Adherence history, addressed honestly rather than assumed.", "A realistic caregiver plan, which is as decisive as any physiological measure."] },
        { h: "ECMO as a bridge", p: ["Extracorporeal support can bridge selected patients to transplantation when ventilation alone will not sustain them. Where a patient can be kept awake, mobile and participating in physiotherapy on support, muscle mass and respiratory function are better preserved, which matters for tolerating a long operation and for recovery afterwards.", "This is only possible where the patient is already known to a transplant service. It is another reason early referral is a clinical decision rather than an administrative one."] },
        { h: "What to tell the patient at referral", p: ["That referral is an assessment and a conversation; that it does not commit them to anything; and that being assessed early gives them more options, not fewer. Fear of the word is a major reason patients decline referral, and it is best addressed at the point of making it."] }
      ],
      src: ["ISHLT Consensus Document for the Selection of Lung Transplant Candidates: 2021 Update", "ATS/ERS/JRS/ALAT 2022 Guideline on IPF and Progressive Pulmonary Fibrosis", "2022 ESC/ERS Guidelines for the diagnosis and treatment of pulmonary hypertension"]
    },
    {
      id: "what-interventional-pulmonology-replaces", t: "What interventional pulmonology has replaced",
      topic: "interventional-pulmonology", cat: "Expert Insights", read: "7 min",
      lead: "A large amount of what once required an operation is now done through the airway, as a day case, with the patient home the same evening.",
      body: [
        { h: "The shift", p: ["Interventional pulmonology covers minimally invasive diagnosis and treatment of the airways, lungs and pleura. Its growth has changed the default answer to several questions that used to end in a surgical referral — mediastinal staging, tissue diagnosis of diffuse lung disease, management of pleural effusion, and relief of central airway obstruction.", "The gain is not only avoiding an operation. It is the reduction in time to diagnosis, which in cancer pathways translates directly into earlier treatment."] },
        { h: "Where it now leads", p: [], list: ["Mediastinal nodal staging: endobronchial and endoscopic ultrasound with needle aspiration, in place of routine surgical mediastinoscopy.", "Peripheral lung lesions: guided and navigational bronchoscopy, with radial ultrasound and increasingly with robotic platforms.", "Diffuse parenchymal disease: transbronchial cryobiopsy as an alternative to surgical lung biopsy in selected patients discussed at a multidisciplinary meeting.", "Pleural disease: medical thoracoscopy under local anaesthesia and sedation, with talc poudrage or an indwelling catheter for malignant effusion.", "Central airway obstruction: debulking, dilatation, stenting and ablative therapy, which can restore breathing within a single procedure.", "Severe emphysema: endobronchial valve placement for bronchoscopic lung volume reduction in carefully selected patients."] },
        { h: "Selection is the whole discipline", p: ["These procedures are safe in the right patient and not in the wrong one. Cryobiopsy carries meaningful bleeding and pneumothorax risk and belongs in centres with the equipment and the protocols to manage both. Valve placement depends on demonstrating absent collateral ventilation and on fissure integrity, and produces little benefit without it.", "The right question is rarely \"can this be done bronchoscopically\" but \"does this patient gain from it, and is the alternative genuinely worse\"."] },
        { h: "Why sedation and airway planning matter", p: ["A longer therapeutic procedure in a compromised airway is a shared airway problem. Planning the sedation strategy, the airway device and the escalation plan in advance is what keeps these procedures day cases rather than admissions."] },
        { h: "One diagnostic implication", p: ["Because tissue now increasingly has to support molecular testing as well as diagnosis, the choice of technique and the number of passes should be planned with that downstream requirement in mind, not decided at the end."] }
      ],
      src: ["ACCP/AABIP guidance on interventional pulmonary procedures", "ERS Statement on transbronchial lung cryobiopsy in diffuse parenchymal lung disease", "BTS Pleural Disease Guideline", "NICE guidance on endobronchial valve insertion for emphysema"]
    },
    {
      id: "when-a-chest-infection-is-not-settling", t: "When a chest infection is not settling",
      topic: "respiratory-infections", cat: "Patient Guides", read: "5 min",
      lead: "Most chest infections improve within a fortnight. The skill is recognising the ones that are not going to.",
      body: [
        { h: "The normal course", p: ["Fever and the worst of the malaise usually settle within about a week. The cough is the slowest symptom to go and can persist for three to six weeks after everything else has resolved — that alone is not a sign of failure.", "Feeling tired for several weeks after pneumonia is normal and expected."] },
        { h: "When to be seen again", p: [], list: ["You are getting worse rather than better after three days of treatment.", "Fever returns after settling, or persists beyond a week.", "Breathlessness is increasing, or you are breathless at rest.", "Chest pain is worsening, particularly if it is sharp and worse on breathing in.", "You are coughing up blood.", "You cannot keep fluids down, or you feel faint on standing."] },
        { h: "Symptoms that mean now, not tomorrow", p: ["Severe breathlessness, blue lips or fingertips, confusion or unusual drowsiness, or chest pain that does not settle. These need emergency assessment rather than a routine appointment."] },
        { h: "Why a cough lasting three weeks is investigated", p: ["A cough persisting beyond three weeks is the threshold at which further assessment is recommended, including consideration of tuberculosis. In India this matters particularly: TB is common, presents exactly like a chest infection that will not clear, and is entirely treatable once identified.", "Weight loss, night sweats, or blood in the sputum alongside a persistent cough make that assessment urgent."] },
        { h: "Who needs a repeat chest X-ray", p: ["A follow-up film around six weeks after pneumonia is usually advised for smokers, for those over fifty, and for anyone whose symptoms have not fully resolved — because a small proportion of apparent pneumonia is an underlying lesion presenting as infection."] },
        { h: "What helps, and what does not", p: ["Fluids, rest, simple analgesia and time. Antibiotics help bacterial infection and do nothing at all for a viral one, and taking them unnecessarily contributes to resistance. If antibiotics are prescribed, finish the course as directed."] }
      ],
      src: ["WHO and National TB Elimination Programme guidance on presumptive TB — cough of two weeks or more", "NICE NG138 Pneumonia (community-acquired): antimicrobial prescribing", "BTS Guidelines for the management of community acquired pneumonia in adults"]
    },
    {
      id: "copd-action-plan", t: "Your COPD flare-up plan: knowing the difference between a bad day and an exacerbation",
      topic: "copd", cat: "Patient Guides", read: "6 min",
      lead: "An exacerbation treated early is usually managed at home. The same exacerbation treated late is often managed in hospital.",
      body: [
        { h: "What an exacerbation is", p: ["A sustained worsening beyond your normal day-to-day variation, lasting more than a day or two, that needs a change in treatment. The three symptoms that matter are more breathlessness, more sputum, and a change in sputum colour.", "One bad afternoon after climbing stairs is not an exacerbation. Two days of needing your reliever far more than usual, with a change in your phlegm, is."] },
        { h: "Know your baseline", p: ["You cannot recognise a change without knowing the starting point. Be able to say how far you can normally walk on the flat, how many times a day you normally need your reliever, and what your sputum normally looks like. Write it down."] },
        { h: "What to do when it starts", p: [], list: ["Increase your reliever inhaler as your plan specifies, using a spacer.", "Start any rescue medication you have been given, exactly as instructed — not for every cough.", "Keep moving gently rather than going to bed entirely; complete rest worsens deconditioning quickly.", "Tell someone at home what is happening, so a deterioration is noticed.", "Contact your team on the same day if you have started rescue treatment, so it is recorded and reviewed."] },
        { h: "Go to hospital if", p: [], list: ["You are breathless at rest, or too breathless to speak in full sentences.", "Your lips or fingertips look blue.", "You are confused, unusually drowsy, or very agitated.", "You have chest pain.", "Your ankles are swelling rapidly.", "You are not improving 48 hours after starting rescue treatment."] },
        { h: "After a flare-up", p: ["Every exacerbation is an event worth reviewing, because each one is associated with a further loss of lung function and a higher chance of the next. Ask for a review of your inhalers and technique, your vaccination status, and referral to pulmonary rehabilitation — which is most effective in the weeks after an exacerbation.", "If you still smoke, this is the single change that alters the trajectory more than any medicine."] }
      ],
      src: ["GOLD 2024 Global Strategy for Prevention, Diagnosis and Management of COPD", "NICE NG115 Chronic obstructive pulmonary disease in over 16s: diagnosis and management"]
    },
    {
      id: "preparing-for-cpet", t: "Preparing for a cardiopulmonary exercise test",
      topic: "cpet", cat: "Patient Guides", read: "5 min",
      lead: "It is the test that reproduces your symptom on purpose — which is exactly why it explains what the resting tests could not.",
      body: [
        { h: "Why you have been sent", p: ["Resting tests look at the lungs and heart at rest. If your problem only appears when you exert yourself, a resting test can be entirely normal and still miss the cause.", "CPET measures breathing, gas exchange, heart rate and rhythm together while the workload rises steadily, so it can separate a limit coming from the lungs, from the heart, from the circulation, or from deconditioning."] },
        { h: "On the day", p: [], list: ["Wear comfortable clothes and proper shoes you can exercise in.", "Eat lightly a couple of hours before; avoid a heavy meal.", "Avoid caffeine, alcohol and vigorous exercise beforehand, as instructed by the unit.", "Do not smoke on the day of the test.", "Bring a list of your medicines and your inhalers. Ask in advance which, if any, to withhold — do not stop anything on your own."] },
        { h: "What the test involves", p: ["You cycle or walk on a treadmill while the resistance or speed increases gradually. You wear a mask or mouthpiece that measures the air you breathe in and out, ECG electrodes on the chest, a blood pressure cuff and a finger probe. Sometimes a small arterial or earlobe blood sample is taken.", "It usually lasts eight to twelve minutes of actual exercise, and the whole appointment takes about an hour."] },
        { h: "The most important instruction", p: ["Go as hard as you genuinely can, and stop when you need to. The test works because it takes you to your limit — a test stopped early out of caution gives an uninterpretable result. Staff monitor you continuously and will stop the test if they need to."] },
        { h: "Afterwards", p: ["You may feel tired, and your legs may ache the next day. There are no restrictions on driving or eating. The results are interpreted alongside your other tests and discussed at your next appointment rather than given at the bedside."] }
      ],
      src: ["ERS Statement on standardisation of cardiopulmonary exercise testing in chronic lung disease", "ATS/ACCP Statement on Cardiopulmonary Exercise Testing"]
    },
    {
      id: "asthma-in-children", t: "Asthma in children: what parents most often ask",
      topic: "asthma", cat: "Articles", read: "6 min",
      lead: "Well-controlled childhood asthma should not limit school, sport or sleep. If it is doing any of those, the treatment needs reviewing — not accepting.",
      body: [
        { h: "What good control looks like", p: ["A child with well-controlled asthma sleeps through the night without coughing, plays and runs like their friends, does not miss school for chest symptoms, and needs their reliever inhaler no more than a couple of times a week.", "Anything less than that is a reason for review. Children compensate by quietly avoiding exertion, so \"he is fine, he just does not like running\" is worth asking about specifically."] },
        { h: "Spacers are not optional", p: ["Children should use a pressurised inhaler with a spacer, with a mask for the youngest and a mouthpiece once they can seal their lips reliably. A spacer delivers more drug to the lungs and less to the mouth, and removes the co-ordination the child cannot yet manage.", "Give one puff at a time, with five tidal breaths through the spacer after each. Wash the spacer in warm soapy water and let it drip dry rather than rubbing it, which builds up static."] },
        { h: "The worry about inhaled steroids", p: ["This is the most frequent question, and it deserves a straight answer. Inhaled corticosteroids at the doses used in childhood asthma have a small effect on growth velocity, largely in the first year of treatment, with a minimal effect on final adult height.", "Against that, poorly controlled asthma itself impairs growth, disturbs sleep, costs school days and carries a real risk of severe attacks. Repeated courses of oral steroids — the consequence of stopping the controller — carry considerably more risk than the inhaler does."] },
        { h: "Triggers worth acting on at home", p: [], list: ["Tobacco smoke, including smoking outside the room or on a balcony — smoke travels on clothing and hair.", "Mosquito coils, incense, and cooking smoke in unventilated kitchens.", "House dust mite in bedding and soft toys.", "Damp and visible mould.", "Viral colds, which cause most childhood attacks and cannot be avoided entirely — which is why the controller continues through them."] },
        { h: "Get help urgently if", p: [], list: ["The reliever is not working, or is needed again within four hours.", "The child is too breathless to speak, eat or complete a sentence.", "You can see the skin sucking in between or below the ribs, or the tummy pulling under the ribcage.", "The lips or nail beds look blue or grey.", "The child becomes drowsy, floppy or confused.", "A quiet chest after a period of loud wheeze — this is more serious, not less."] },

      goTriage: () => this.go('triage'), goClubs: () => this.go('clubs'), goAllergy: () => this.go('allergy'),
      goCase: () => this.go('case'), goShikhar: () => this.go('shikhar'),
      goClubAsthma: () => this.goClub('asthma'), goClubCopd: () => this.goClub('copd'), goClubIld: () => this.goClub('ild'),
      /* triage */
      tSymTiles, tFollowRows,
      tS0: s.tStep === 0, tS1: s.tStep === 1, tS2: s.tStep === 2,
      tProgressW: Math.round(((s.tStep + 1) / 3) * 100) + '%',
      tNext: this.tNext, tBack: this.tBack, tRestart: this.tRestart,
      tCont0St: t0Ready ? contOn : contOff, tCont1St: t1Ready ? contOn : contOff,
      tNot0Ready: t0Ready ? 'false' : 'true', tNot1Ready: t1Ready ? 'false' : 'true',
      tNoneSel: s.tSel.length === 0,
      tAgeOpts: ['<18', '18–44', '45–59', '60+'].map(v => ({ label: v, pick: () => this.setState({ tAge: v }), st: this.pillSt(s.tAge === v) })),
      tSmokeOpts: ['Never', 'Former', 'Current'].map(v => ({ label: v, pick: () => this.setState({ tSmoke: v }), st: this.pillSt(s.tSmoke === v) })),
      tKnownOpts: ['None', 'Asthma', 'COPD', 'ILD / other'].map(v => ({ label: v, pick: () => this.setState({ tKnown: v }), st: this.pillSt(s.tKnown === v) })),
      tRisk: TL.risk + ' risk', tColor: TL.color, tSoft: TL.soft, tWhen: TL.when, tHeadline: TL.headline, tTe: TL.te, tAdvice: TL.advice,
      tHasReasons: tri.reasons.length > 0, tReasons, tSummary,
      tL0: tri.level === 0, tL1: tri.level === 1, tL2: tri.level === 2, tL3: tri.level === 3, tNotL3: tri.level !== 3,
      /* clubs */
      clubLabel: cc.label, clubTe: cc.te, clubAcademy: cc.academy, clubAcademyTe: cc.academyTe, clubChampTitle: cc.championsTitle,
      clubMember: cc.memberName, symptomQ: cc.symptomQ,
      symOpts: ['Good', 'Okay', 'Struggling'].map(v => ({ label: v, pick: () => this.cdPatch({ sym: v }), st: this.pillSt(cs.sym === v) })),
      todayLong: new Date().toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long' }),
      medRows,
      isDiaryTab: s.clubTab === 'diary', isContentTab: s.clubTab === 'content', isChampTab: s.clubTab === 'champions',
      setDiaryTab: () => this.setState({ clubTab: 'diary' }), setContentTab: () => this.setState({ clubTab: 'content' }), setChampTab: () => this.setState({ clubTab: 'champions' }),
      diaryTabSt: this.pillSt(s.clubTab === 'diary'), contentTabSt: this.pillSt(s.clubTab === 'content'), champTabSt: this.pillSt(s.clubTab === 'champions'),
      gzZones, gzHas, gzNoVal: !gzHas, gzX2: gzNeedle[0].toFixed(1), gzY2: gzNeedle[1].toFixed(1),
      gzVal: gzHas ? String(cs.today) : '—', gzUnit: isPef ? 'L/min' : '% SpO₂', gzMinL: String(gzMin), gzMaxL: String(gzMax),
      metricTitle: isPef ? 'Peak flow' : 'SpO₂', metricPlaceholder: isPef ? 'e.g., 410' : 'e.g., 96',
      pbLine: isPef ? 'Personal best: ' + cc.pb + ' L/min' : 'Target: 95–100%',
      clubVal: cs.val, onClubVal: (e) => this.cdPatch({ val: e.target.value }), valSave: this.valSave,
      warnShow: !!warn, warnC: warn ? warn.c : '#27784C', warnSf: warn ? warn.sf : '#E3F2E9', warnT: warn ? warn.t : '', warnX: warn ? warn.x : '',
      trendBars, ccVideos, ccChamps, ccLife,
      waMockMsg: 'Namaste ' + cc.memberName + '! Gentle reminder from your ' + cc.label + ' — we noticed missed controller doses this week. Your controller keeps tomorrow easy: log today\'s doses in your club diary. Reply HELP for a nurse call-back.',
      /* allergy */
      alOpts, alMonth: alCur.m, alIsNow: s.alSel === nowM,
      alAirLabel: alAir.label, alAirC: alAir.c, alAirSf: alAir.sf,
      alAllergens: alCur.allergens.map(t => ({ t })), alTip: alCur.tip
    };
  }
}
